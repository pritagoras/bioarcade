ATP."},"c":"b","ok":"Los triacilgliceroles (grasas neutras acumuladas en su joroba) representan el depósito energético más denso y liviano, y su oxidación metabólica además genera un alto rendimiento de agua metabólica."},{"n":"12","q":"La fibrosis quística se relaciona con:","o":{"a":"La ausencia de una enzima lisosómica que degrada glicolípidos de membrana.","b":"La ausencia de una enzima que interviene en el metabolismo de un aminoácido específico.","c":"La ausencia o mal funcionamiento del transportador del ión cloruro en la membrana plasmática.","d":"El mal plegamiento de las cadenas beta en la hemoglobina.","e":"La falta de ingesta de algún nutriente esencial."},"c":"c","ok":"La fibrosis quística es un trastorno genético recesivo causado por mutaciones en la proteína CFTR (Cystic Fibrosis Transmembrane Conductance Regulator), un canal iónico de cloruro en células epiteliales."},{"n":"13","q":"En la enfermedad de Tay-Sachs, se encuentran afectados:","o":{"a":"Las mitocondrias.","b":"Los lisosomas.","c":"Los peroxisomas.","d":"El complejo de Golgi.","e":"El RER."},"c":"b","ok":"Es una enfermedad de almacenamiento lisosómico caracterizada por la deficiencia de la enzima -hexosaminidasa A, lo que impide la degradación de gangliósidos en las neuronas."},{"n":"14","q":"El orgánulo del sistema de endomembranas encargado de la formación de vesículas de secreción es:","o":{"a":"El complejo de Golgi.","b":"El REL.","c":"El endosoma.","d":"El lisosoma.","e":"El RER."},"c":"a","ok":"La red del trans-Golgi (TGN) es la estación de empaquetamiento y distribución final donde se clasifican y brotan las vesículas secretoras (de exocitosis) recubiertas."},{"n":"15","q":"¿Cuál de las siguientes estructuras se encuentra tanto en células eucariontes como procariontes?","o":{"a":"Mitocondrias.","b":"Envoltura nuclear.","c":"Ribosomas.","d":"Citoesqueleto. (El citoesqueleto eucarionte típico compuesto por microtúbulos, microfilamentos e intermedios es propio de eucariontes, aunque las bacterias poseen homólogos proteicos).","e":"Ninguna de las anteriores."},"c":"c","ok":"Los ribosomas están presentes tanto en células procariontes como eucariontes y participan en la síntesis de proteínas. Sin embargo, las bacterias también poseen proteínas homólogas al citoesqueleto, por lo que la opción d puede resultar defendible según el nivel de definición adoptado; el ítem es ambiguo."},{"n":"16","q":"¿Cuál de las siguientes propiedades o funciones NO corresponde al citoesqueleto?","o":{"a":"Participa en el transporte de vesículas dentro de la célula.","b":"Participa en la división celular.","c":"Participa en la contracción muscular.","d":"Está formado por microfilamentos, filamentos intermedios y microtúbulos.","e":"Es estático."},"c":"e","ok":"La afirmación e es FALSA . El citoesqueleto es una red tridimensional altamente dinámica que se polimeriza y despolimeriza constantemente para adaptarse a las necesidades celulares."},{"n":"17","q":"En los peroxisomas de las células animales se lleva a cabo:","o":{"a":"La síntesis de ácidos grasos de una cadena muy larga.","b":"La degradación de ácidos grasos de una cadena muy larga.","c":"La fotólisis del H2O.","d":"La cadena respiratoria.","e":"La digestión intracelular."},"c":"b","ok":"Los peroxisomas realizan las etapas iniciales de la β-oxidación de ácidos grasos de cadena muy larga, acortándolos antes de que los productos puedan continuar su degradación, en muchos casos en las mitocondrias."},{"n":"18","q":"La anemia falciforme es una condición causada por:","o":{"a":"La falta de hierro en la dieta.","b":"La falta de ingesta de aminoácidos esenciales.","c":"La falta de ingesta de alguna vitamina necesaria para la absorción del hierro.","d":"La presencia de malaria.","e":"Algún cambio en la secuencia de las cadenas beta de la hemoglobina."},"c":"e","ok":"La anemia falciforme se debe a una mutación puntual en el gen de la β-globina que cambia el ácido glutámico por valina en la posición 6. La hemoglobina HbS resultante favorece la deformación de los eritrocitos en determinadas condiciones."},{"n":"1","q":"En el metabolismo:","o":{"a":"Las reacciones catabólicas no requieren de energía de activación.","b":"El ATP actúa como intermediario entre anabolismo y catabolismo.","c":"El ATP disminuye la energía de activación de las reacciones.","d":"Las reacciones anabólicas no requieren energía de activación."},"c":"b","ok":"El ATP actúa como la “moneda energética” celular: se sintetiza acoplando la energía liberada en las vías catabólicas exergónicas y posteriormente se hidroliza para aportar energía libre a los procesos anabólicos endergónicos. (Todas las reacciones químicas, anabólicas o catabólicas, requieren superar una energía de activación)."},{"n":"2","q":"Indique la frase correcta referida a las enzimas:","o":{"a":"Siempre necesitan una coenzima para poder actuar.","b":"Todas poseen la misma energía de activación.","c":"No modifican la energía de reactivos ni productos pero sí la energía de activación.","d":"No son afectadas en su actividad por modificaciones del pH."},"c":"c","ok":"Las enzimas reducen la energía de activación al estabilizar el estado de transición, pero no modifican las energías libres inicial y final de la reacción. Por eso no cambian el ΔG ni el equilibrio químico."},{"n":"3","q":"Una vía metabólica está regulada por un proceso de feedback o retroalimentación negativa si:","o":{"a":"Altas concentraciones de sustrato inhiben la formación de producto final.","b":"Bajas concentraciones de sustrato activan la formación de producto final.","c":"Bajas concentraciones de producto final actúan como inhibidor alostérico de la última enzima de la vía.","d":"Altas concentraciones de producto actúan como inhibidor alostérico de alguna de las primeras enzimas."},"c":"d","ok":"La inhibición por retroalimentación es un mecanismo de autorregulación donde la acumulación del producto final de una vía se une al sitio alostérico de la primera enzima (o la enzima marcapasos) de la secuencia, deteniendo la síntesis para evitar el sobreconsumo inútil de metabolitos y energía."},{"n":"5","q":"¿Cuál de las siguientes opciones nombra dos componentes de las membranas biológicas?","o":{"a":"Fosfolípidos y quitina.","b":"Colesterol y celulosa.","c":"Glucolípidos y triglicéridos.","d":"Fosfolípidos y glucoproteínas."},"c":"d","ok":"De acuerdo con el modelo del mosaico fluido, la estructura básica de las membranas celulares consiste en una bicapa lipídica (constituida por fosfolípidos) con proteínas intrínsecas o periféricas asociadas, muchas de las cuales poseen glúcidos acoplados (glucoproteínas)."},{"n":"6","q":"La fluidez de las membranas es mayor si:","o":{"a":"Aumenta la presencia de glúcidos en la cara externa de la bicapa.","b":"El colesterol se une a las proteínas integrales.","c":"Aumenta la presencia de enlaces dobles en las colas de fosfolípidos.","d":"Disminuye la presencia de enlaces dobles en las colas de fosfolípidos."},"c":"c","ok":"La presencia de dobles enlaces cis introduce curvaturas en las colas de los fosfolípidos y dificulta su empaquetamiento. Esto aumenta la fluidez de la membrana."},{"n":"10","q":"¿Cuáles de las siguientes organelas se encuentran en las células animales y se utilizan para el transporte de sustancias desde y hacia el exterior de la célula?","o":{"a":"Vacuolas.","b":"Vesículas.","c":"Plástidos.","d":"Peroxisomas."},"c":"b","ok":"Las vesículas membranosas permiten el transporte en masa hacia y desde la célula: participan tanto en endocitosis como en exocitosis y pueden fusionarse con la membrana plasmática o brotar de ella."},{"n":"13","q":"Los cloroplastos y mitocondrias:","o":{"a":"Son parte del sistema de endomembranas.","b":"Se encuentran en células procariontes y eucariontes.","c":"Poseen doble membrana y ADN circular.","d":"No se encuentran delimitados por membranas."},"c":"c","ok":"Las mitocondrias y los cloroplastos están delimitados por doble membrana y poseen ADN circular propio. Estas características son consistentes con su origen endosimbiótico."},{"n":"14","q":"El ciclo de Calvin:","o":{"a":"Genera energía para la etapa fotoquímica.","b":"Produce la ruptura de la molécula de agua.","c":"Forma parte de una vía catabólica.","d":"Forma parte de una vía anabólica."},"c":"d","ok":"El ciclo de Calvin es una vía anabólica porque utiliza ATP y NADPH para fijar y reducir CO₂ y generar moléculas orgánicas que sirven para la síntesis de carbohidratos."},{"n":"17","q":"Un organismo pluricelular, que utiliza el CO₂ atmosférico para sintetizar glúcidos, se clasifica dentro del reino:","o":{"a":"Hongos.","b":"Vegetales.","c":"Animales.","d":"Moneras."},"c":"b","ok":"Los organismos del reino Plantae (Vegetales) son fotosintéticos autótrofos y pluricelulares: toman atmosférico durante el ciclo de Calvin para sintetizar sus propias moléculas orgánicas."},{"n":"18","q":"Los microscopios electrónicos tienen:","o":{"a":"Menor poder de resolución que los ópticos.","b":"Mayor poder de resolución que los ópticos.","c":"Igual poder de resolución que los ópticos.","d":"No tienen poder de resolución."},"c":"b","ok":"Debido a que la longitud de onda de un haz de electrones es órdenes de magnitud menor que la de los fotones de la luz visible, los microscopios electrónicos alcanzan un poder de resolución muchísimo mayor (~0,2 nm frente a ~200 nm del óptico), permitiendo la observación detallada de la ultraestructura celular."},{"n":"19","q":"Indique ¿cuál de las siguientes moléculas puede funcionar como reserva energética a largo plazo?","o":{"a":"Colesterol.","b":"Triglicérido.","c":"Sacarosa.","d":"Glucosa."},"c":"b","ok":"Los triglicéridos (o triacilgliceroles) son los depósitos de reserva energética más eficientes a largo plazo en los seres vivos por estar altamente reducidos y ser no polares (anhidros), rindiendo más del doble de energía metabólica por gramo que los glúcidos."},{"n":"20","q":"El ADN contiene la información en:","o":{"a":"La disposición de los azúcares y los grupos fosfatos.","b":"La secuencia de desoxirribonucleótidos.","c":"La disposición de los puentes de hidrógeno que estabilizan la doble hélice.","d":"La complementariedad existente entre las bases púricas y pirimídicas."},"c":"b","ok":"El código genético o la información hereditaria radica en el orden o secuencia lineal específica de las bases nitrogenadas que forman los desoxirribonucleótidos a lo largo de la cadena polimérica."},{"n":"1","q":"¿Cuál de las siguientes es una característica estructural de las enzimas conjugadas?","o":{"a":"No poseen cofactor enzimático.","b":"No poseen un sitio activo.","c":"Están asociadas a coenzimas o iones.","d":"Su esquema se caracteriza por una curva clásica sigmoidea."},"c":"c","ok":"Las enzimas conjugadas (o holoenzimas) están compuestas por una parte proteica (apoenzima) y una parte no proteica (cofactor), la cual puede ser un ion metálico o un compuesto orgánico (coenzima)."},{"n":"2","q":"En cuanto a los lisosomas:","o":{"a":"Se fusionan con Peroxisomas en la lisis de sustancias.","b":"El pH determina su actividad catalítica.","c":"El secundario es inactivo.","d":"Las bombas de H+ de su membrana no generan un pH ácido."},"c":"b","ok":"Los lisosomas contienen hidrolasas cuyo funcionamiento óptimo requiere un pH ácido, mantenido por bombas de protones de la membrana. Por eso el pH luminal es un factor determinante de su actividad catalítica."},{"n":"3","q":"En relación con la respiración celular indique la opción correcta: ≈4.5 −5.0","o":{"a":"Comienza y finaliza en el interior de la mitocondria.","b":"Por cada molécula de glucosa se realiza un ciclo de Krebs.","c":"Por cada molécula de glucosa obtengo dos moléculas de ácido pirúvico.","d":"Es un proceso endergónico."},"c":"c","ok":"Durante la glucólisis (fase inicial citosólica), cada molécula de glucosa (6C) se rompe rindiendo dos moléculas de ácido pirúvico o piruvato (3C). Por cada glucosa se realizan dos ciclos de Krebs."},{"n":"4","q":"¿Cuál de las siguientes características corresponde al cloroplasto?","o":{"a":"Posee ADN lineal.","b":"Presenta una membrana interna con pigmentos fotosintéticos.","c":"Posee membrana tilacoidal con pigmentos fotosintéticos.","d":"Presenta la maquinaria fotosintética de las células vegetales y animales."},"c":"c","ok":"Los pigmentos fotosintéticos (como las clorofilas) y los fotosistemas se localizan exclusivamente en la membrana de los tilacoides dentro del estroma. Su ADN es circular."},{"n":"5","q":"Indicar cuál de las siguientes estructuras no forma parte de una membrana celular:","o":{"a":"Colesterol","b":"Proteínas integrales","c":"Ácido ribonucleico","d":"Oligosacáridos"},"c":"c","ok":"Las membranas biológicas están compuestas por lípidos (fosfolípidos, colesterol), proteínas e hidratos de carbono (oligosacáridos). No contienen ácidos nucleicos (ARN o ADN)."},{"n":"6","q":"La glucólisis es un proceso que:","o":{"a":"Se lleva a cabo en la mitocondria.","b":"Se lleva a cabo en el cloroplasto.","c":"Se lleva a cabo en el medio extracelular.","d":"Se lleva a cabo en el citosol."},"c":"d","ok":"La glucólisis es una vía metabólica anaeróbica soluble que ocurre íntegramente en el citoplasma/citosol celular."},{"n":"7","q":"Marque la opción correcta en cuanto a reinos:","o":{"a":"Todos los organismos del reino monera y el plantae son autótrofos.","b":"El monera, fungi, plantae tienen en común la pared celular formada por celulosa.","c":"El protista es procarionte y eucarionte.","d":"El monera es un descomponedor de materia orgánica."},"c":"d","ok":"Muchas bacterias del reino Monera cumplen un rol clave en los ecosistemas como saprófitas o descomponedoras de materia orgánica. (El reino Protista es exclusivamente eucarionte; la pared de hongos es de quitina y muchas bacterias son heterótrofas)."},{"n":"8","q":"Con respecto a las biomoléculas podemos decir:","o":{"a":"Los ácidos grasos son la principal fuente de energía.","b":"Los lípidos anfipáticos no forman bicapas.","c":"La celulosa forma un armazón proteico en células procariontes.","d":"La estructura terciaria de las proteínas determina la organización globular o fibrosa."},"c":"d","ok":"El tipo de plegamiento tridimensional que adopta la cadena polipeptídica en su estructura terciaria define si adquiere una conformación compacta/esférica (globular) o alargada (fibrosa)."},{"n":"9","q":"Las células eucariontes son:","o":{"a":"Pluricelulares y autótrofas.","b":"Autótrofas o heterótrofas.","c":"Sistemas cerrados.","d":"Unicelulares y heterótrofas."},"c":"b","ok":"El dominio eucariota engloba tanto a seres autótrofos (como plantas y algas) como a heterótrofos (como animales y hongos), pudiendo ser unicelulares o pluricelulares."},{"n":"10","q":"Indicar una característica de los peroxisomas:","o":{"a":"Forman parte del sistema de endomembranas.","b":"Se ubica en la membrana plasmática.","c":"Degradan bacterias.","d":"Metabolizan el peróxido de hidrógeno."},"c":"d","ok":"Los peroxisomas contienen enzimas oxidativas, entre ellas catalasa, que descompone el peróxido de hidrógeno (H₂O₂) en agua y oxígeno, ayudando a controlar especies reactivas de oxígeno."},{"n":"11","q":"¿Cuál es la función del retículo endoplasmático granular (REG)?","o":{"a":"Almacenar el Ca2+ intracelular.","b":"Sintetizar lípidos de membrana.","c":"Forma parte del mecanismo de digestión celular.","d":"Sintetizar proteínas de distinto destino."},"c":"d","ok":"Los ribosomas adosados a su membrana sintetizan proteínas destinadas a secreción, lisosomas o integración en membranas celulares."},{"n":"12","q":"¿Cuál es la función de la molécula de ATP?","o":{"a":"Es un catalizador biológico.","b":"Disminuir la energía de activación.","c":"Transmitir información genética.","d":"Es un mediador energético."},"c":"d","ok":"El ATP funciona como la “moneda energética” o intermediario que acopla químicamente las reacciones exergónicas (catabolismo) con las endergónicas (anabolismo y trabajo celular)."},{"n":"13","q":"Marque una de las diferencias entre las células eucariontes y procariontes:","o":{"a":"Ambas poseen núcleo.","b":"Ninguna posee ribosomas.","c":"Se diferencian en su mecanismo de división celular.","d":"Ambas poseen mitocondrias."},"c":"c","ok":"Las células procariontes se dividen por fisión binaria simple, mientras que las eucariontes realizan división celular compleja por mitosis o meiosis. (Las procariontes carecen de núcleo y mitocondrias)."},{"n":"14","q":"¿Cuál de las siguientes estructuras es únicamente de composición proteica?","o":{"a":"Microtúbulos","b":"Membrana celular","c":"Glucógeno","d":"Almidón"},"c":"a","ok":"Los microtúbulos están formados por polímeros de tubulina α y β. La membrana celular contiene lípidos, proteínas y glúcidos, mientras que el glucógeno y el almidón son polisacáridos."},{"n":"15","q":"En la fotosíntesis:","o":{"a":"Es un proceso exergónico y de formación de ATP.","b":"Los productos de la etapa lumínica son glúcidos.","c":"Los fotosistemas I y II sintetizan ATP.","d":"Comprende la formación de glúcidos en el ciclo de Calvin-Benson."},"c":"d","ok":"En el ciclo de Calvin-Benson se fija el CO₂ y, utilizando ATP y NADPH de la fase luminosa, se sintetizan compuestos orgánicos a partir de los cuales se forman glúcidos."},{"n":"16","q":"Ordenar de forma creciente los elementos, según los niveles de organización:","o":{"a":"agua – oxígeno – virus – planta.","b":"oligosacárido – glucógeno – mitocondria – célula.","c":"almidón – ácido graso – cloroplasto – tejido muscular.","d":"célula – RER – ácidos nucleicos – aminoácido."},"c":"b","ok":"El orden creciente correcto es: oligosacárido → glucógeno → mitocondria → célula. Se pasa de un nivel molecular relativamente pequeño a una macromolécula, luego a un orgánulo y finalmente al nivel celular."},{"n":"17","q":"¿Cuál de los siguientes elementos está compuesto por lípidos?","o":{"a":"Ribosoma","b":"Envoltura nuclear","c":"Centriolo","d":"Cromosoma"},"c":"b","ok":"La envoltura o carioteca nuclear es una estructura membranosa constituida por una doble bicapa lipídica con proteínas asociadas. Los ribosomas, centriolos y cromosomas carecen de componentes lipídicos."},{"n":"18","q":"¿Cuál es la característica estructural de los microfilamentos?","o":{"a":"Están formados por monómeros de actina G.","b":"Están formados por monómeros de tubulina.","c":"Formar parte de la estructura de cilios.","d":"Están formados por proteínas llamadas laminina."},"c":"a","ok":"Los microfilamentos del citoesqueleto se forman por la polimerización de la proteína globular actina G para constituir filamentos de actina F."},{"n":"19","q":"¿Cuál de las siguientes oraciones caracteriza mejor al reino plantae?","o":{"a":"Es el único autótrofo.","b":"En cuanto al número de células, es pluricelular.","c":"Posee un mecanismo de reproducción sexual.","d":"Sus células se encargan de fijar el nitrógeno atmosférico."},"c":"b","ok":"Las plantas son organismos pluricelulares y las angiospermas, gimnospermas y otros grupos vegetales presentan reproducción sexual. Como la opción b y la opción c son ambas compatibles con Plantae, el enunciado no establece una única respuesta inequívoca."},{"n":"20","q":"Con respecto a los virus:","o":{"a":"Son proteínas con capacidad infectiva en el sistema nervioso central.","b":"La reproducción viral se lleva a cabo en el citoplasma eucarionte.","c":"Son moléculas de ARN o ADN, asociadas a proteínas.","d":"Poseen su propia maquinaria biosintética."},"c":"c","ok":"Los virus son complejos macromoleculares o parásitos intracelulares obligados constituidos por un genoma de ácido nucleico (ADN o ARN) rodeado por una cubierta proteica llamada cápside. Carecen de maquinaria biosintética propia."},{"n":"1","q":"Los seres vivos:","o":{"a":"Poseen un metabolismo propio.","b":"Se consideran vivos solo si poseen material genético.","c":"Poseen sus células siempre encapsuladas.","d":"Pueden reproducirse valiéndose de la maquinaria de otro organismo."},"c":"a","ok":"Todos los seres vivos son sistemas abiertos autorregulados con capacidad de realizar metabolismo (intercambio y transformación de materia y energía con el entorno). Los virus poseen material genético y se reproducen con maquinaria ajena, pero carecen de metabolismo propio y no se consideran seres vivos autónomos."},{"n":"2","q":"La homeostasis es la capacidad de:","o":{"a":"Separarse del entorno.","b":"Romper macromoléculas para generar ATP.","c":"Utilizar ATP para realizar un trabajo.","d":"Mantener el medio interno constante."},"c":"d","ok":"La homeostasis se define como el conjunto de mecanismos fisiológicos orientados a mantener la estabilidad y constancia de las propiedades fisicoquímicas del medio interno celular u orgánico frente a las variaciones del exterior."},{"n":"3","q":"El límite de resolución es la capacidad de un:","o":{"a":"Organismo para ser visto.","b":"Sistema óptico para ver a lo lejos.","c":"Sistema óptico para ver determinado organismo.","d":"Sistema óptico para ver dos puntos como separados."},"c":"d","ok":"En microscopía, el límite de resolución representa la menor distancia que debe existir entre dos puntos contiguos para que un sistema óptico pueda distinguirlos como entidades independientes y separadas."},{"n":"4","q":"Para ver la estructura de la membrana plasmática de una célula se utiliza:","o":{"a":"El microscopio óptico sin teñir.","b":"El microscopio óptico con tinción.","c":"El microscopio electrónico de transmisión.","d":"No puede verse la célula ni sus componentes al microscopio."},"c":"c","ok":"La membrana plasmática tiene un grosor del orden de 7–10 nm, menor que el límite de resolución del microscopio óptico, que es de aproximadamente 200 nm. Por eso su organización trilaminar se observa con un microscopio electrónico de transmisión."},{"n":"5","q":"Los glúcidos se caracterizan por:","o":{"a":"Representar la principal fuente de energía para la célula.","b":"Ser polihidroxialdehídos o polihidroxicetonas.","c":"Estar compuestos por C, H y O.","d":"Todas son correctas."},"c":"d","ok":"Los glúcidos son polihidroxialdehídos o polihidroxicetonas y sus derivados o polímeros; están formados principalmente por C, H y O. En muchas células constituyen una fuente importante de energía metabólica inmediata."},{"n":"6","q":"Los polisacáridos:","o":{"a":"Se dividen en homopolisacáridos y heteropolisacáridos.","b":"Poseen hasta 10 monómeros unidos.","c":"Están formados por lactosa y otro monosacárido.","d":"Conforman el glucocálix."},"c":"a","ok":"Se clasifican estructuralmente según su composición en homopolisacáridos (formados por un único tipo de monosacárido, como la glucosa en el glucógeno) y heteropolisacáridos (formados por más de un tipo de monosacárido)."},{"n":"7","q":"Los monosacáridos son aquellos glúcidos que:","o":{"a":"Son llamados también azúcares complejos.","b":"Están compuestos por polímeros de glucosa.","c":"Son monómeros de moléculas más complejas.","d":"No poseen actividad óptica."},"c":"c","ok":"Los monosacáridos son los glúcidos más simples y actúan como monómeros que se combinan para formar oligosacáridos y polisacáridos. No pueden hidrolizarse en carbohidratos más sencillos."}];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mazo,idx,resp,ac,er,rk,mk,fal,sal,modo,AC;
function barajar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(seq){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);t+=d}}catch(e){}}
function iniciar(lista,m){mazo=barajar(lista);modo=m;idx=0;resp=false;ac=er=rk=mk=0;fal=[];sal=[];$('#pb').style.width='0';render()}
function hud(){const n=ac+er,t=mazo.length,c=idx+(resp?1:0);
$('#hr').textContent=`🔥 Racha ${rk} (récord ${mk})`;$('#ha').textContent=`✅ ${ac}`;$('#he').textContent=`❌ ${er}`;
$('#hp').textContent=n?`🎯 ${Math.round(100*ac/n)}%`:'🎯 --%';
$('#pt').textContent=`${modo=='repaso'?'Repaso':'Pregunta'} ${Math.min(idx+1,t)} de ${t}`;
$('#pr').textContent=`Quedan ${t-c} · saltadas ${sal.length}`;
$('#pb').style.width=(100*c/t)+'%'}
function btns(){$('#bn').disabled=!resp;$('#bs').disabled=resp||idx>=mazo.length}
function render(){const q=mazo[idx],m=$('#main');hud();
if(!q){final();btns();return}
m.innerHTML=`<div class="card"><small>${modo=='repaso'?'🔁 Repaso':'❓ Pregunta'} · n.º original ${esc(q.n)}</small><h2>${esc(q.q)}</h2></div>`+
Object.keys(q.o).sort().map(l=>`<button class="op" data-l="${l}"><b>${l.toUpperCase()}</b><span>${esc(q.o[l])}</span></button>`).join('')+'<div id="ex"></div>';
m.querySelectorAll('.op').forEach(b=>b.onclick=()=>responder(b.dataset.l));btns();window.scrollTo(0,0)}
function responder(l){if(resp||idx>=mazo.length)return;resp=true;const q=mazo[idx],ok=l==q.c;
if(ok){ac++;rk++;mk=Math.max(mk,rk);beep([[660,.09],[990,.16]])}else{er++;rk=0;fal.push(q);beep([[220,.17],[140,.32]])}
document.querySelectorAll('.op').forEach(b=>{b.disabled=true;const x=b.dataset.l;b.classList.add(x==q.c?'ok':x==l?'mal':'dim')});
let h=`<div class="res ${ok?'g':'r'}">${ok?'🎉 ¡Correcto!'+(rk>1?' 🔥 x'+rk:''):'💥 Incorrecto: elegiste la '+l.toUpperCase()}</div>`;
const cab=`✅ Correcta: ${q.c.toUpperCase()}) ${esc(q.o[q.c])}`;
h+=`<div class="box g"><b>${cab}</b><p>${esc(q.ok||'El PDF no incluye explicación para esta pregunta.')}</p></div>`;
const ex=$('#ex');ex.innerHTML=h;ex.scrollIntoView({behavior:'smooth',block:'start'});hud();btns()}
function siguiente(){if(!resp)return;idx++;resp=false;render()}
function saltar(){if(resp||idx>=mazo.length)return;sal.push(mazo[idx]);idx++;render()}
function reiniciar(){if((idx>0||resp)&&idx<mazo.length&&!confirm('Se vuelve a mezclar todo el mazo y se pierden los puntajes. ¿Continuar?'))return;iniciar(D,'parcial')}
function final(){const n=ac+er,ef=n?Math.round(100*ac/n):0,p=fal.length+sal.length;
$('#main').innerHTML=`<div class="fin"><h2>${ef>=80?'🏆':ef>=60?'🥈':'📚'} ¡Mazo completado!</h2><p>✅ Aciertos: ${ac} · ❌ Errores: ${er} · ⏭ Saltadas: ${sal.length}<br>🎯 Efectividad: ${ef}% · 🔥 Mejor racha: ${mk}</p>`+
(p?`<button style="background:var(--ac)" id="rp">🔁 Repasar falladas y saltadas (${p})</button>`:'')+`<button style="background:#5A1E3A" id="nw">🔄 Nuevo parcial</button></div>`;
if(p)$('#rp').onclick=()=>iniciar(fal.concat(sal),'repaso');$('#nw').onclick=()=>iniciar(D,'parcial')}
$('#bn').onclick=siguiente;$('#bs').onclick=saltar;$('#br').onclick=reiniciar;
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase(),q=mazo[idx];
if(q&&q.o[k]&&k.length==1)responder(k);else if(k=='enter'||k=='arrowright'||k==' '){if(resp){e.preventDefault();siguiente()}}else if(k=='s')saltar()});
iniciar(D,'parcial');
</script>
</body>
</html>
