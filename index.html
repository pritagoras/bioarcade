<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioArcade · Quiz por temas</title>
<style>
:root{--bg:#0F0826;--pn:#1A1040;--op:#2A1B66;--oh:#3B2A8C;--bd:#4B34B0;--ac:#8B5CF6;--tx:#F1ECFF;--su:#B8ABE6;--ok:#2ECC71;--er:#E74C3C;--or:#FFA62B;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 6px}
.hud{max-width:820px;margin:auto;background:var(--pn);border-radius:18px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-weight:700}
.hud h1{font-size:20px;margin:0 auto 0 0;color:var(--ac)}
.hud button{background:var(--op);color:#fff;border:0;border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.pg{max-width:820px;margin:8px auto 0;font-size:13px;color:var(--su);display:flex;justify-content:space-between}
.bar{max-width:820px;margin:4px auto 0;height:12px;border-radius:6px;background:var(--pn);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6D3AE8,var(--ac));transition:width .45s ease}
main{max-width:820px;margin:auto;padding:8px 14px 24px}
.card{background:var(--pn);border:2px solid var(--bd);border-radius:18px;padding:16px 20px;margin-bottom:12px}
.card small{color:var(--ac);font-weight:600}
.card h2{font-size:21px;margin:6px 0 0;line-height:1.35}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--op);color:var(--tx);border:2px solid var(--bd);border-radius:16px;font:inherit;font-size:17px;cursor:pointer;transition:background .15s,border-color .15s}
.op b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.op:hover:not(:disabled){background:var(--oh);border-color:var(--ac)}
.op:disabled{cursor:default}
.op.dim{opacity:.5}
.op.ok{background:var(--ok);border-color:#A9F5C8;color:#04210F;opacity:1}
.op.ok b{background:#04210F;color:var(--ok)}
.op.mal{background:var(--er);border-color:#FFB3AB;color:#fff;opacity:1}
.op.mal b{background:#fff;color:var(--er)}
.tema b{background:var(--pn);border:2px solid var(--bd)}
.tema.on{background:var(--oh);border-color:var(--ac)}
.tema.on b{background:var(--ac);border-color:var(--ac)}
.tema small{color:var(--su);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.row small{color:var(--su)}
.chip{background:var(--op);color:var(--tx);border:2px solid var(--bd);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac)}
.go{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
#ex{margin-top:16px;animation:up .35s ease-out}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
.res{font-size:22px;font-weight:800;margin-bottom:8px}
.res.g{color:var(--ok)}.res.r{color:var(--er)}
.box{border-radius:14px;padding:12px 16px;margin:10px 0;border:2px solid}
.box.g{background:#0F3A26;border-color:var(--ok)}.box.g>b{color:var(--ok)}
.box.r{background:#3B1420;border-color:var(--er)}.box.r>b{color:#FF8A7E}
.box.w{background:#3A2A0A;border-color:var(--or)}.box.w>b{color:var(--or)}
.box p{margin:4px 0 0;font-size:15px}
.src{color:var(--su);font-size:13px}
footer{position:sticky;bottom:0;background:var(--bg);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.ctl{max-width:820px;margin:auto;background:var(--pn);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctl button,.fin button{min-height:46px;border:0;border-radius:14px;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#bs{background:var(--op)}#bn{background:var(--ac)}#br{background:#5A1E3A}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.fin{text-align:center;background:var(--pn);border:3px solid var(--ac);border-radius:22px;padding:28px 16px;margin-top:24px}
.fin h2{font-size:30px;color:var(--ac);margin:0 0 10px}
.fin button{padding:0 18px;margin:8px 6px}
.menu .hud>:not(h1),.menu .pg,.menu .bar,.menu footer{display:none}
@media(max-width:560px){.ctl button{font-size:13px}.card h2{font-size:18px}.op{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="menu">
<header>
<div class="hud"><h1>🧬 BioArcade</h1><span id="hr" style="color:var(--or)"></span><span id="ha" style="color:var(--ok)"></span><span id="he" style="color:var(--er)"></span><span id="hp"></span><button id="bh">🏠 Temas</button></div>
<div class="pg"><span id="pt"></span><span id="pr"></span></div>
<div class="bar"><i id="pb"></i></div>
</header>
<main id="main"></main>
<footer><div class="ctl"><button id="bs">⏭ Saltar pregunta</button><button id="bn">Siguiente ▶</button><button id="br">🔄 Reiniciar</button></div></footer>
<script>
/* Lee indice_temas.json y cada archivo de tema desde la misma carpeta del sitio.
   Para agregar un tema: subí su tema_*.json y sumá una entrada en indice_temas.json. */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TEMAS=[],FALLOS=[],SEL=new Set(),DIF='todas',mazo=[],idx=0,resp=false,ac=0,er=0,rk=0,mk=0,fal=[],sal=[],modo='practica',AC;
const barajar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function beep(seq){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);t+=d}}catch(e){}}
const pool=()=>TEMAS.filter(t=>SEL.has(t.id)).flatMap(t=>t.preguntas.map(q=>Object.assign({_t:t.titulo},q))).filter(q=>DIF=='todas'||q.dificultad==DIF);

async function cargar(){
  const m=$('#main');m.innerHTML='<div class="card"><h2>Cargando temas…</h2></div>';
  try{
    const ix=await(await fetch('indice_temas.json',{cache:'no-store'})).json();
    const res=await Promise.allSettled(ix.temas.map(t=>fetch(t.archivo,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()})));
    TEMAS=[];FALLOS=[];
    res.forEach((r,i)=>{const t=ix.temas[i];
      if(r.status=='fulfilled'&&r.value.preguntas&&r.value.preguntas.length)TEMAS.push(Object.assign({id:t.id,titulo:t.titulo,descripcion:''},r.value.tema||{},{preguntas:r.value.preguntas}));
      else FALLOS.push(t.archivo)});
    if(!TEMAS.length)throw 0;
    SEL=new Set(TEMAS.map(t=>t.id));menu();
  }catch(e){
    m.innerHTML='<div class="box r"><b>⚠ No se pudieron cargar los temas</b><p>'+(location.protocol=='file:'?'Abriste el archivo directamente y el navegador bloquea la carga. Abrí la página desde su link de GitHub Pages.':'Revisá que <code>indice_temas.json</code> y los archivos <code>tema_*.json</code> estén subidos junto al <code>index.html</code>.')+'</p></div>';
  }
}
function menu(){
  document.body.className='menu';
  const ds=['facil','media','dificil'].filter(d=>TEMAS.some(t=>t.preguntas.some(q=>q.dificultad==d)));
  const nm={todas:'Todas',facil:'Fácil',media:'Media',dificil:'Difícil'},n=pool().length;
  $('#main').innerHTML='<div class="card"><small>🎮 NUEVA PARTIDA</small><h2>¿Qué querés practicar?</h2></div>'+
  (FALLOS.length?'<div class="box r"><b>⚠ No se pudieron cargar:</b><p>'+FALLOS.map(esc).join(', ')+'</p></div>':'')+
  TEMAS.map(t=>`<button class="op tema${SEL.has(t.id)?' on':''}" data-t="${esc(t.id)}"><b>${SEL.has(t.id)?'✓':''}</b><span><strong>${esc(t.titulo)}</strong><br><small>${esc(t.descripcion||'')}${t.descripcion?' · ':''}${t.preguntas.length} preguntas</small></span></button>`).join('')+
  '<div class="row"><button class="chip" data-a="todos">Todos</button><button class="chip" data-a="ninguno">Ninguno</button></div>'+
  (ds.length?'<div class="row"><small>Dificultad:</small>'+['todas'].concat(ds).map(d=>`<button class="chip${DIF==d?' on':''}" data-d="${d}">${nm[d]}</button>`).join('')+'</div>'+(DIF!='todas'?'<small class="src">Las preguntas sin nivel de dificultad no entran cuando filtrás.</small>':''):'')+
  `<div class="row"><button class="go" id="go"${n?'':' disabled'}>▶ Empezar (${n} preguntas)</button></div>`;
  window.scrollTo(0,0);
}
function iniciar(lista,m){document.body.className='';mazo=barajar(lista);modo=m;idx=0;resp=false;ac=er=rk=mk=0;fal=[];sal=[];$('#pb').style.width='0';render()}
function hud(){const n=ac+er,t=mazo.length,c=idx+(resp?1:0);
$('#hr').textContent=`🔥 Racha ${rk} (récord ${mk})`;$('#ha').textContent=`✅ ${ac}`;$('#he').textContent=`❌ ${er}`;
$('#hp').textContent=n?`🎯 ${Math.round(100*ac/n)}%`:'🎯 --%';
$('#pt').textContent=`${modo=='repaso'?'Repaso':'Pregunta'} ${Math.min(idx+1,t)} de ${t}`;
$('#pr').textContent=`Quedan ${t-c} · saltadas ${sal.length}`;
$('#pb').style.width=(100*c/t)+'%'}
function btns(){$('#bn').disabled=!resp;$('#bs').disabled=resp||idx>=mazo.length}
function render(){const q=mazo[idx],m=$('#main');hud();
if(!q){final();btns();return}
m.innerHTML=`<div class="card"><small>${modo=='repaso'?'🔁 Repaso':'❓'} ${esc(q._t)}${q.subtema?' · '+esc(q.subtema):''}</small><h2>${esc(q.pregunta)}</h2></div>`+
Object.keys(q.opciones).sort().map(l=>`<button class="op" data-l="${l}"><b>${l.toUpperCase()}</b><span>${esc(q.opciones[l])}</span></button>`).join('')+'<div id="ex"></div>';
m.querySelectorAll('.op').forEach(b=>b.onclick=()=>responder(b.dataset.l));btns();window.scrollTo(0,0)}
function responder(l){if(resp||idx>=mazo.length)return;resp=true;const q=mazo[idx],ok=l==q.correcta;
if(ok){ac++;rk++;mk=Math.max(mk,rk);beep([[660,.09],[990,.16]])}else{er++;rk=0;fal.push(q);beep([[220,.17],[140,.32]])}
document.querySelectorAll('.op').forEach(b=>{b.disabled=true;const x=b.dataset.l;b.classList.add(x==q.correcta?'ok':x==l?'mal':'dim')});
let h=`<div class="res ${ok?'g':'r'}">${ok?'🎉 ¡Correcto!'+(rk>1?' 🔥 x'+rk:''):'💥 Incorrecto: elegiste la '+l.toUpperCase()}</div>`;
h+=`<div class="box g"><b>✅ Correcta: ${q.correcta.toUpperCase()}) ${esc(q.opciones[q.correcta])}</b><p>${esc(q.justificacion_correcta||'Esta pregunta no tiene explicación.')}</p>${q.fuente?`<p class="src">📎 ${esc(q.fuente)}</p>`:''}</div>`;
if(q.aviso)h+=`<div class="box w"><b>⚠ Pregunta dudosa</b><p>${esc(q.aviso)}</p></div>`;
const ex=$('#ex');ex.innerHTML=h;ex.scrollIntoView({behavior:'smooth',block:'start'});hud();btns()}
function siguiente(){if(!resp)return;idx++;resp=false;render()}
function saltar(){if(resp||idx>=mazo.length)return;sal.push(mazo[idx]);idx++;render()}
function enCurso(){return idx>0&&idx<mazo.length||resp&&idx<mazo.length}
function reiniciar(){if(enCurso()&&!confirm('Se vuelve a mezclar el mazo y se pierden los puntajes. ¿Continuar?'))return;iniciar(pool(),'practica')}
function final(){const n=ac+er,ef=n?Math.round(100*ac/n):0,p=fal.length+sal.length;
$('#main').innerHTML=`<div class="fin"><h2>${ef>=80?'🏆':ef>=60?'🥈':'📚'} ¡Terminaste!</h2><p>✅ Aciertos: ${ac} · ❌ Errores: ${er} · ⏭ Saltadas: ${sal.length}<br>🎯 Efectividad: ${ef}% · 🔥 Mejor racha: ${mk}</p>`+
(p?`<button style="background:var(--ac)" id="rp">🔁 Repasar falladas y saltadas (${p})</button>`:'')+`<button style="background:#5A1E3A" id="rs">🔄 Practicar de nuevo</button><button style="background:var(--op)" id="mt">🏠 Elegir otro tema</button></div>`;
if(p)$('#rp').onclick=()=>iniciar(fal.concat(sal),'repaso');$('#rs').onclick=()=>iniciar(pool(),'practica');$('#mt').onclick=menu}
$('#main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!document.body.classList.contains('menu'))return;
if(b.dataset.t){SEL.has(b.dataset.t)?SEL.delete(b.dataset.t):SEL.add(b.dataset.t);menu()}
else if(b.dataset.a){b.dataset.a=='todos'?TEMAS.forEach(t=>SEL.add(t.id)):SEL.clear();menu()}
else if(b.dataset.d){DIF=b.dataset.d;menu()}
else if(b.id=='go')iniciar(pool(),'practica')});
$('#bn').onclick=siguiente;$('#bs').onclick=saltar;$('#br').onclick=reiniciar;
$('#bh').onclick=()=>{if(enCurso()&&!confirm('Salís de la partida y se pierde el puntaje. ¿Continuar?'))return;menu()};
addEventListener('keydown',e=>{if(document.body.classList.contains('menu')||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase(),q=mazo[idx];
if(q&&q.opciones[k]&&k.length==1)responder(k);else if(k=='enter'||k=='arrowright'||k==' '){if(resp){e.preventDefault();siguiente()}}else if(k=='s')saltar()});
cargar();
</script>
</body>
</html>
