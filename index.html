<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioArcade · Biología Celular y Molecular</title>
<style>
:root{--bg:#0F0826;--pn:#1A1040;--op:#2A1B66;--oh:#3B2A8C;--bd:#4B34B0;--ac:#8B5CF6;--tx:#F1ECFF;--su:#B8ABE6;--ok:#2ECC71;--er:#E74C3C;--or:#FFA62B;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 6px}
.hud{max-width:820px;margin:auto;background:var(--pn);border-radius:18px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-weight:700}
.hud h1{font-size:20px;margin:0 auto 0 0;color:var(--ac)}
.pg{max-width:820px;margin:8px auto 0;font-size:13px;color:var(--su);display:flex;justify-content:space-between}
.bar{max-width:820px;margin:4px auto 0;height:12px;border-radius:6px;background:var(--pn);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6D3AE8,var(--ac));transition:width .45s ease}
main{max-width:820px;margin:auto;padding:8px 14px 24px}
.card{background:var(--pn);border:2px solid var(--bd);border-radius:18px;padding:16px 20px;margin-bottom:12px}
.card small{color:var(--ac);font-weight:600}
.card h2{font-size:21px;margin:6px 0 0;line-height:1.35}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--op);color:var(--tx);border:2px solid var(--bd);border-radius:16px;font:inherit;font-size:17px;cursor:pointer;transition:background .15s,border-color .15s}
.op b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.op:hover:not(:disabled){background:var(--oh);border-color:var(--ac)}
.op:disabled{cursor:default}
.op.dim{opacity:.5}
.op.ok{background:var(--ok);border-color:#A9F5C8;color:#04210F;opacity:1}
.op.ok b{background:#04210F;color:var(--ok)}
.op.mal{background:var(--er);border-color:#FFB3AB;color:#fff;opacity:1}
.op.mal b{background:#fff;color:var(--er)}
#ex{margin-top:16px;animation:up .35s ease-out}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
.res{font-size:22px;font-weight:800;margin-bottom:8px}
.res.g{color:var(--ok)}.res.r{color:var(--er)}
.box{border-radius:14px;padding:12px 16px;margin:10px 0;border:2px solid}
.box.g{background:#0F3A26;border-color:var(--ok)}.box.g>b{color:var(--ok)}
.box.r{background:#3B1420;border-color:var(--er)}.box.r>b{color:#FF8A7E}
.box p{margin:4px 0 0;font-size:15px}
.d{display:flex;gap:10px;padding:8px;border-radius:10px;margin-top:6px}
.d.sel{background:#4A1B29;outline:2px solid var(--er)}
.d>b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--er);display:grid;place-items:center;font-size:14px}
.d i{font-weight:700;color:#FFB3AB;font-style:normal}
.d p{margin:2px 0 0;font-size:15px}
footer{position:sticky;bottom:0;background:var(--bg);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.ctl{max-width:820px;margin:auto;background:var(--pn);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctl button,.fin button{min-height:46px;border:0;border-radius:14px;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#bs{background:var(--op)}#bn{background:var(--ac)}#br{background:#5A1E3A}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.fin{text-align:center;background:var(--pn);border:3px solid var(--ac);border-radius:22px;padding:28px 16px;margin-top:24px}
.fin h2{font-size:30px;color:var(--ac);margin:0 0 10px}
.fin button{padding:0 18px;margin:8px 6px}
@media(max-width:560px){.ctl button{font-size:13px}.card h2{font-size:18px}.op{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
<div class="hud"><h1>🧬 BioArcade</h1><span id="hr" style="color:var(--or)"></span><span id="ha" style="color:var(--ok)"></span><span id="he" style="color:var(--er)"></span><span id="hp"></span></div>
<div class="pg"><span id="pt"></span><span id="pr"></span></div>
<div class="bar"><i id="pb"></i></div>
</header>
<main id="main"></main>
<footer><div class="ctl"><button id="bs">⏭ Saltar pregunta</button><button id="bn">Siguiente ▶</button><button id="br">🔄 Reiniciar parcial</button></div></footer>
<script>
const D=[{"n":"1","q":"Una molécula de ADN tiene:","o":{"a":"el mismo número de adeninas que guaninas","b":"el mismo número de adeninas que de timinas","c":"el mismo número de adeninas que uracilos","d":"el mismo número de guaninas que de timinas"},"c":"b","ok":"Según la regla de Chargaff, en el ADN bicatenario la adenina se aparea con la timina, por lo que sus cantidades son iguales; la guanina se aparea con la citosina. El uracilo es propio del ARN, no del ADN."},{"n":"2","q":"¿Cómo son las uniones de moléculas de ADN?","o":{"a":"las dos cadenas se unen entre sí a través de las bases nitrogenadas por uniones fosfodiéster","b":"las dos cadenas se unen entre sí a través de las bases nitrogenadas por uniones puentes hidrógeno","c":"los nucleótidos en la misma cadena se unen entre sí mediante uniones puente de hidrógeno","d":"los nucleótidos de la misma cadena se unen entre sí mediante su base nitrogenada"},"c":"b","ok":"Las dos hebras antiparalelas del ADN se mantienen unidas por puentes de hidrógeno entre sus bases complementarias (A=T y G≡C). Los nucleótidos de una misma cadena se unen covalentemente mediante enlaces fosfodiéster."},{"n":"3","q":"Los fosfolípidos y los glucolípidos:","o":{"a":"forman parte de las paredes de la célula eucarionte","b":"forman parte de las paredes celulares en animales","c":"forman parte de la membrana plasmática y de las membranas de las organelas","d":"forman parte de la membrana plasmática en eucariontes, pero no en procariontes"},"c":"c","ok":"Son componentes estructurales clave de las bicapas lipídicas de todas las membranas celulares y del sistema de endomembranas. Las células animales no poseen pared celular."},{"n":"4","q":"Los triglicéridos se caracterizan porque:","o":{"a":"se sintetizan a partir del glicerol y ácidos grasos","b":"forman la membrana plasmática","c":"conforman las membranas de organelas","d":"almacenan energía en el glicerol"},"c":"a","ok":"Un triglicérido es una molécula de reserva energética formada por la esterificación de una molécula de glicerol con tres moléculas de ácidos grasos. No cumplen funciones estructurales en membranas."},{"n":"5","q":"Un ácido graso está formado por:","o":{"a":"un grupo carboxilo soluble en agua y una cadena carbonada también soluble en agua","b":"un grupo amino anfipático y una cadena carbonada insoluble en agua","c":"un grupo carboxilo y dos cadenas carbonadas","d":"un grupo carboxilo soluble en agua y una cadena carbonada insoluble en agua"},"c":"d","ok":"Los ácidos grasos poseen un grupo carboxilo polar, que puede ionizarse en agua, unido a una cadena hidrocarbonada apolar e hidrofóbica. Esta combinación explica su carácter anfipático."},{"n":"6","q":"¿Cuál de las siguientes moléculas es un polisacárido de reserva en células animales y vegetales respectivamente?","o":{"a":"glucógeno y almidón","b":"almidón y glucógeno","c":"celulosa y glucógeno","d":"glucógeno y celulosa"},"c":"a","ok":"El glucógeno es la reserva energética de glucosa en animales (hígado y músculo), mientras que el almidón es la reserva energética en vegetales. La celulosa es estructural, no de reserva."},{"n":"7","q":"¿Cuál de las siguientes moléculas es un disacárido?","o":{"a":"glucógeno","b":"celulosa","c":"lactosa","d":"almidón"},"c":"c","ok":"La lactosa es un disacárido formado por la unión de glucosa y galactosa. El glucógeno, la celulosa y el almidón son polisacáridos."},{"n":"8","q":"La celulosa, el glucógeno y el almidón están formados por:","o":{"a":"lactosas y glucosas","b":"dos tipos de monosacáridos distintos","c":"glucosas","d":"glucosas y fructosa"},"c":"c","ok":"La celulosa, el glucógeno y el almidón son homopolisacáridos formados exclusivamente por unidades de glucosa. Se diferencian principalmente por el tipo de enlace glucosídico y por el grado de ramificación."},{"n":"9","q":"Si una proteína se desnaturaliza:","o":{"a":"pierde todas sus estructuras, incluso la primaria","b":"pierde todas sus estructuras excepto la primaria","c":"se obtienen aminoácidos libres","d":"se obtienen oligosacáridos"},"c":"b","ok":"La desnaturalización altera las estructuras secundaria, terciaria y cuaternaria al romper interacciones no covalentes, pero conserva la estructura primaria porque no rompe, en condiciones habituales de desnaturalización, los enlaces peptídicos."},{"n":"10","q":"Las uniones peptídicas se producen:","o":{"a":"entre el grupo amino de un aminoácido con el grupo R de otro","b":"entre el grupo carboxilo de un aminoácido con el de otro aminoácido","c":"entre el grupo carboxilo de un aminoácido con el grupo amino de otro aminoácido","d":"entre el grupo R de un aminoácido y el grupo R de otro aminoácido"},"c":"c","ok":"El enlace peptídico es una unión covalente de tipo amida entre el grupo carboxilo de un aminoácido y el grupo amino del siguiente, con liberación de una molécula de agua."},{"n":"11","q":"Los fosfolípidos:","o":{"a":"almacenan energía en las membranas celulares","b":"están formados solo por glicerol y ácidos grasos","c":"forman parte de las membranas celulares","d":"forman las paredes en las membranas celulares"},"c":"c","ok":"Son los componentes lipídicos mayoritarios de las bicapas celulares debido a su naturaleza anfipática."},{"n":"12","q":"Las reacciones anabólicas:","o":{"a":"liberan energía","b":"consumen energía","c":"son de degradación","d":"son exergónicas"},"c":"b","ok":"Las reacciones anabólicas construyen moléculas complejas a partir de precursores más simples y, en términos generales, son endergónicas: requieren un aporte de energía para impulsar la síntesis."},{"n":"13","q":"Las moléculas de ATP tienen la función de:","o":{"a":"almacenar energía como el glucógeno y los ácidos grasos","b":"transportar energía hacia los procesos que la requieran","c":"consumir energía","d":"transportar energía almacenada en la pentosa"},"c":"b","ok":"El ATP funciona como el “intermediario o moneda energética” celular, transfiriendo energía desde las reacciones exergónicas hacia las endergónicas a través del enlace fosfato."},{"n":"14","q":"¿Cuál de las siguientes reacciones puede ser calificada como anabólica?","o":{"a":"fosfolípido glicerol + tres ácidos grasos","b":"Glucosa + + agua","c":"glucoproteína glucosa + proteína","d":"aminoácido + aminoácido + aminoácido tripéptido"},"c":"d","ok":"Es una reacción de síntesis o construcción (formación de enlaces peptídicos entre monómeros para formar un polímero más complejo). Las demás opciones son catabólicas (degradativas)."},{"n":"15","q":"El ATP proporciona energía para:","o":{"a":"las reacciones catabólicas para el transporte activo a través de las membranas","b":"las reacciones anabólicas y para el transporte activo a través de las membranas","c":"las reacciones anabólicas y catabólicas","d":"las reacciones exergónicas y carbónicas"},"c":"b","ok":"Se utiliza en procesos endergónicos: síntesis metabólica (anabolismo), transporte activo en contra de gradiente y trabajo mecánico."},{"n":"16","q":"Las enzimas:","o":{"a":"transportan energía a las reacciones anabólicas","b":"solo catalizan las reacciones endergónicas","c":"solo catalizan las reacciones exergónicas","d":"aceleran las reacciones químicas tanto anabólicas como catabólicas"},"c":"d","ok":"Son catalizadores biológicos que disminuyen la energía de activación de las reacciones químicas celulares sin consumirse en el proceso, independientemente de si son anabólicas o catabólicas."},{"n":"17","q":"Las enzimas alostéricas:","o":{"a":"no tienen sitio activo","b":"tienen sitio activo y un sitio alostérico","c":"se unen a los moduladores que aportan energía","d":"son aquellas que reconocen distintos tipos de sustratos a la vez"},"c":"b","ok":"Además del sitio activo donde se une el sustrato, presentan sitios de regulación (sitios alostéricos) donde se unen moduladores o efectores que alteran su actividad reguladora."},{"n":"18","q":"¿Cuál de las siguientes opciones sobre las enzimas es correcta?","o":{"a":"una enzima es capaz de unirse a cualquier sustrato indistintamente","b":"cada enzima posee un sitio específico de unión a un sustrato específico","c":"la actividad enzimática no cambia si aumenta la temperatura","d":"todas las enzimas tienen el mismo sitio activo"},"c":"b","ok":"Las enzimas poseen una alta especificidad de sustrato determinada por la conformación tridimensional de su sitio activo."},{"n":"19","q":"Indique la opción correcta sobre energía:","o":{"a":"se crea, pero no se destruye","b":"se destruye, pero no se crea","c":"no se crea ni se destruye","d":"no se crea ni se destruye ni se transforma"},"c":"c","ok":"Primera Ley de la Termodinámica: La energía no se crea ni se destruye, solo se transforma de una forma a otra."},{"n":"20","q":"El colesterol:","o":{"a":"forma parte de la membrana en células vegetales y animales","b":"forma parte de la membrana en la célula animal y de la pared en la célula vegetal","c":"forma parte de la membrana de células animales","d":"forma parte de la membrana de células vegetales"},"c":"c","ok":"El colesterol es un esteroide característico de las membranas de células animales (regula su fluidez). Las plantas poseen fitoesteroles."},{"n":"21","q":"La membrana plasmática:","o":{"a":"presenta hidratos de carbono en el interior de la bicapa de fosfolípidos","b":"tiene oligosacáridos en su cara externa","c":"tiene oligosacáridos en su cara plasmática","d":"tiene oligosacáridos en su cara citoplasmática"},"c":"b","ok":"Los hidratos de carbono (glucolípidos y glucoproteínas) se ubican exclusivamente en la monocapa externa de la membrana plasmática formando el glucocálix."},{"n":"22","q":"Señalar la opción correcta sobre el transporte de membrana:","o":{"a":"durante la fagocitosis se forma una vesícula en el interior de la célula","b":"la ósmosis consume energía","c":"la bomba de sodio-potasio no consume energía","d":"los iones se transportan por ósmosis"},"c":"a","ok":"La fagocitosis es un tipo de endocitosis (transporte en masa) que envuelve partículas en vesículas endocíticas. La ósmosis es transporte pasivo (agua) y la bomba es transporte activo primario que consume ATP."},{"n":"23","q":"¿Qué tipo de macromoléculas forman la membrana plasmática?","o":{"a":"fosfolípidos unidos entre sí mediante uniones covalentes","b":"proteínas que forman bicapas","c":"lípidos, proteínas e hidratos de carbono","d":"fosfolípidos, glucolípidos, proteínas y ácidos nucleicos"},"c":"c","ok":"De acuerdo con el modelo de mosaico fluido, la membrana está constituida por una bicapa lipídica (fosfolípidos y colesterol), proteínas integrales y periféricas, y glúcidos acoplados. No contiene ácidos nucleicos."},{"n":"24","q":"En la difusión facilitada las sustancias ingresan:","o":{"a":"a favor de un gradiente de concentración, sin gasto de energía, directamente a través de la bicapa","b":"a favor de un gradiente de concentración, sin gasto de energía, a través de proteínas específicas","c":"a favor o en contra de un gradiente de concentración a través de proteínas específicas","d":"con gasto de energía y las sustancias pasan en contra del gradiente"},"c":"b","ok":"Es un transporte pasivo (no requiere ATP, va a favor de gradiente) que utiliza transportadores proteicos (canales o carries) para moléculas polares o con carga."},{"n":"25","q":"El oxígeno:","o":{"a":"atraviesa la membrana luego de unirse a receptores","b":"atraviesa la membrana en contra de un gradiente","c":"atraviesa la membrana por difusión simple","d":"ingresa a la célula por ósmosis"},"c":"c","ok":"El oxígeno (O₂), al ser una molécula pequeña y no polar, atraviesa la bicapa lipídica directamente por difusión simple, siguiendo su gradiente de concentración y sin gasto de ATP."},{"n":"26","q":"La pinocitosis:","o":{"a":"es un mecanismo de transporte pasivo","b":"es un mecanismo de transporte activo","c":"permite el ingreso de sólidos a la célula","d":"permite la salida de sólidos de la célula"},"c":"b","ok":"La pinocitosis es una forma de endocitosis (invaginación de líquido extracelular con solutos disueltos) y, al implicar deformación de la membrana y formación de vesículas, requiere gasto de ATP (mecanismo activo/en masa)."},{"n":"27","q":"En los lisosomas:","o":{"a":"se obtiene energía en forma de ATP de los alimentos digeridos","b":"se digieren macromoléculas que ingresan por fagocitosis","c":"se digieren en agua e ingresan por pinocitosis","d":"se fabrican enzimas digestivas"},"c":"b","ok":"Los lisosomas son organelas que contienen hidrolasas ácidas para la digestión intracelular de material endocitado o componentes autofágicos. Las enzimas se sintetizan en el RER."},{"n":"28","q":"El aparato de Golgi:","o":{"a":"recibe proteínas que se fabrican en ribosomas libres","b":"recibe proteínas que se fabrican en ribosomas unidos al retículo endoplásmico rugoso","c":"no recibe proteínas","d":"recibe todas las proteínas que se fabrican en cualquier parte de la célula"},"c":"b","ok":"Forma parte del sistema de endomembranas. Recibe las proteínas que entran por el RER mediante vesículas de transporte para su procesamiento, modificación (como glucosilación) y empaquetamiento."},{"n":"29","q":"¿Cuál de las siguientes proteínas se fabrica en el Retículo Endoplásmico Rugoso (RER)?","o":{"a":"enzimas del citoplasma","b":"proteína de la membrana plasmática","c":"proteínas de los ribosomas","d":"histonas"},"c":"b","ok":"Los ribosomas adosados al RER sintetizan proteínas destinadas a membranas, organelas del sistema de endomembranas o secreción celular. Las proteínas citosólicas, histonas y ribosómicas se sintetizan en ribosomas libres."},{"n":"30","q":"Los macrófagos son células que fagocitan bacterias. En la digestión de la bacteria intervienen:","o":{"a":"lisosomas","b":"cloroplastos","c":"ribosomas","d":"Retículo Endoplásmico Liso"},"c":"a","ok":"Tras la fagocitosis, el fagosoma se fusiona con un lisosoma primario para formar un fagolisosoma, donde las enzimas lisosomales degradan el material bacteriano."},{"n":"31","q":"Los cloroplastos:","o":{"a":"son organelas donde las células procariontes realizan fotosíntesis","b":"son organelas donde ciertas células eucariontes realizan fotosíntesis","c":"son organelas donde ciertas células animales y vegetales realizan fotosíntesis","d":"son organelas de plantas y hongos realizan fotosíntesis"},"c":"b","ok":"Los cloroplastos son organelas presentes exclusivamente en células eucariontes autótrofas (plantas y algas). Las bacterias fotosintéticas no tienen cloroplastos y los hongos no realizan fotosíntesis."},{"n":"32","q":"¿Con qué átomos se fabrica la glucosa durante la fotosíntesis?","o":{"a":"CO₂ atmosférico e hidrógeno de las moléculas de agua provenientes del suelo","b":"átomos de moléculas orgánicas provenientes del suelo","c":"carbono, hidrógeno, oxígeno, nitrógeno, fósforo y azufre","d":"CO₂ atmosférico (carbono y oxígeno) e hidrógeno del agua"},"c":"d","ok":"En la fotosíntesis, el carbono de los glúcidos proviene del CO₂ fijado en el ciclo de Calvin y el hidrógeno procede principalmente del agua, transferido mediante NADPH. La síntesis de carbohidratos no requiere incorporar nitrógeno, fósforo o azufre como componentes de la glucosa."},{"n":"33","q":"¿Qué diferencias y similitudes hay entre una célula vegetal y una célula animal?","o":{"a":"ambas tienen mitocondrias y cloroplastos","b":"ambas tienen mitocondrias","c":"las células animales respiran y las vegetales no","d":"ambas son heterótrofas"},"c":"b","ok":"Tanto la célula animal como la vegetal poseen mitocondrias para llevar a cabo la respiración celular aeróbica. Los cloroplastos son exclusivos de las plantas y algas."},{"n":"34","q":"En la etapa lumínica de la fotosíntesis se produce:","o":{"a":"glucosa y oxígeno","b":"glucosa y ATP","c":"oxígeno y ATP","d":"dióxido de carbono y agua"},"c":"c","ok":"En la etapa fotoquímica, la energía luminosa impulsa la fotólisis del agua y permite generar ATP y NADPH; como consecuencia de la oxidación del agua se libera O₂."},{"n":"35","q":"¿Qué productos se obtienen de la etapa lumínica de la fotosíntesis?","o":{"a":"clorofila y agua","b":"oxígeno que se libera (y ATP / NADPH)","c":"dióxido de carbono","d":"oxígeno que se utiliza en la etapa bioquímica"},"c":"b","ok":"El oxígeno generado por la fotólisis del agua es expulsado al exterior de la célula. El ATP y NADPH producidos son los que pasan a ser utilizados en la etapa bioquímica."},{"n":"36","q":"Durante la etapa bioquímica de la fotosíntesis:","o":{"a":"se obtiene energía de la luz","b":"se libera CO₂ al exterior","c":"se libera oxígeno al exterior","d":"se sintetiza glucosa"},"c":"d","ok":"Durante el ciclo de Calvin se utiliza el ATP y el NADPH producidos en la fase luminosa para fijar y reducir CO₂ y formar triosas fosfato, a partir de las cuales se sintetizan otros glúcidos, incluida la glucosa."},{"n":"37","q":"¿En qué etapa de la respiración celular aeróbica se produce mayor cantidad de ATP?","o":{"a":"durante la glucólisis","b":"cadena respiratoria y fosforilación oxidativa","c":"durante el ciclo de Krebs","d":"durante la fermentación"},"c":"b","ok":"La mayor producción de ATP de la respiración celular aeróbica ocurre durante la cadena de transporte de electrones y la fosforilación oxidativa, que aprovechan el gradiente de protones para sintetizar ATP."},{"n":"38","q":"En la glucólisis:","o":{"a":"la glucosa se transforma en una molécula de ácido pirúvico","b":"la glucosa se transforma en dos moléculas de ácido pirúvico","c":"la glucosa se degrada completamente a dióxido de carbono","d":"la glucosa se transforma en ATP"},"c":"b","ok":"Ocurre en el citosol: una molécula de hexosa (glucosa, 6C) se escinde en dos moléculas de piruvato (3C), obteniéndose un rendimiento neto de 2 ATP y 2 NADH."},{"n":"39","q":"La respiración celular consiste en:","o":{"a":"incorporar oxígeno y liberar dióxido de carbono","b":"obtener energía de los alimentos como la glucosa","c":"oxidar el oxígeno para obtener energía","d":"un proceso anabólico para obtener energía"},"c":"b","ok":"Es un conjunto de vías catabólicas exergónicas en las cuales los compuestos orgánicos se degradan oxidativamente para extraer energía en forma de ATP."},{"n":"40","q":"Durante la glucólisis:","o":{"a":"se produce ATP a partir de la molécula de glucosa","b":"la glucosa se oxida en la mitocondria","c":"se consume oxígeno y se libera dióxido de carbono","d":"la glucosa se oxida completamente"},"c":"a","ok":"Ocurre en el citoplasma (es un proceso anaeróbico) y produce una ganancia neta de 2 ATP por fosforilación a nivel de sustrato."},{"n":"41","q":"¿Cuál es la función de la mitocondria?","o":{"a":"fabricar agua","b":"obtener energía en forma de ATP","c":"liberar oxígeno","d":"fabricar ATP y liberar oxígeno"},"c":"b","ok":"Es la organela encargada de la respiración celular aeróbica (Ciclo de Krebs, cadena respiratoria y fosforilación oxidativa) con el objetivo de sintetizar ATP."},{"n":"42","q":"¿Qué características tienen las bacterias del reino Monera?","o":{"a":"presentan membrana plasmática y pared celular","b":"son unicelulares y algunas presentan ADN dentro de un núcleo","c":"todas presentan membrana plasmática y pared celular de celulosa","d":"tienen membrana plasmática y pared celular de quitina"},"c":"a","ok":"Son organismos procariontes unicelulares; poseen membrana y pared celular (de peptidoglicano/mureína, no celulosa ni quitina) y carecen de núcleo delimitado por envoltura nuclear."},{"n":"43","q":"Los seres vivos intercambian materia y energía con el medio, por lo tanto:","o":{"a":"son sistemas cerrados","b":"no presentan homeostasis","c":"son sistemas abiertos","d":"se adaptan al medio ambiente"},"c":"c","ok":"Termodinámicamente, los seres vivos se definen como sistemas abiertos porque intercambian de forma constante materia y energía con su entorno para mantener su organización interna."},{"n":"44","q":"Un organismo pluricelular sin cloroplastos, ¿a qué reino pertenece?","o":{"a":"Fungi o Vegetal","b":"Protista","c":"Animal o Fungi","d":"Animal o Protista"},"c":"c","ok":"Tanto los animales como los hongos son pluricelulares (o con formas pluricelulares) y heterótrofos, por lo que carecen por completo de cloroplastos."},{"n":"48","q":"Las bacterias y las células eucariontes tienen en común la presencia de:","o":{"a":"ADN, membrana plasmática y organelas","b":"ADN asociado a histonas","c":"ADN lineal","d":"ADN y membrana plasmática"},"c":"d","ok":"Todos los tipos celulares comparten una membrana plasmática, citoplasma, ribosomas y material genético (ADN). Las bacterias no poseen organelas membranosas, histonas verdaderas ni ADN lineal."},{"n":"50","q":"Si se hidroliza una molécula de ADN, ¿qué molécula se obtiene?","o":{"a":"nucleótidos con pentosa desoxirribosa","b":"nucleótidos con pentosa rugosa","c":"nucleótidos con pentosa rugosa y desoxirribosa","d":"únicamente desoxirribosa"},"c":"a","ok":"La hidrólisis completa del polímero de ADN rinde sus monómeros constituyentes: desoxirribonucleótidos (compuestos por desoxirribosa, un grupo fosfato y una base nitrogenada)."},{"n":"2","q":"En un organismo autótrofo, la liberación de oxígeno al medio, en la fotosíntesis, ocurre:","o":{"a":"A partir del CO2","b":"Independiente de la luz solar","c":"Debido a la fotolisis del agua","d":"Durante la fijación del CO2","e":"Durante el Ciclo de Calvin"},"c":"c","ok":"El O₂ liberado en la fotosíntesis oxigénica proviene de la fotólisis del agua en el fotosistema II. Por lo tanto, el oxígeno gaseoso liberado tiene como fuente el H₂O y no el CO₂."},{"n":"3","q":"Elija un proceso exergónico:","o":{"a":"Contracción muscular","b":"Ciclo de Calvin","c":"Exocitosis","d":"Glucólisis","e":"Síntesis de proteína"},"c":"d","ok":"La glucólisis es una vía catabólica y globalmente exergónica: degrada parcialmente la glucosa y permite obtener ATP y NADH. No requiere O₂ para llevarse a cabo."},{"n":"4","q":"Respecto al ciclo de Krebs, se puede afirmar que:","o":{"a":"Produce coenzimas oxidadas","b":"Produce coenzimas reducidas","c":"Consume ATP","d":"Consume CO2","e":"Consume O2"},"c":"b","ok":"En el ciclo de Krebs, NAD⁺ y FAD aceptan electrones y se reducen a NADH y FADH₂, respectivamente. Estas coenzimas reducidas luego entregan sus electrones a la cadena respiratoria."},{"n":"5","q":"Al hidrolizar una proteína, se puede afirmar que:","o":{"a":"Se obtiene la cadena polipeptídica desplegada","b":"Se rompen los enlaces covalentes que presenta","c":"Solo se rompen los enlaces puentes de hidrógeno, iónicos y otras uniones débiles que presenta","d":"Se afecta actividad biológica, pero no su estructura","e":"Se afecta la estructura secundaria, la terciaria y la cuaternaria, pero no la primaria"},"c":"b","ok":"A diferencia de la desnaturalización (que solo rompe uniones débiles y afecta la conformación tridimensional), la hidrólisis rompe enzimática o químicamente los enlaces peptídicos (enlaces covalentes), fragmentando la estructura primaria y liberando aminoácidos o péptidos cortos."},{"n":"6","q":"Durante la fermentación de la masa para producir el pan, la levadura:","o":{"a":"Producen O2","b":"Producen etanol y CO2","c":"Consumen CO2 y H2O","d":"Producen ácido láctico","e":"Producen CO2 y H2O"},"c":"b","ok":"Las levaduras realizan fermentación alcohólica y producen etanol y CO₂ a partir del piruvato. El dióxido de carbono liberado contribuye al leudado de la masa."},{"n":"7","q":"En relación con las proteínas, se puede afirmar que:","o":{"a":"No son saturables","b":"Siempre están formadas por una sola cadena polipeptídica","c":"Su estructura no se ve afectada por la temperatura","d":"No son afectadas por los cambios de pH","e":"Pueden requerir un cofactor para presentar actividad biológica"},"c":"b","ok":"Muchas proteínas y enzimas complejas (heteroproteínas o holoenzimas) requieren componentes no proteicos llamados cofactores (iones metálicos) o coenzimas (moléculas orgánicas como vitaminas) para adquirir su conformación funcional activa."},{"n":"8","q":"Las enzimas son específicas dado que:","o":{"a":"Catalizan reacciones a un pH óptimo","b":"Solo reconocen uno o pocos sustratos","c":"Catalizan reacciones anabólicas","d":"Catalizan reacciones a una temperatura óptima","e":"Catalizan reacciones catabólicas"},"c":"b","ok":"La especificidad enzimática se debe a la complementariedad entre el sitio activo y el sustrato, determinada por la estructura tridimensional y las propiedades químicas de ambos."},{"n":"9","q":"¿Cuál de estas sustancias es una proteína?","o":{"a":"Coenzima","b":"ATP","c":"Aminoácidos","d":"RNA","e":"Transportador de glucosa"},"c":"b","ok":"Los transportadores de glucosa (como los de la familia GLUT) son proteínas integrales de la membrana plasmática. El ATP y RNA son nucleótidos/ácidos nucleicos, y los aminoácidos son los monómeros precursores."},{"n":"10","q":"En relación con los niveles de organización de la materia, se puede afirmar que:","o":{"a":"El nivel atómico presenta menor estabilidad que el celular","b":"La población es un nivel de organización menos complejo que la comunidad","c":"La hoja de un cuchillo pertenece al nivel de organización macromolecular","d":"Los ecosistemas presentan bajo requerimiento energético para mantener su organización","e":"La biosfera corresponde a un nivel de organización que presenta alta estabilidad"},"c":"b","ok":"Una población está constituida por individuos de la misma especie que habitan una determinada área, mientras que una comunidad reúne poblaciones de diferentes especies que interactúan. Por ello, la población corresponde a un nivel de organización menos complejo que la comunidad."},{"n":"12","q":"Las moléculas como el CO₂ atraviesan las membranas de las células, a favor de gradiente de concentración, mediante:","o":{"a":"Difusión simple","b":"Endocitosis mediada por receptor","c":"Proteínas transportadoras","d":"Difusión facilitada","e":"Bombas"},"c":"a","ok":"Una molécula pequeña y no polar, como el CO₂, puede atravesar la bicapa lipídica por difusión simple a favor de su gradiente de concentración, sin transportadores ni gasto directo de ATP. La consigna original perdió los nombres de las moléculas en el texto extraído."},{"n":"13","q":"La celulosa que ingerimos en la dieta:","o":{"a":"Es la principal fuente de aminoácidos para nuestras células","b":"Es la principal fuente de ácidos grasos para nuestras células","c":"No se puede hidrolizar en nuestro tubo digestivo debido a las uniones glucosídicas que unen los monómeros que la forman","d":"Incrementa las reservas de glucógeno en el hígado, si está en exceso en nuestra dieta","e":"Es la principal fuente de moléculas de glucosa para nuestras células"},"c":"c","ok":"La celulosa no puede ser digerida por las enzimas humanas porque carecemos de celulasa para romper sus enlaces β(1→4) glucosídicos. Por eso actúa principalmente como fibra alimentaria."},{"n":"14","q":"¿Cuál de los siguientes procesos metabólicos les permite a las células obtener mayor cantidad de ATP?","o":{"a":"Oxidación completa de la glucosa","b":"Fermentación alcohólica","c":"Oxidación completa de un ácido graso de 18 carbonos","d":"Glucólisis","e":"Fermentación láctica"},"c":"c","ok":"Los ácidos grasos están más reducidos que la glucosa y su oxidación produce más ATP por molécula. La oxidación completa de un ácido graso de 18 carbonos genera aproximadamente 120 ATP en el balance convencional."},{"n":"15","q":"La fórmula C6H12O6 puede corresponder:","o":{"a":"Solamente a las cetohexosas","b":"Solamente a las aldohexosas","c":"A todos los carbohidratos","d":"A cualquier monosacárido de 6 carbonos","e":"Exclusivamente a la glucosa"},"c":"d","ok":"La fórmula C₆H₁₂O₆ puede corresponder a distintos monosacáridos de seis carbonos, tanto aldohexosas como cetohexosas, que son isómeros entre sí."},{"n":"16","q":"Entre las propiedades de las enzimas se puede mencionar que:","o":{"a":"Presentan máxima actividad a cualquier temperatura entre 0º C y 37º C","b":"Una enzima determinada puede unirse a una gran variedad de sustratos","c":"Solo pueden catalizar reacciones exergónicas","d":"Catalizan tanto reacciones endergónicas como exergónicas","e":"Transforman en exergónicas a las reacciones endergónicas que de este modo pueden llevarse a cabo"},"c":"d","ok":"Las enzimas disminuyen la energía de activación de las reacciones sin modificar la energía libre de reactivos y productos. Por eso no cambian el ΔG ni el equilibrio termodinámico de la reacción."},{"n":"17","q":"Las membranas celulares están formadas, entre otros compuestos, por:","o":{"a":"Fosfolípidos, proteínas y glicoproteínas, y glicolípidos","b":"Ácidos grasos libres, proteínas y fosfolípidos","c":"Ácidos grasos libres, proteínas y colesterol","d":"Triacilgliceroles, proteínas y colesterol","e":"Glicolípidos, proteínas y celulosa"},"c":"a","ok":"La estructura de la membrana responde al modelo de mosaico fluido, compuesta por una matriz de fosfolípidos (y colesterol en animales), proteínas (integrales/periféricas) y glúcidos acoplados en la cara externa como glicoproteínas y glicolípidos."},{"n":"18","q":"Respecto al DNA, se puede afirmar que:","o":{"a":"Está formado por 2 cadenas complementarias unidas entre sí por puentes de hidrógeno","b":"Su hidrólisis da como resultado 2 cadenas de polinucleótidos","c":"Su hidrólisis da por resultado desoxirribosa, fosfato, adenina, guanina, citosina y uracilo","d":"Está formado por 2 cadenas complementarias unidas entre sí por enlaces fosfodiéster","e":"Su hidrólisis da por resultado ribosa, fosfato, adenina, guanina, citosina y timina"},"c":"a","ok":"El ADN está formado por dos cadenas antiparalelas unidas mediante puentes de hidrógeno entre bases complementarias: A con T y G con C. Los enlaces fosfodiéster unen los nucleótidos dentro de cada cadena."},{"n":"19","q":"¿Cuál de las siguientes moléculas es un esteroide?","o":{"a":"Hormonas sexuales","b":"Caroteno","c":"Ceras","d":"Aminoácidos","e":"Triacilglicerol"},"c":"a","ok":"Las hormonas sexuales (como estrógenos, progesterona y testosterona) son lípidos no saponificables derivados del núcleo del ciclopentanoperhidrofenantreno (estructura esteroide, derivada del colesterol)."},{"n":"20","q":"Los filamentos de actina:","o":{"a":"Forman el anillo contráctil en la división celular","b":"Participan en el movimiento de cilios y flagelos","c":"Se forman por polimerización de tubulina","d":"Forman el huso mitótico en la división celular","e":"Forman los centriolos"},"c":"a","ok":"Los microfilamentos de actina, junto con la miosina, forman el anillo contráctil que participa en la citocinesis de las células animales. Los cilios, flagelos, huso mitótico y centriolos son estructuras basadas principalmente en microtúbulos."},{"n":"21","q":"En relación con el almidón y el glucógeno se puede afirmar que presentan función:","o":{"a":"De almacenamiento en animales y plantas respectivamente","b":"Estructural en plantas","c":"De reserva de glucosa en animales","d":"De almacenamiento energético, en plantas y animales respectivamente","e":"Estructural en plantas y de almacenamiento energético en animales respectivamente"},"c":"d","ok":"Ambos son homopolisacáridos de reserva energética de glucosa: el almidón es la forma de reserva en el reino vegetal y el glucógeno en el reino animal (hígado y tejido muscular)."},{"n":"24","q":"¿Cuál de las siguientes moléculas almacena la mayor parte de la energía metabólica de un animal para ser usada por largos períodos de tiempo?","o":{"a":"Glucógeno","b":"Triacilgliceroles","c":"Monosacáridos","d":"ATP","e":"Vitaminas"},"c":"b","ok":"Los triacilgliceroles (grasas neutras almacenadas en los adipocitos) son altamente hidrofóbicos y reducidos, permitiendo acumular una mayor cantidad de energía por unidad de masa en comparación con los hidratos de carbono."},{"n":"25","q":"En relación con las vitaminas se puede afirmar que:","o":{"a":"Son sintetizadas por nuestros hepatocitos","b":"Pueden ser cofactores o precursores de estos para la actividad enzimática","c":"Almacenan energía a largo plazo en las células","d":"Son compuestos que aportan energía para las reacciones metabólicas","e":"Son los monómeros constituyentes de las enzimas"},"c":"b","ok":"La mayoría de las vitaminas hidrosolubles (por ejemplo, el complejo B) funcionan químicamente como coenzimas o precursoras de coenzimas clave en el metabolismo celular."},{"n":"28","q":"La LDL que viaja en el torrente sanguíneo ingresa a las células mediante:","o":{"a":"Una bomba","b":"Pinocitosis","c":"Una proteína receptora específica","d":"Fagocitosis","e":"Una proteína transportadora (“carrier”)"},"c":"a","ok":"La lipoproteína de baja densidad (LDL) entra a la célula por endocitosis mediada por receptor, reconociendo receptores de apoB-100 en depresiones revestidas de clatrina en la membrana."},{"n":"29","q":"En relación con las enzimas alostéricas se puede afirmar que, a diferencia de las enzimas michaelianas:","o":{"a":"No son saturables","b":"Pueden modificar su afinidad por el sustrato en presencia de un modulador","c":"Catalizan solo reacciones catabólicas","d":"El sustrato siempre se une al sitio alostérico","e":"Su actividad es constante a cualquier valor de pH del medio"},"c":"a","ok":"Las enzimas alostéricas poseen sitios de regulación distintos del sitio activo. La unión de un modulador (positivo o negativo) provoca cambios conformacionales en el sitio activo, aumentando o reduciendo su afinidad por el sustrato."},{"n":"31","q":"Las células procariontes y las células eucariontes se caracterizan porque ambas presentan:","o":{"a":"Mitocondrias","b":"Ribosomas","c":"DNA rodeado por una envoltura con doble membrana","d":"DNA lineal y desnudo","e":"Un sistema de endomembranas"},"c":"b","ok":"Los ribosomas son los complejos ribonucleoproteicos universales indispensables para la traducción y síntesis de proteínas en todo tipo de célula viva."},{"n":"33","q":"¿Cuál de las siguientes estructuras solo está presente en células animales, pero no se encuentra en las células de las plantas?","o":{"a":"Mitocondria","b":"Peroxisoma","c":"Centriolos","d":"Núcleo","e":"Membrana plasmática"},"c":"c","ok":"Los centriolos son característicos de los centrosomas de las células animales y están ausentes en las plantas superiores. Las plantas organizan sus microtúbulos mediante otros centros organizadores."},{"n":"35","q":"Respecto al ATP, se puede afirmar que:","o":{"a":"Es un aminoácido","b":"Es un intermediario energético (o almacena energía a corto plazo)","c":"Es utilizado como reserva energética a largo plazo","d":"Tiene función de combustible celular","e":"Almacena energía a corto plazo"},"c":"b","ok":"El ATP actúa como intermediario o moneda energética de corto plazo. Sin embargo, la opción e también afirma que almacena energía a corto plazo, por lo que ambas resultan defendibles y el ítem es ambiguo."},{"n":"36","q":"En el ciclo de Calvin:","o":{"a":"Se libera O2","b":"El CO2 se reduce a carbohidratos","c":"Se consumen hidratos de carbono","d":"El NADPH se oxida a NADP+","e":"Se produce grandes cantidades de ATP"},"c":"d","ok":"En el ciclo de Calvin, el CO₂ se reduce para formar compuestos orgánicos y, simultáneamente, el NADPH se oxida a NADP⁺ al donar electrones e hidrógeno. Por lo tanto, tanto b como d describen procesos reales del ciclo y el ítem resulta ambiguo."},{"n":"37","q":"Las enzimas que catalizan la síntesis de lípidos se encuentran en:","o":{"a":"La envoltura nuclear","b":"El retículo endoplásmico rugoso","c":"Los ribosomas","d":"El retículo endoplásmico liso","e":"La membrana plasmática"},"c":"b","ok":"El Retículo Endoplásmico Liso (REL) es la organela especializada en la biosíntesis de lípidos complejos (como fosfolípidos, colesterol y esteroides) y en procesos de detoxificación."},{"n":"38","q":"¿Cuál es el recorrido que sigue un aminoácido que formará parte de la LDL, desde que se sintetiza esta proteína hasta que llega a su localización definitiva?","o":{"a":"Ribosomas, RER, Complejo de Golgi, Lisosoma, medio extracelular","b":"Ribosomas libres del citosol, complejo de Golgi, medio extracelular","c":"Ribosomas, RER, Complejo de Golgi, medio extracelular","d":"Ribosomas, RER, membrana plasmática","e":"Solo pasa por los ribosomas libres del citosol y de ahí se dirige al medio extracelular"},"c":"c","ok":"La parte proteica de la LDL (Apolipoproteína B) es una proteína destinada a la secreción al medio extracelular (vía secretora): inicia su traducción en ribosomas asociados a la membrana del RER, ingresa al lumen del RER, viaja al aparato de Golgi mediante vesículas para su procesamiento y sale por exocitosis."},{"n":"1","q":"Respecto al ATP, se puede afirmar que:","o":{"a":"Su Hidrolisis es un proceso endergónico.","b":"Disminuye la energía de activación de una reacción.","c":"Su hidrolisis permite que tengan lugar reacciones endergonicas.","d":"Es utilizado como reserva energía a largo plazo.","e":"Tiene función de combustible celular."},"c":"c","ok":"La hidrólisis del ATP libera energía libre que puede acoplarse a procesos endergónicos, como muchas reacciones anabólicas. Por ello permite que estas reacciones puedan llevarse a cabo."},{"n":"2","q":"Los disacáridos con función de transporte que se encuentran en animales y plantas son respectivamente:","o":{"a":"Glucosa/Fructosa.","b":"Quitina/Celulosa","c":"Glucógeno/Almidón.","d":"Sacarosa/Lactosa.","e":"Lactosa/Sacarosa."},"c":"e","ok":"La sacarosa es el principal disacárido de transporte en plantas, pero en animales la lactosa no cumple una función equivalente de transporte sistémico. Como no hay una opción que describa correctamente ambos casos, el ítem está defectuosamente formulado."},{"n":"3","q":"¿Cuál de las siguientes situaciones corresponde a una reacción de condensación?","o":{"a":"Reacciones que separan polímeros en monómeros.","b":"Reacciones que requieren agua como reactivo.","c":"Galactosa + Glucosa à Lactosa + H20","d":"Sacarosa + H2O à Glucosa + Fructosa","e":"Reacciones en donde se rompen enlaces covalente."},"c":"c","ok":"La condensación une moléculas más pequeñas y libera agua; en este caso, galactosa y glucosa se unen para formar lactosa y H₂O. La reacción inversa, con consumo de agua, corresponde a una hidrólisis."},{"n":"4","q":"Seleccione la opción correcta respecto a los triacilgliceroles que sintetizan las plantas:","o":{"a":"Son precursores de vitaminas liposolubles.","b":"Forman las bicapas lipídicas de las membranas celulares.","c":"Regulan la fluidez de las membranas celulares.","d":"Su hidrolisis rinde glicerol y ácidos grasos saturados.","e":"Su hidrolisis rinde glicerol y ácidos grasos insaturados."},"c":"e","ok":"Los triacilgliceroles vegetales funcionan principalmente como reserva energética, pero su hidrólisis no produce necesariamente solo ácidos grasos insaturados: pueden contener ácidos grasos saturados e insaturados. Por ello, la opción e no es universalmente válida y el ítem carece de una respuesta inequívocamente correcta."},{"n":"5","q":"¿Cuál de los siguientes procesos ocurre en el retículo endoplásmico liso?","o":{"a":"Fotolisis del agua","b":"Descomposición del H2O2 en H2O","c":"Degradación de los ácidos grasos de cadena muy larga.","d":"Síntesis de proteínas de membrana y de exportación.","e":"Síntesis de lípidos."},"c":"e","ok":"El retículo endoplásmico liso participa de manera importante en la síntesis de lípidos, incluidos fosfolípidos y otros lípidos de membrana. También interviene en detoxificación y, en células especializadas, en el metabolismo de esteroides."},{"n":"6","q":"En relación con el glucógeno se puede afirmar que:","o":{"a":"Cumple, en células animales, una función equivalente a la celulosa en células vegetales.","b":"Es un polímero que almacena glucosa y es sintetizado por ciertas células animales.","c":"Es un monosacárido que proporciona energía a las células animales.","d":"Cumple función estructural, en células animales.","e":"Forma el exoesqueleto de los artrópodos."},"c":"b","ok":"El glucógeno es un homopolisacárido de glucosa cuya función principal en animales es almacenar energía, especialmente en hígado y músculo. Su estructura ramificada permite movilizar glucosa con rapidez."},{"n":"7","q":"El O2 ingresa a las neuronas a favor de gradiente mediante:","o":{"a":"Endocitosis mediada por receptor.","b":"Difusión simple.","c":"Una proteína transportadora (“carrier”) especifica.","d":"Una bomba especifica.","e":"Una proteína canal especifica."},"c":"b","ok":"El O₂ es una molécula pequeña y no polar que atraviesa la bicapa lipídica por difusión simple, siguiendo su gradiente de concentración y sin requerir proteínas transportadoras ni gasto directo de ATP."},{"n":"8","q":"Respecto al RNA se puede afirmar que:","o":{"a":"Está compuesto por Ribosa, Fosfato, Adenina, Guanina, Citosina y Uracilo.","b":"Puede tener función de almacenamiento de energía.","c":"Está formado por 2 cadenas complementarias unidas entre sí por enlaces fosfodiéster.","d":"Está compuesto por Desoxirribosa, Fosfato, Adenina, Guanina, Citosina y Timina.","e":"Su hidrolisis da como resultado 2 cadenas de poli nucleótidos."},"c":"a","ok":"El RNA está formado por ribonucleótidos que contienen ribosa, fosfato y las bases adenina, guanina, citosina y uracilo. No posee desoxirribosa ni timina como componentes característicos."},{"n":"9","q":"La hidrolisis de los enlaces entre los fosfatos que forman el ATP:","o":{"a":"Requiere energía útil.","b":"Posibilita que tengan lugar las reacciones anabólicas.","c":"Es un ejemplo de una reacción endergonica.","d":"Libera agua.","e":"Posibilita que tengan lugar las reacciones exergónicas."},"c":"b","ok":"La hidrólisis del ATP es exergónica y libera energía libre. Esa energía puede acoplarse a reacciones endergónicas, incluidas muchas reacciones anabólicas."},{"n":"10","q":"¿Cuál de estas sustancias es una proteína?:","o":{"a":"Aminoácido","b":"DNA","c":"Vitamina","d":"Receptor de LDL","e":"Quitina."},"c":"d","ok":"El receptor de LDL es una proteína integral de membrana que reconoce específicamente a la lipoproteína LDL y participa en su endocitosis mediada por receptor."},{"n":"11","q":"Respecto a la respiración celular aeróbica, se puede afirmar que:","o":{"a":"El agua es el último aceptor de electrones de la cadena respiratoria.","b":"Ocurre solo en las células eucariontes animales.","c":"Oxida completamente a los carbonos de las moléculas orgánicas combustibles.","d":"Es un proceso endergónico.","e":"El Co2 es el último aceptor de electrones de la cadena respiratoria"},"c":"c","ok":"En la respiración celular aeróbica, los carbonos de las moléculas orgánicas combustibles se oxidan finalmente a CO₂ y los electrones llegan al O₂, que se reduce a H₂O. Por eso se trata de un proceso de oxidación globalmente exergónico."},{"n":"12","q":"La Fenilcetonuria es una enfermedad molecular causada por:","o":{"a":"La acumulación de un derivado toxico por falla de una enzima","b":"La falta del aminoácido fenilalanina en numerosas proteínas celulares.","c":"La falla o ausencia de una proteína de membrana.","d":"La carencia de fenilalanina en la dieta","e":"La ausencia de una enzima del lisosoma."},"c":"a","ok":"La fenilcetonuria se debe principalmente a una deficiencia de la enzima fenilalanina hidroxilasa, lo que provoca acumulación de fenilalanina y metabolitos derivados potencialmente tóxicos."},{"n":"13","q":"En relación con los lípidos se puede afirmar que:","o":{"a":"Son solubles en agua.","b":"Son solubles en solventes no polares.","c":"Forman polímeros de gran tamaño molecular.","d":"Todos forman micelas o bicapas en agua.","e":"Son compuestos hidrofilicos."},"c":"b","ok":"Los lípidos tienen escasa solubilidad en agua y, en general, se disuelven mejor en solventes orgánicos no polares. Esta propiedad se relaciona con su abundancia de regiones hidrofóbicas."},{"n":"14","q":"¿Qué característica de una proteína determina su actividad biológica?","o":{"a":"Su estructura tridimensional.","b":"El número de átomos que la constituyen.","c":"La cantidad de enlaces peptídicos que presenta.","d":"Su tamaño","e":"El número de monómeros que la constituyen."},"c":"a","ok":"La actividad biológica de una proteína depende de su conformación tridimensional, porque esta determina la disposición espacial de los residuos que forman sitios de unión, sitios catalíticos y otras superficies funcionales."},{"n":"15","q":"La hidrolisis de una proteína:","o":{"a":"Da por resultado una cadena polipeptídica con su estructura primaria intacta.","b":"Afecta su actividad biológica, pero no su estructura tridimensional.","c":"Implica la ruptura de enlaces puente de hidrogeno, pero no de sus enlaces peptídicos.","d":"Implica la pérdida de su estructura primaria.","e":"Afecta su estructura secundaria, terciaria y cuaternaria, pero no la primaria."},"c":"d","ok":"La hidrólisis rompe los enlaces peptídicos de la proteína y, por lo tanto, altera su estructura primaria. Al perderse la cadena polipeptídica original también se pierde su conformación normal y, en general, su actividad."},{"n":"16","q":"Dentro del lisosoma, el PH se mantiene alrededor 5; esto es debido a que:","o":{"a":"Con gasto de energía, se bombean protones en contra de gradiente desde el lisosoma hacia el citosol.","b":"Sin gasto de energía, salen protones a favor de gradiente desde el lisosoma hacia el citosol.","c":"Entran protones al lisosoma por difusión simple.","d":"Con gasto de energía, se bombean protones en contra de gradiente, desde el citosol hacia el interior de lisosoma.","e":"Sin gasto de energía, ingresan protones a favor de gradiente desde el citosol hacia el interior del lisosoma."},"c":"d","ok":"El pH ácido de los lisosomas se mantiene mediante bombas de protones dependientes de ATP que transportan H⁺ desde el citosol hacia el interior lisosomal en contra de su gradiente electroquímico."},{"n":"17","q":"La carencia de vitamina C en la dieta produce:","o":{"a":"Kwashiorkor","b":"Anemia Falciforme.","c":"Deficiencia en la producción de colágeno funcional.","d":"Fenilcetonuria.","e":"Fibrosis quística."},"c":"c","ok":"La vitamina C es necesaria para las reacciones de hidroxilación que permiten formar colágeno funcional. Su deficiencia compromete la síntesis y estabilidad del tejido conectivo."},{"n":"18","q":"En ciertas bacterias, cuando crecen en presencia de lactosa y ausencia de glucosa, se observa la actividad de una enzima que metaboliza ese disacárido. En cambio, si el medio no contiene lactosa, no se encuentran moléculas de tal enzima. Este tipo de regulación enzimática se denomina:","o":{"a":"Alosterica","b":"Modificación covalente reversible.","c":"Inhibición por producto final.","d":"Regulación génica.","e":"Activación de zimógenos"},"c":"d","ok":"La ausencia de lactosa evita la inducción de los genes del operón lac, de modo que no se sintetizan las enzimas necesarias para utilizar ese azúcar. Se trata, por lo tanto, de una regulación de la expresión génica."},{"n":"19","q":"En relación con la inhibición por producto final, se puede afirmar que:","o":{"a":"El producto final se une a la primera enzima mediante enlaces covalente.","b":"El producto final se une al sitio activo de la primera enzima.","c":"El sitio activo de la enzima no reconoce los sustratos.","d":"El producto final inhibe todas las enzimas de la vía metabólica.","e":"El producto final se une a la primera enzima en el sitio alostérico."},"c":"e","ok":"En la inhibición por producto final, el metabolito final de una vía se une de manera alostérica a una enzima reguladora, con frecuencia una de las primeras de la secuencia, y disminuye su actividad."},{"n":"20","q":"En los procesos:","o":{"a":"Anabólicos, los productos presentan más energía que los sustratos.","b":"Anabólicos, los productos presentan menos energía que los sustratos.","c":"Anabólicos, los productos presentan más entropía que los sustratos.","d":"Catabólicos, los productos presentan menos entropía que los sustratos.","e":"Catabólicos, los productos presentan más energía que los sustratos."},"c":"a","ok":"Las vías anabólicas son, en conjunto, endergónicas y utilizan energía para formar moléculas más complejas. En consecuencia, los productos presentan mayor energía libre que los sustratos en el proceso global."},{"n":"21","q":"Los lisosomas intervienen en:","o":{"a":"La síntesis de proteínas.","b":"La respiración celular aeróbica.","c":"La descomposición del peróxido de hidrogeno (H2O2)","d":"La síntesis de lípidos.","e":"La hidrólisis de macromoléculas que la célula incorporo mediante endocitosis."},"c":"e","ok":"Los lisosomas contienen hidrolasas ácidas que degradan macromoléculas incorporadas por endocitosis y también materiales provenientes de procesos autofágicos."},{"n":"22","q":"La fotosíntesis oxigénica (que libera O2) se originó con la aparición de:","o":{"a":"Los cloroplastos.","b":"Procariontes capaces de oxidar compuestos orgánicos como los monosacáridos.","c":"Los eucariontes.","d":"La respiración celular aeróbica.","e":"Procariontes capaces de utilizar la energía lumínica para la síntesis de moléculas orgánicas como los azucares."},"c":"e","ok":"La fotosíntesis oxigénica surgió en procariontes fotosintéticos, específicamente en organismos ancestrales relacionados con las cianobacterias, capaces de usar agua como fuente de electrones y liberar O₂."},{"n":"23","q":"Al producirse la fermentación láctica en las células de los músculos esqueléticos:","o":{"a":"Se oxida el ácido láctico a pirúvico y se reduce el NAD+ a NADH.","b":"Se oxida totalmente la glucosa.","c":"Se produce ácido láctico y CO2.","d":"Se utiliza O2.","e":"Se reduce el ácido pirúvico a láctico y oxida el NADH a NAD+"},"c":"e","ok":"En la fermentación láctica, el piruvato se reduce a lactato y el NADH se oxida a NAD⁺. Así se regenera NAD⁺ para que la glucólisis pueda continuar en ausencia de respiración aeróbica."},{"n":"24","q":"¿Qué orgánulo se encuentra afectado en la enfermedad de Tay Sachs?","o":{"a":"Complejo de Golgi","b":"Reticulo endoplásmico rugoso.","c":"Peroxisoma","d":"Mitocondria.","e":"Lisosoma."},"c":"e","ok":"La enfermedad de Tay-Sachs es un trastorno de almacenamiento lisosómico causado por deficiencia de hexosaminidasa A, con acumulación de gangliósidos, especialmente en neuronas."},{"n":"25","q":"Al colocar eritrocitos en una solución se observa que hay flujo neto de agua hacia fuera de la célula, por consiguiente, se puede afirmar que:","o":{"a":"El citosol de los eritrocitos presenta mayor concentración de solutos que la solución.","b":"El citosol de los eritrocitos es hipotónico respecto a la solución.","c":"El agua sale por bomba con gasto de energía.","d":"Los eritrocitos terminan estallando.","e":"El citosol de los eritrocitos es hipertónico respecto a la solución."},"c":"b","ok":"Si el agua sale netamente de los eritrocitos, el medio externo es relativamente más concentrado en solutos y el citosol celular es hipotónico respecto de la solución. El agua se mueve por ósmosis, no mediante bombas."},{"n":"26","q":"En relación con los microtúbulos, se puede afirmar que:","o":{"a":"Participan en desplazamientos ameboides de las células.","b":"Otorgan resistencia a las tensiones mecánicas que pueden experimentar las células que constituyen, por ejemplo, la piel.","c":"Participan en la contracción muscular.","d":"Participan en la contracción del citoplasma durante la división celular.","e":"Forman los centriolos."},"c":"e","ok":"Los centriolos son estructuras cilíndricas formadas por microtúbulos y organizadas en tripletes, presentes en los centrosomas de las células animales. Las otras funciones citadas corresponden principalmente a microfilamentos o filamentos intermedios."},{"n":"27","q":"Una proteína sintetizada por la célula, sale de esta por:","o":{"a":"Proteína canal.","b":"Fagocitosis.","c":"Transporte activo mediado por transportadores específicos.","d":"Exocitosis.","e":"Endocitosis mediada por receptor."},"c":"d","ok":"Una proteína destinada al exterior de la célula sigue la vía secretora y, una vez empaquetada en vesículas, se libera por exocitosis mediante la fusión de la vesícula con la membrana plasmática."},{"n":"28","q":"La Pepsina es una enzima que se sintetiza como zimógeno (un tipo de pro proteína), por consiguiente:","o":{"a":"Se activa mediante un modulador alostérico positivo.","b":"Se activa por modificación covalente reversible (agregado de grupos fosfato)","c":"Su actividad se regula a nivel génico.","d":"Solo está activa cuando se encuentra como zimógeno.","e":"Su forma activa es un polipéptido más corto que el de la forma inactiva."},"c":"e","ok":"Un zimógeno es un precursor inactivo que se activa mediante escisión proteolítica. Por eso, la forma activa tiene menos aminoácidos que el zimógeno original."},{"n":"29","q":"En relación con las enzimas se puede afirmar que:","o":{"a":"Suministran energía para las reacciones endergónicas.","b":"Solo actúan en altas concentraciones.","c":"Para una cantidad constante de enzima, al agregarle más sustrato al medio, siempre aumentara la velocidad de catálisis.","d":"Tienen un sitio activo mediante el cual interactúan específicamente con el sustrato.","e":"Suministran energía para las reacciones anabólicas."},"c":"d","ok":"Las enzimas poseen un sitio activo cuya estructura y propiedades químicas permiten reconocer y unir de manera específica al sustrato, facilitando la reacción catalítica."},{"n":"30","q":"En relación con los seres vivos se puede afirmar que:","o":{"a":"Cumplen con la primera ley de la termodinámica, pero no cumplen con la segunda.","b":"Carecen de la capacidad de auto perpetuación.","c":"Intercambian únicamente energía con el medio.","d":"Intercambian únicamente materia con el medio.","e":"Crecen de acuerdo con un patrón de instrucciones."},"c":"e","ok":"Los seres vivos crecen siguiendo instrucciones contenidas en su información genética, aunque el crecimiento también depende de la disponibilidad de materia, energía y condiciones ambientales."},{"n":"31","q":"¿Con cuál de las enfermedades se asocia con la ausencia de un canal iónico?","o":{"a":"Anemia falciforme.","b":"Tay Sachs","c":"Fibrosis quística.","d":"Fenilcetonuria.","e":"Hipercolesterolemia familiar."},"c":"c","ok":"La fibrosis quística se asocia con mutaciones en CFTR, una proteína canal de cloruro de la membrana plasmática. Su funcionamiento alterado modifica el transporte de Cl⁻ y el equilibrio de agua y sales en epitelios."},{"n":"32","q":"Respecto de la glucolisis, se puede afirmar que:","o":{"a":"Oxida totalmente la glucosa.","b":"Consume CO2","c":"Oxida parcialmente la glucosa.","d":"Es un proceso endergónico.","e":"Reduce parcialmente la glucosa."},"c":"c","ok":"La glucólisis oxida parcialmente la glucosa hasta piruvato. No la oxida completamente a CO₂ y H₂O, ya que ese proceso requiere las etapas posteriores de la respiración celular."},{"n":"33","q":"Si se riega una planta con agua, cuyo oxigeno es radiactivo, al cabo de muchas horas de iluminación, la mayor parte de la radiactividad aparecerá en:","o":{"a":"El O2 del aire.","b":"Las hojas de la planta.","c":"El CO2 del aire","d":"El almidón.","e":"Las moléculas de glucosa sintetizadas."},"c":"a","ok":"El oxígeno radiactivo del agua se incorpora al O₂ liberado durante la fotólisis del agua en la fase fotoquímica. Por eso la mayor parte de la radiactividad aparecerá en el oxígeno molecular del aire."},{"n":"34","q":"La fórmula de un monosacárido C6H12O6 corresponde a:","o":{"a":"Solo una aldohexosa.","b":"No se puede precisar ya que los monosacáridos presentan muchos isómeros.","c":"Solo galactosa.","d":"Solo glucosa.","e":"Solo una cetohexosa."},"c":"b","ok":"La fórmula molecular C₆H₁₂O₆ no identifica por sí sola un único monosacárido, porque existen numerosos isómeros con esa misma fórmula, como glucosa, galactosa y fructosa."},{"n":"35","q":"Las células procariontes y las células eucariontes presentan:","o":{"a":"Ambas, cito esqueleto.","b":"Ambas, vesículas de transporte.","c":"Ambas, información hereditaria contenida en el DNA.","d":"Ambas, un núcleo rodeado por doble membrana, dentro del cual se encuentra el DNA.","e":"Respectivamente, información hereditaria contenida en RNA y DNA."},"c":"c","ok":"Tanto las células procariontes como las eucariontes poseen ADN como material genético y ribosomas para la síntesis de proteínas. Se diferencian, entre otras cosas, en la presencia de núcleo y organelas membranosas."},{"n":"36","q":"Los anticuerpos (inmunoglobulinas) son proteínas que una vez sintetizadas pueden ser secretadas por las células plasmáticas, y quedan circulando por el plasma sanguíneo. ¿Cuál será el recorrido que sigue un aminoácido que formará parte de una molécula de anticuerpo, desde que se sintetiza esta proteína hasta que llega a su localización definitiva?","o":{"a":"Ribosoma, complejo de Golgi, medio extracelular.","b":"Ribosomas libres, medio extracelular.","c":"Ribosoma, RER, Complejo de Golgi, Citosol.","d":"Ribosoma, Complejo de Golgi, RER, medio extracelular.","e":"Ribosoma, RER, Complejo de Golgi, Medio extracelular."},"c":"e","ok":"El aminoácido que formará parte de un anticuerpo se incorpora a una proteína sintetizada en ribosomas asociados al RER; luego la proteína pasa al aparato de Golgi y finalmente se secreta por exocitosis al medio extracelular."},{"n":"37","q":"¿Cuál de los siguientes procesos produce la desnaturalización de las enzimas?","o":{"a":"Saturación de enzimas por agregado de sustratos.","b":"Liberación del producto del sitio activo.","c":"Aumento de la temperatura del medio en que se encuentra la enzima.","d":"Unión a la enzima de un modulador alostérico positivo.","e":"Unión a la enzima de un modulador alostérico negativo."},"c":"c","ok":"Una temperatura excesivamente elevada puede alterar las interacciones que mantienen la conformación de una enzima y provocar su desnaturalización, con la consiguiente pérdida de actividad."},{"n":"38","q":"¿Cuál de las siguientes opciones está ordenada según un nivel de organización creciente?","o":{"a":"Biosfera, Océano, Banco de calamares, Jaguar, Tubo Digestivo, hígado, Astrocito, peroxisoma, proteínas, Na+, neutrón.","b":"Protón, K+, Mitocondria, Levadura, Estomago, Lobos que viven en un bosque, Océano, Planeta Tierra.","c":"Cl -, Electrón, neurona, cloroplasto, perro, hígado, jauría de perros, biosfera.","d":"Planeta Tierra, océano, manada de lobos, tubo digestivo, estomago, levadura, mitocondria, K+, protón.","e":"Electrón, Ca2+, Mariposa, Álamo, Riñones, Tubo digestivo, elefantes que viven en un parque nacional, desierto, Marte."},"c":"b","ok":"La secuencia b respeta el aumento de nivel de organización: protón (subatómico) → K⁺ (átomo/ion) → mitocondria (orgánulo) → levadura (célula) → estómago (órgano) → población de lobos → océano (ecosistema) → planeta Tierra. Las otras secuencias contienen inversiones de esta jerarquía."},{"n":"39","q":"Las membranas celulares:","o":{"a":"Presentan oligosacáridos que se encuentran únicamente a la monocapa externa.","b":"Son permeables a cualquier tipo de sustancias, tanto polares como no polares.","c":"Son simétricas.","d":"Son fluidas debido a la presencia de colesterol.","e":"Son impermeables a compuestos no polares."},"c":"a","ok":"Los hidratos de carbono de las membranas, principalmente oligosacáridos unidos a proteínas o lípidos, se localizan en la cara extracelular y forman parte del glucocálix. Las membranas son asimétricas y selectivamente permeables."},{"n":"40","q":"Respecto de la fotosíntesis:","o":{"a":"La ecuación general es glucosa + 6 O2 à 6 CO2 + 6 H2O + energía.","b":"Consume O2 y produce CO2 y agua.","c":"Produce ácido láctico.","d":"Produce O2 y consume CO2 y agua","e":"Es un proceso globalmente catabólico."},"c":"d","ok":"La fotosíntesis oxigénica consume CO₂ y agua y, utilizando energía luminosa, produce materia orgánica y O₂. Por eso la opción d resume correctamente el balance global simplificado del proceso."},{"n":"38","q":"Una sustancia pequeña y no polar atraviesa las membranas celulares a favor del gradiente mediante:","o":{"a":"Difusión facilitada.","b":"Pinocitosis.","c":"Bomba.","d":"Difusión simple.","e":"Proteína transportadora."},"c":"d","ok":"Las moléculas pequeñas e hidrofóbicas o no polares (como , o benceno) se disuelven fácilmente en la matriz lipídica y atraviesan la bicapa por difusión simple, sin necesidad de transportadores proteicos ni gasto energético."},{"n":"39","q":"El pH ácido del interior de los lisosomas se debe a que acumulan H⁺ mediante:","o":{"a":"Transporte pasivo por proteína de canal.","b":"Difusión facilitada.","c":"Difusión simple.","d":"Endocitosis mediada por receptor.","e":"Transporte activo por bomba."},"c":"e","ok":"Las bombas V-ATPasa de la membrana lisosomal consumen ATP para transportar activamente H⁺ desde el citosol hacia el lumen del lisosoma, manteniendo allí un pH cercano a 4,5–5,0."},{"n":"36","q":"¿Cuál de las siguientes sustancias requiere gasto de energía metabólica para ingresar a la célula?","o":{"a":"O2.","b":"Sodio, cuando se desplaza a favor del gradiente.","c":"Agua.","d":"Macromoléculas.","e":"Glucosa, cuando se encuentra en mayor concentración fuera que dentro de la célula."},"c":"d","ok":"Las macromoléculas y partículas grandes ingresan por endocitosis, un transporte en masa que requiere deformación de la membrana y participación del citoesqueleto, con gasto de energía celular."},{"n":"35","q":"¿Cuál de las siguientes afirmaciones de los oligosacáridos de la membrana plasmática es verdadera?","o":{"a":"Se encuentran en ambas caras de la membrana.","b":"Muestran escasa diversidad química.","c":"Son importantes en reacciones de reconocimiento en la superficie celular.","d":"Le dan fluidez a la membrana."},"c":"c","ok":"Los oligosacáridos del glucocálix participan en el reconocimiento celular, la adhesión y otras interacciones en la superficie de la célula."},{"n":"30","q":"La hidrólisis de dos proteínas que dan por resultado los mismos aminoácidos permite concluir que:","o":{"a":"No son la misma proteína. (O que presentan la misma composición de aminoácidos, pero no necesariamente el mismo orden/secuencia).","b":"No se puede realizar ninguna afirmación. (En el contexto riguroso de la evaluación, con los mismos aminoácidos exactos en proporción, no podemos concluir que sean la misma o distinta proteína, ya que la identidad depende del orden/secuencia).","c":"Son proteínas con funciones similares.","d":"Ambas tienen la misma estructura tridimensional.","e":"Son del mismo organismo."},"c":"b","ok":"La hidrólisis rompe los enlaces peptídicos y revela la composición de aminoácidos de cada proteína, pero no permite reconstruir su secuencia original, conformación tridimensional ni función. Por eso no se puede afirmar que sean la misma o distinta proteína a partir de ese dato solamente."},{"n":"31","q":"El mal plegamiento de una proteína puede deberse a:","o":{"a":"Cambio de un aminoácido (por ej., con carga) por otro (por ej., neutro) en su secuencia polipeptídica.","b":"Falta de un aminoácido en su secuencia polipeptídica.","c":"Agregado de un aminoácido en su secuencia polipeptídica.","d":"Cambio del pH del medio.","e":"Todas las anteriores son correctas."},"c":"e","ok":"El mal plegamiento puede originarse por cambios en la secuencia de aminoácidos, por inserciones o deleciones y también por cambios del entorno, como alteraciones del pH. Por lo tanto, las opciones a, b, c y d pueden contribuir al plegamiento incorrecto y la opción e es la válida."},{"n":"25","q":"La mancha de grasa sale con detergente, pues estos compuestos respectivamente son:","o":{"a":"Hidrofílica, hidrofóbico.","b":"Hidrofóbica, hidrofóbico.","c":"Hidrofóbica, anfipático.","d":"Hidrofóbica, hidrofílico.","e":"Anfipática, hidrofílico."},"c":"c","ok":"La grasa es predominantemente hidrofóbica, mientras que los detergentes son anfipáticos, con una región apolar que interactúa con la grasa y una región polar que permite dispersarla en agua."},{"n":"26","q":"El ADN:","o":{"a":"Presenta estructura secundaria de tipo alfa hélice.","b":"Presenta un apareamiento específico entre las bases nitrogenadas de cada cadena.","c":"Las dos cadenas presentan las mismas secuencias de nucleótidos.","d":"Las dos cadenas se unen entre sí por enlaces fosfodiéster.","e":"En eucariontes está en su totalidad dentro del núcleo."},"c":"b","ok":"La doble hélice del ADN se estabiliza mediante el apareamiento específico de bases complementarias: A con T y G con C, unidas por puentes de hidrógeno. Los enlaces fosfodiéster unen los nucleótidos de cada hebra, no las dos hebras entre sí."},{"n":"27","q":"Entre las funciones de los nucleótidos se encuentra:","o":{"a":"Reserva de energía a largo plazo.","b":"Ser combustibles celulares.","c":"Estructural.","d":"Transporte de .","e":"Transporte de energía."},"c":"d","ok":"El enunciado de la opción d quedó incompleto en la fuente extraída. Además, la opción e (“Transporte de energía”) también describe una función real de nucleótidos trifosfatados como ATP y GTP, por lo que el ítem no permite establecer una única respuesta inequívoca."},{"n":"28","q":"¿Cuál de las siguientes sustancias NO es un glúcido u hidrato de carbono?","o":{"a":"Glucosa.","b":"Almidón.","c":"Enzima.","d":"Desoxirribosa.","e":"Celulosa."},"c":"d","ok":"Las enzimas son principalmente proteínas y no son glúcidos; en cambio, la glucosa, la desoxirribosa, el almidón y la celulosa sí son carbohidratos."},{"n":"29","q":"¿Cuál de las siguientes moléculas almacena energía en el hígado y músculo?","o":{"a":"ATP.","b":"Agua.","c":"Almidón.","d":"Glucógeno."},"c":"d","ok":"El glucógeno es el polisacárido de reserva energética característico de las células animales, almacenado principalmente en los hepatocitos y en el tejido muscular esquelético."},{"n":"22","q":"Los enlaces que se rompen cuando el agua se evapora son:","o":{"a":"Iónicos.","b":"Covalentes no polares.","c":"Covalentes polares.","d":"Puentes de H."},"c":"d","ok":"Al evaporarse el agua se rompen las interacciones intermoleculares, principalmente los puentes de hidrógeno, que mantienen unidas a las moléculas de agua. Los enlaces covalentes O–H dentro de cada molécula permanecen intactos."},{"n":"23","q":"¿Cuáles de las siguientes afirmaciones se refieren a reacciones de hidrólisis?","o":{"a":"La síntesis de los polímeros resulta de este tipo de reacción.","b":"Son reacciones que liberan agua.","c":"La ruptura de enlaces covalentes puede efectuarse mediante este tipo de reacción.","d":"La desnaturalización de una proteína resulta de este tipo de reacción.","e":"La disolución de moléculas polares en agua se produce mediante este tipo de reacción."},"c":"c","ok":"La hidrólisis utiliza una molécula de agua para romper enlaces covalentes, por ejemplo enlaces glucosídicos, peptídicos o éster. Es el proceso opuesto a una reacción de condensación."},{"n":"24","q":"Una de las siguientes afirmaciones acerca de los enlaces covalentes NO es verdadera:","o":{"a":"Entre dos átomos sólo puede formarse un enlace covalente simple.","b":"Un enlace covalente es más fuerte que un puente de H.","c":"Un enlace covalente puede formarse entre átomos del mismo elemento químico.","d":"Un enlace covalente es el resultado de que dos átomos compartan electrones.","e":"Un enlace covalente puede formarse entre átomos de diferentes elementos."},"c":"c","ok":"La opción a es problemática: entre dos átomos pueden existir enlaces simples, dobles o triples, de modo que la afirmación depende de interpretar estrictamente “enlace simple”. Como la redacción permite una lectura técnicamente verdadera y otra incorrecta, el ítem es ambiguo."},{"n":"20","q":"El recorrido que sigue un aminoácido que formará parte de una enzima que cataliza la hidrólisis de polisacáridos en el tubo digestivo es:","o":{"a":"Ribosoma, RER, complejo de Golgi, medio extracelular.","b":"Complejo de Golgi, ribosoma, RER, medio extracelular.","c":"Ribosoma, RER, complejo de Golgi, lisosoma.","d":"Sólo pasa por los ribosomas.","e":"Ribosoma, REL, membrana plasmática."},"c":"a","ok":"Las enzimas digestivas son proteínas destinadas a la secreción: se traducen en ribosomas asociados al RER, pasan al aparato de Golgi para su procesamiento y empaquetamiento, y finalmente se liberan al medio extracelular por exocitosis."},{"n":"1","q":"La PEP carboxilasa y la rubisco son dos enzimas que catalizan una reacción en la que uno de los sustratos es el CO2. Sin embargo, la primera funciona a bajas concentraciones de CO2 y con mayor velocidad que la rubisco. Por tanto:","o":{"a":"La PEP carboxilasa presenta mayor afinidad por el CO2.","b":"La PEP carboxilasa presenta menor afinidad por el CO2 que la rubisco.","c":"La PEP carboxilasa es más específica que la rubisco.","d":"La PEP carboxilasa es menos específica que la rubisco.","e":"Ambas enzimas presentan la misma afinidad por el CO2."},"c":"a","ok":"La PEP carboxilasa puede alcanzar una alta velocidad de reacción incluso a bajas concentraciones de CO₂, lo que indica una mayor afinidad aparente por el sustrato que la rubisco; en términos de Michaelis-Menten, corresponde a un Kₘ menor."},{"n":"2","q":"Si se compara el zimógeno con su forma activa, aquel presenta:","o":{"a":"menos aminoácidos.","b":"más aminoácidos.","c":"la misma cantidad de aminoácidos.","d":"más especificidad por el sustrato.","e":"más afinidad por el sustrato."},"c":"b","ok":"Un zimógeno es un precursor enzimático inactivo que suele contener un segmento adicional que se elimina durante la activación proteolítica. Por eso el zimógeno posee más aminoácidos que la enzima madura."},{"n":"3","q":"¿Cuál de las siguientes características es exclusiva de las enzimas alostéricas?","o":{"a":"Su hidrólisis rinde aminoácidos.","b":"Se saturan con altas concentraciones de sustrato.","c":"Su actividad depende del pH del medio.","d":"Tienen un sitio activo y uno o más sitios para moduladores.","e":"Su actividad depende de la temperatura del medio."},"c":"d","ok":"Las enzimas alostéricas poseen, además del sitio activo, uno o más sitios reguladores donde se unen moduladores que cambian la conformación y la actividad de la enzima. Esa característica permite una regulación que no corresponde a las enzimas michaelianas simples."},{"n":"4","q":"El ciclo de Krebs:","o":{"a":"Utiliza FADH2 y NADH.","b":"Utiliza ATP.","c":"Es exclusivamente catabólico.","d":"Es exclusivamente anabólico.","e":"Produce CO2."},"c":"e","ok":"El ciclo de Krebs es una vía anfibólica. Por cada acetil-CoA libera dos CO₂ y produce coenzimas reducidas, principalmente NADH y FADH₂."},{"n":"5","q":"La teoría del endosimbionte explica el origen de:","o":{"a":"las células eucariontes.","b":"la respiración celular aeróbica.","c":"las mitocondrias y cloroplastos.","d":"La fotosíntesis.","e":"El núcleo de las células."},"c":"c","ok":"La teoría endosimbiótica propone que las mitocondrias y los cloroplastos surgieron a partir de bacterias que establecieron asociaciones simbióticas estables con células ancestrales. La presencia de doble membrana, ADN circular y ribosomas de tipo bacteriano respalda esta interpretación."},{"n":"6","q":"La respiración celular aeróbica y la fermentación:","o":{"a":"Ambas tienen lugar en el mismo orgánulo de la célula.","b":"Presentan diferentes aceptores finales de electrones y protones de los combustibles oxidados.","c":"En ambas se produce la oxidación total del combustible.","d":"Ambas son procesos endergónicos.","e":"En ambas se produce la reducción total del combustible."},"c":"b","ok":"En la respiración aeróbica, el aceptor final de electrones es el O₂. En la fermentación, el aceptor final es una molécula orgánica derivada del metabolismo, como el piruvato o el acetaldehído."},{"n":"7","q":"¿Cuál de los siguientes procesos metabólicos les permite a las células obtener mayor cantidad de ATP?","o":{"a":"La oxidación completa de un ácido graso de 18 carbonos.","b":"La fermentación láctica.","c":"La fermentación alcohólica.","d":"La oxidación completa de la glucosa.","e":"La glucólisis."},"c":"a","ok":"Los ácidos grasos están más reducidos que la glucosa y su oxidación genera más equivalentes reductores. Por eso, la oxidación completa de un ácido graso de 18 carbonos produce mucho más ATP que la oxidación de una glucosa o una fermentación."},{"n":"8","q":"En relación a la historia de la vida, la aparición del O2 en la atmósfera:","o":{"a":"Fue consecuencia de la aparición de las mitocondrias.","b":"Fue consecuencia de la respiración celular aeróbica.","c":"No tuvo importancia alguna en el curso de la evolución de los seres vivos.","d":"Se explica mediante la teoría endosimbionte.","e":"Fue consecuencia de la actividad de los primeros fotosintetizadores."},"c":"e","ok":"La fotosíntesis oxigénica ancestral fue desarrollada por procariontes fotosintéticos relacionados con las cianobacterias, que utilizaron agua como fuente de electrones y liberaron O₂. Su actividad contribuyó al aumento de oxígeno atmosférico."},{"n":"9","q":"Elija un proceso exergónico:","o":{"a":"La síntesis de proteínas.","b":"La cadena respiratoria.","c":"El ciclo de Calvin.","d":"Contracción muscular.","e":"Exocitosis."},"c":"b","ok":"El flujo de electrones por la cadena respiratoria es exergónico y libera energía que se utiliza para bombear protones. El gradiente electroquímico resultante impulsa la síntesis de ATP por la ATP sintasa."},{"n":"10","q":"Si se riega una planta con agua, cuyo oxígeno es radiactivo, al cabo de varias horas de iluminación, la mayor parte de la radiactividad aparecerá en:","o":{"a":"El almidón.","b":"El CO2 en el aire.","c":"Las moléculas de glucosa sintetizadas.","d":"Las hojas de la planta.","e":"El O2 del aire."},"c":"e","ok":"En la fotólisis del agua, las moléculas de H₂O son oxidadas y sus átomos de oxígeno terminan formando O₂ gaseoso. Por ello, el oxígeno radiactivamente marcado del agua aparece en el O₂ liberado al aire."},{"n":"11","q":"La mayor parte de la energía metabólica requerida por un camello que realiza largas travesías sin ingerir alimentos ni beber agua, se almacena como:","o":{"a":"Glucógeno.","b":"Triacilgliceroles.","c":"Proteína.","d":"Hidratos de C.","e":"
