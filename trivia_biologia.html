<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioArcade · Biología Celular y Molecular</title>
<style>
:root{--bg:#0F0826;--pn:#1A1040;--op:#2A1B66;--oh:#3B2A8C;--bd:#4B34B0;--ac:#8B5CF6;--tx:#F1ECFF;--su:#B8ABE6;--ok:#2ECC71;--er:#E74C3C;--or:#FFA62B;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 6px}
.hud{max-width:820px;margin:auto;background:var(--pn);border-radius:18px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-weight:700}
.hud h1{font-size:20px;margin:0 auto 0 0;color:var(--ac)}
.pg{max-width:820px;margin:8px auto 0;font-size:13px;color:var(--su);display:flex;justify-content:space-between}
.bar{max-width:820px;margin:4px auto 0;height:12px;border-radius:6px;background:var(--pn);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6D3AE8,var(--ac));transition:width .45s ease}
main{max-width:820px;margin:auto;padding:8px 14px 24px}
.card{background:var(--pn);border:2px solid var(--bd);border-radius:18px;padding:16px 20px;margin-bottom:12px}
.card small{color:var(--ac);font-weight:600}
.card h2{font-size:21px;margin:6px 0 0;line-height:1.35}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--op);color:var(--tx);border:2px solid var(--bd);border-radius:16px;font:inherit;font-size:17px;cursor:pointer;transition:background .15s,border-color .15s}
.op b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.op:hover:not(:disabled){background:var(--oh);border-color:var(--ac)}
.op:disabled{cursor:default}
.op.dim{opacity:.5}
.op.ok{background:var(--ok);border-color:#A9F5C8;color:#04210F;opacity:1}
.op.ok b{background:#04210F;color:var(--ok)}
.op.mal{background:var(--er);border-color:#FFB3AB;color:#fff;opacity:1}
.op.mal b{background:#fff;color:var(--er)}
#ex{margin-top:16px;animation:up .35s ease-out}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
.res{font-size:22px;font-weight:800;margin-bottom:8px}
.res.g{color:var(--ok)}.res.r{color:var(--er)}
.box{border-radius:14px;padding:12px 16px;margin:10px 0;border:2px solid}
.box.g{background:#0F3A26;border-color:var(--ok)}.box.g>b{color:var(--ok)}
.box.r{background:#3B1420;border-color:var(--er)}.box.r>b{color:#FF8A7E}
.box p{margin:4px 0 0;font-size:15px}
.d{display:flex;gap:10px;padding:8px;border-radius:10px;margin-top:6px}
.d.sel{background:#4A1B29;outline:2px solid var(--er)}
.d>b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--er);display:grid;place-items:center;font-size:14px}
.d i{font-weight:700;color:#FFB3AB;font-style:normal}
.d p{margin:2px 0 0;font-size:15px}
footer{position:sticky;bottom:0;background:var(--bg);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.ctl{max-width:820px;margin:auto;background:var(--pn);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctl button,.fin button{min-height:46px;border:0;border-radius:14px;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#bs{background:var(--op)}#bn{background:var(--ac)}#br{background:#5A1E3A}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.fin{text-align:center;background:var(--pn);border:3px solid var(--ac);border-radius:22px;padding:28px 16px;margin-top:24px}
.fin h2{font-size:30px;color:var(--ac);margin:0 0 10px}
.fin button{padding:0 18px;margin:8px 6px}
@media(max-width:560px){.ctl button{font-size:13px}.card h2{font-size:18px}.op{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
<div class="hud"><h1>🧬 BioArcade</h1><span id="hr" style="color:var(--or)"></span><span id="ha" style="color:var(--ok)"></span><span id="he" style="color:var(--er)"></span><span id="hp"></span></div>
<div class="pg"><span id="pt"></span><span id="pr"></span></div>
<div class="bar"><i id="pb"></i></div>
</header>
<main id="main"></main>
<footer><div class="ctl"><button id="bs">⏭ Saltar pregunta</button><button id="bn">Siguiente ▶</button><button id="br">🔄 Reiniciar parcial</button></div></footer>
<script>
const D=[{"n":"1","q":"Una molécula de ADN tiene:","o":{"a":"el mismo número de adeninas que guaninas","b":"el mismo número de adeninas que de timinas","c":"el mismo número de adeninas que uracilos","d":"el mismo número de guaninas que de timinas"},"c":"b","ok":"Según la Regla de Chargaff, en el ADN la adenina (A) se aparea siempre con la timina (T) mediante dos puentes de hidrógeno, por lo que sus proporciones son iguales ( ). La guanina (G) se aparea con la citocina ©. El uracilo es exclusivo del ARN.","bad":{"a":"«el mismo número de adeninas que guaninas»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","c":"«el mismo número de adeninas que uracilos»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","d":"«el mismo número de guaninas que de timinas»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases."}},{"n":"2","q":"¿Cómo son las uniones de moléculas de ADN?","o":{"a":"las dos cadenas se unen entre sí a través de las bases nitrogenadas por uniones fosfodiéster","b":"las dos cadenas se unen entre sí a través de las bases nitrogenadas por uniones puentes hidrógeno","c":"los nucleótidos en la misma cadena se unen entre sí mediante uniones puente de hidrógeno","d":"los nucleótidos de la misma cadena se unen entre sí mediante su base nitrogenada"},"c":"b","ok":"Las dos hebras antiparalelas del ADN se mantienen unidas por puentes de hidrógeno entre sus bases complementarias (A=T y G≡C). Los nucleótidos de una misma cadena se unen covalentemente mediante enlaces fosfodiéster.","bad":{"a":"«las dos cadenas se unen entre sí a través de las bases nitrogenadas por uniones fosfodiéster»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","c":"«los nucleótidos en la misma cadena se unen entre sí mediante uniones puente de hidrógeno»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","d":"«los nucleótidos de la misma cadena se unen entre sí mediante su base nitrogenada»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases."}},{"n":"3","q":"Los fosfolípidos y los glucolípidos:","o":{"a":"forman parte de las paredes de la célula eucarionte","b":"forman parte de las paredes celulares en animales","c":"forman parte de la membrana plasmática y de las membranas de las organelas","d":"forman parte de la membrana plasmática en eucariontes, pero no en procariontes"},"c":"c","ok":"Son componentes estructurales clave de las bicapas lipídicas de todas las membranas celulares y del sistema de endomembranas. Las células animales no poseen pared celular.","bad":{"a":"«forman parte de las paredes de la célula eucarionte»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","b":"«forman parte de las paredes celulares en animales»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","d":"«forman parte de la membrana plasmática en eucariontes, pero no en procariontes»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas."}},{"n":"4","q":"Los triglicéridos se caracterizan porque:","o":{"a":"se sintetizan a partir del glicerol y ácidos grasos","b":"forman la membrana plasmática","c":"conforman las membranas de organelas","d":"almacenan energía en el glicerol"},"c":"a","ok":"Un triglicérido es una molécula de reserva energética formada por la esterificación de una molécula de glicerol con tres moléculas de ácidos grasos. No cumplen funciones estructurales en membranas.","bad":{"b":"«forman la membrana plasmática»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","c":"«conforman las membranas de organelas»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","d":"«almacenan energía en el glicerol»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas."}},{"n":"5","q":"Un ácido graso está formado por:","o":{"a":"un grupo carboxilo soluble en agua y una cadena carbonada también soluble en agua","b":"un grupo amino anfipático y una cadena carbonada insoluble en agua","c":"un grupo carboxilo y dos cadenas carbonadas","d":"un grupo carboxilo soluble en agua y una cadena carbonada insoluble en agua"},"c":"d","ok":"Son moléculas anfipáticas: poseen una “cabeza” polar hidrofilica (grupo carboxilo ) y una “cola” no polar hidrofóbica (cadena hidrocarbonada).","bad":{"a":"«un grupo carboxilo soluble en agua y una cadena carbonada también soluble en agua»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","b":"«un grupo amino anfipático y una cadena carbonada insoluble en agua»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","c":"«un grupo carboxilo y dos cadenas carbonadas»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas."}},{"n":"6","q":"¿Cuál de las siguientes moléculas es un polisacárido de reserva en células animales y vegetales respectivamente?","o":{"a":"glucógeno y almidón","b":"almidón y glucógeno","c":"celulosa y glucógeno","d":"glucógeno y celulosa"},"c":"a","ok":"El glucógeno es la reserva energética de glucosa en animales (hígado y músculo), mientras que el almidón es la reserva energética en vegetales. La celulosa es estructural, no de reserva.","bad":{"b":"«almidón y glucógeno»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","c":"«celulosa y glucógeno»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","d":"«glucógeno y celulosa»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización."}},{"n":"7","q":"¿Cuál de las siguientes moléculas es un disacárido?","o":{"a":"glucógeno","b":"celulosa","c":"lactosa","d":"almidón"},"c":"c","ok":"La lactosa es un disacárido formado por la unión de glucosa y galactosa. El glucógeno, la celulosa y el almidón son polisacáridos.","bad":{"a":"«glucógeno»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«celulosa»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«almidón»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"8","q":"La celulosa, el glucógeno y el almidón están formados por:","o":{"a":"lactosas y glucosas","b":"dos tipos de monosacáridos distintos","c":"glucosas","d":"glucosas y fructosa"},"c":"c","ok":"Los tres son homopolisacáridos compuestos exclusivamente por monómeros de D- glucosa unidos por distintos tipos de enlaces glucosídicos ( o ).","bad":{"a":"«lactosas y glucosas»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","b":"«dos tipos de monosacáridos distintos»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","d":"«glucosas y fructosa»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización."}},{"n":"9","q":"Si una proteína se desnaturaliza:","o":{"a":"pierde todas sus estructuras, incluso la primaria","b":"pierde todas sus estructuras excepto la primaria","c":"se obtienen aminoácidos libres","d":"se obtienen oligosacáridos"},"c":"b","ok":"La desnaturalización altera las estructuras secundaria, terciaria y cuaternaria al romper interacciones no covalentes, pero conserva la estructura primaria porque no rompe, en condiciones habituales de desnaturalización, los enlaces peptídicos.","bad":{"a":"«pierde todas sus estructuras, incluso la primaria»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","c":"«se obtienen aminoácidos libres»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«se obtienen oligosacáridos»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"10","q":"Las uniones peptídicas se producen:","o":{"a":"entre el grupo amino de un aminoácido con el grupo R de otro","b":"entre el grupo carboxilo de un aminoácido con el de otro aminoácido","c":"entre el grupo carboxilo de un aminoácido con el grupo amino de otro aminoácido","d":"entre el grupo R de un aminoácido y el grupo R de otro aminoácido"},"c":"c","ok":"El enlace peptídico es una unión covalente de tipo amida entre el grupo carboxilo ( ) del primer aminoácido y el grupo amino ( ) del segundo, liberando una molécula de agua.","bad":{"a":"«entre el grupo amino de un aminoácido con el grupo R de otro»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","b":"«entre el grupo carboxilo de un aminoácido con el de otro aminoácido»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«entre el grupo R de un aminoácido y el grupo R de otro aminoácido»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"11","q":"Los fosfolípidos:","o":{"a":"almacenan energía en las membranas celulares","b":"están formados solo por glicerol y ácidos grasos","c":"forman parte de las membranas celulares","d":"forman las paredes en las membranas celulares"},"c":"c","ok":"Son los componentes lipídicos mayoritarios de las bicapas celulares debido a su naturaleza anfipática.","bad":{"a":"«almacenan energía en las membranas celulares»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","b":"«están formados solo por glicerol y ácidos grasos»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","d":"«forman las paredes en las membranas celulares»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas."}},{"n":"12","q":"Las reacciones anabólicas:","o":{"a":"liberan energía","b":"consumen energía","c":"son de degradación","d":"son exergónicas"},"c":"b","ok":"El anabolismo es el conjunto de procesos de síntesis metabólica donde se construyen moléculas complejas a partir de precursoras simples. Requieren aporte energético (endergónicas). −COOH −NH 2","bad":{"a":"«liberan energía»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«son de degradación»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«son exergónicas»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"13","q":"Las moléculas de ATP tienen la función de:","o":{"a":"almacenar energía como el glucógeno y los ácidos grasos","b":"transportar energía hacia los procesos que la requieran","c":"consumir energía","d":"transportar energía almacenada en la pentosa"},"c":"b","ok":"El ATP funciona como el “intermediario o moneda energética” celular, transfiriendo energía desde las reacciones exergónicas hacia las endergónicas a través del enlace fosfato.","bad":{"a":"«almacenar energía como el glucógeno y los ácidos grasos»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","c":"«consumir energía»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","d":"«transportar energía almacenada en la pentosa»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"14","q":"¿Cuál de las siguientes reacciones puede ser calificada como anabólica?","o":{"a":"fosfolípido glicerol + tres ácidos grasos","b":"Glucosa + + agua","c":"glucoproteína glucosa + proteína","d":"aminoácido + aminoácido + aminoácido tripéptido"},"c":"d","ok":"Es una reacción de síntesis o construcción (formación de enlaces peptídicos entre monómeros para formar un polímero más complejo). Las demás opciones son catabólicas (degradativas).","bad":{"a":"«fosfolípido glicerol + tres ácidos grasos»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«Glucosa + + agua»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«glucoproteína glucosa + proteína»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"15","q":"El ATP proporciona energía para:","o":{"a":"las reacciones catabólicas para el transporte activo a través de las membranas","b":"las reacciones anabólicas y para el transporte activo a través de las membranas","c":"las reacciones anabólicas y catabólicas","d":"las reacciones exergónicas y carbónicas"},"c":"b","ok":"Se utiliza en procesos endergónicos: síntesis metabólica (anabolismo), transporte activo en contra de gradiente y trabajo mecánico.","bad":{"a":"«las reacciones catabólicas para el transporte activo a través de las membranas»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","c":"«las reacciones anabólicas y catabólicas»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","d":"«las reacciones exergónicas y carbónicas»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"16","q":"Las enzimas: → O → 2 CO 2 → →","o":{"a":"transportan energía a las reacciones anabólicas","b":"solo catalizan las reacciones endergónicas","c":"solo catalizan las reacciones exergónicas","d":"aceleran las reacciones químicas tanto anabólicas como catabólicas"},"c":"d","ok":"Son catalizadores biológicos que disminuyen la energía de activación de las reacciones químicas celulares sin consumirse en el proceso, independientemente de si son anabólicas o catabólicas.","bad":{"a":"«transportan energía a las reacciones anabólicas»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","b":"«solo catalizan las reacciones endergónicas»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","c":"«solo catalizan las reacciones exergónicas»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción."}},{"n":"17","q":"Las enzimas alostéricas:","o":{"a":"no tienen sitio activo","b":"tienen sitio activo y un sitio alostérico","c":"se unen a los moduladores que aportan energía","d":"son aquellas que reconocen distintos tipos de sustratos a la vez"},"c":"b","ok":"Además del sitio activo donde se une el sustrato, presentan sitios de regulación (sitios alostéricos) donde se unen moduladores o efectores que alteran su actividad reguladora.","bad":{"a":"«no tienen sitio activo»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","c":"«se unen a los moduladores que aportan energía»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","d":"«son aquellas que reconocen distintos tipos de sustratos a la vez»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción."}},{"n":"18","q":"¿Cuál de las siguientes opciones sobre las enzimas es correcta?","o":{"a":"una enzima es capaz de unirse a cualquier sustrato indistintamente","b":"cada enzima posee un sitio específico de unión a un sustrato específico","c":"la actividad enzimática no cambia si aumenta la temperatura","d":"todas las enzimas tienen el mismo sitio activo"},"c":"b","ok":"Las enzimas poseen una alta especificidad de sustrato determinada por la conformación tridimensional de su sitio activo.","bad":{"a":"«una enzima es capaz de unirse a cualquier sustrato indistintamente»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","c":"«la actividad enzimática no cambia si aumenta la temperatura»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","d":"«todas las enzimas tienen el mismo sitio activo»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción."}},{"n":"19","q":"Indique la opción correcta sobre energía:","o":{"a":"se crea, pero no se destruye","b":"se destruye, pero no se crea","c":"no se crea ni se destruye","d":"no se crea ni se destruye ni se transforma"},"c":"c","ok":"Primera Ley de la Termodinámica: La energía no se crea ni se destruye, solo se transforma de una forma a otra.","bad":{"a":"«se crea, pero no se destruye»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","b":"«se destruye, pero no se crea»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","d":"«no se crea ni se destruye ni se transforma»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"20","q":"El colesterol:","o":{"a":"forma parte de la membrana en células vegetales y animales","b":"forma parte de la membrana en la célula animal y de la pared en la célula vegetal","c":"forma parte de la membrana de células animales","d":"forma parte de la membrana de células vegetales"},"c":"c","ok":"El colesterol es un esteroide característico de las membranas de células animales (regula su fluidez). Las plantas poseen fitoesteroles.","bad":{"a":"«forma parte de la membrana en células vegetales y animales»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","b":"«forma parte de la membrana en la célula animal y de la pared en la célula vegetal»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","d":"«forma parte de la membrana de células vegetales»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas."}},{"n":"21","q":"La membrana plasmática:","o":{"a":"presenta hidratos de carbono en el interior de la bicapa de fosfolípidos","b":"tiene oligosacáridos en su cara externa","c":"tiene oligosacáridos en su cara plasmática","d":"tiene oligosacáridos en su cara citoplasmática"},"c":"b","ok":"Los hidratos de carbono (glucolípidos y glucoproteínas) se ubican exclusivamente en la monocapa externa de la membrana plasmática formando el glucocálix.","bad":{"a":"«presenta hidratos de carbono en el interior de la bicapa de fosfolípidos»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","c":"«tiene oligosacáridos en su cara plasmática»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«tiene oligosacáridos en su cara citoplasmática»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"22","q":"Señalar la opción correcta sobre el transporte de membrana:","o":{"a":"durante la fagocitosis se forma una vesícula en el interior de la célula","b":"la ósmosis consume energía","c":"la bomba de sodio-potasio no consume energía","d":"los iones se transportan por ósmosis"},"c":"a","ok":"La fagocitosis es un tipo de endocitosis (transporte en masa) que envuelve partículas en vesículas endocíticas. La ósmosis es transporte pasivo (agua) y la bomba es transporte activo primario que consume ATP.","bad":{"b":"«la ósmosis consume energía»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","c":"«la bomba de sodio-potasio no consume energía»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«los iones se transportan por ósmosis»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"23","q":"¿Qué tipo de macromoléculas forman la membrana plasmática?","o":{"a":"fosfolípidos unidos entre sí mediante uniones covalentes","b":"proteínas que forman bicapas","c":"lípidos, proteínas e hidratos de carbono","d":"fosfolípidos, glucolípidos, proteínas y ácidos nucleicos"},"c":"c","ok":"De acuerdo con el modelo de mosaico fluido, la membrana está constituida por una bicapa lipídica (fosfolípidos y colesterol), proteínas integrales y periféricas, y glúcidos acoplados. No contiene ácidos nucleicos.","bad":{"a":"«fosfolípidos unidos entre sí mediante uniones covalentes»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","b":"«proteínas que forman bicapas»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«fosfolípidos, glucolípidos, proteínas y ácidos nucleicos»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"24","q":"En la difusión facilitada las sustancias ingresan:","o":{"a":"a favor de un gradiente de concentración, sin gasto de energía, directamente a través de la bicapa","b":"a favor de un gradiente de concentración, sin gasto de energía, a través de proteínas específicas","c":"a favor o en contra de un gradiente de concentración a través de proteínas específicas","d":"con gasto de energía y las sustancias pasan en contra del gradiente"},"c":"b","ok":"Es un transporte pasivo (no requiere ATP, va a favor de gradiente) que utiliza transportadores proteicos (canales o carries) para moléculas polares o con carga.","bad":{"a":"«a favor de un gradiente de concentración, sin gasto de energía, directamente a través de la bicapa»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","c":"«a favor o en contra de un gradiente de concentración a través de proteínas específicas»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«con gasto de energía y las sustancias pasan en contra del gradiente»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"25","q":"El oxígeno:","o":{"a":"atraviesa la membrana luego de unirse a receptores","b":"atraviesa la membrana en contra de un gradiente","c":"atraviesa la membrana por difusión simple","d":"ingresa a la célula por ósmosis"},"c":"c","ok":"Las moléculas pequeñas y no polares (como el y ) atraviesan directamente la bicapa lipídica por difusión simple a favor de su gradiente de concentración.","bad":{"a":"«atraviesa la membrana luego de unirse a receptores»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«atraviesa la membrana en contra de un gradiente»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«ingresa a la célula por ósmosis»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"26","q":"La pinocitosis:","o":{"a":"es un mecanismo de transporte pasivo","b":"es un mecanismo de transporte activo","c":"permite el ingreso de sólidos a la célula","d":"permite la salida de sólidos de la célula"},"c":"b","ok":"La pinocitosis es una forma de endocitosis (invaginación de líquido extracelular con solutos disueltos) y, al implicar deformación de la membrana y formación de vesículas, requiere gasto de ATP (mecanismo activo/en masa).","bad":{"a":"«es un mecanismo de transporte pasivo»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«permite el ingreso de sólidos a la célula»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«permite la salida de sólidos de la célula»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"27","q":"En los lisosomas:","o":{"a":"se obtiene energía en forma de ATP de los alimentos digeridos","b":"se digieren macromoléculas que ingresan por fagocitosis","c":"se digieren en agua e ingresan por pinocitosis","d":"se fabrican enzimas digestivas"},"c":"b","ok":"Los lisosomas son organelas que contienen hidrolasas ácidas para la digestión intracelular de material endocitado o componentes autofágicos. Las enzimas se sintetizan en el RER.","bad":{"a":"«se obtiene energía en forma de ATP de los alimentos digeridos»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","c":"«se digieren en agua e ingresan por pinocitosis»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","d":"«se fabrican enzimas digestivas»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula."}},{"n":"28","q":"El aparato de Golgi:","o":{"a":"recibe proteínas que se fabrican en ribosomas libres","b":"recibe proteínas que se fabrican en ribosomas unidos al retículo endoplásmico rugoso","c":"no recibe proteínas","d":"recibe todas las proteínas que se fabrican en cualquier parte de la célula"},"c":"b","ok":"Forma parte del sistema de endomembranas. Recibe las proteínas que entran por el RER mediante vesículas de transporte para su procesamiento, modificación (como glucosilación) y empaquetamiento.","bad":{"a":"«recibe proteínas que se fabrican en ribosomas libres»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","c":"«no recibe proteínas»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","d":"«recibe todas las proteínas que se fabrican en cualquier parte de la célula»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula."}},{"n":"29","q":"¿Cuál de las siguientes proteínas se fabrica en el Retículo Endoplásmico Rugoso (RER)?","o":{"a":"enzimas del citoplasma","b":"proteína de la membrana plasmática","c":"proteínas de los ribosomas","d":"histonas"},"c":"b","ok":"Los ribosomas adosados al RER sintetizan proteínas destinadas a membranas, organelas del sistema de endomembranas o secreción celular. Las proteínas citosólicas, histonas y ribosómicas se sintetizan en ribosomas libres.","bad":{"a":"«enzimas del citoplasma»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","c":"«proteínas de los ribosomas»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«histonas»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"30","q":"Los macrófagos son células que fagocitan bacterias. En la digestión de la bacteria intervienen:","o":{"a":"lisosomas","b":"cloroplastos","c":"ribosomas","d":"Retículo Endoplásmico Liso"},"c":"a","ok":"Tras la fagocitosis, el fagosoma se fusiona con un lisosoma primario para formar un fagolisosoma, donde las enzimas lisosomales degradan el material bacteriano.","bad":{"b":"«cloroplastos»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","c":"«ribosomas»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","d":"«Retículo Endoplásmico Liso»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas."}},{"n":"31","q":"Los cloroplastos:","o":{"a":"son organelas donde las células procariontes realizan fotosíntesis","b":"son organelas donde ciertas células eucariontes realizan fotosíntesis","c":"son organelas donde ciertas células animales y vegetales realizan fotosíntesis","d":"son organelas de plantas y hongos realizan fotosíntesis"},"c":"b","ok":"Los cloroplastos son organelas presentes exclusivamente en células eucariontes autótrofas (plantas y algas). Las bacterias fotosintéticas no tienen cloroplastos y los hongos no realizan fotosíntesis.","bad":{"a":"«son organelas donde las células procariontes realizan fotosíntesis»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","c":"«son organelas donde ciertas células animales y vegetales realizan fotosíntesis»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","d":"«son organelas de plantas y hongos realizan fotosíntesis»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"32","q":"¿Con qué átomos se fabrica la glucosa durante la fotosíntesis?","o":{"a":"CO₂ atmosférico e hidrógeno de las moléculas de agua provenientes del suelo","b":"átomos de moléculas orgánicas provenientes del suelo","c":"carbono, hidrógeno, oxígeno, nitrógeno, fósforo y azufre","d":"CO₂ atmosférico (carbono y oxígeno) e hidrógeno del agua"},"c":"d","ok":"En la fase oscura (Ciclo de Calvin), el aporta el carbono y el oxígeno, mientras que el agua aporta el hidrógeno (transportado por NADPH) para fijar y formar la molécula de glucosa ( ).","bad":{"a":"«CO₂ atmosférico e hidrógeno de las moléculas de agua provenientes del suelo»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","b":"«átomos de moléculas orgánicas provenientes del suelo»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","c":"«carbono, hidrógeno, oxígeno, nitrógeno, fósforo y azufre»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"33","q":"¿Qué diferencias y similitudes hay entre una célula vegetal y una célula animal?","o":{"a":"ambas tienen mitocondrias y cloroplastos","b":"ambas tienen mitocondrias","c":"las células animales respiran y las vegetales no","d":"ambas son heterótrofas"},"c":"b","ok":"Tanto la célula animal como la vegetal poseen mitocondrias para llevar a cabo la respiración celular aeróbica. Los cloroplastos son exclusivos de las plantas y algas.","bad":{"a":"«ambas tienen mitocondrias y cloroplastos»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","c":"«las células animales respiran y las vegetales no»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","d":"«ambas son heterótrofas»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas."}},{"n":"34","q":"En la etapa lumínica de la fotosíntesis se produce:","o":{"a":"glucosa y oxígeno","b":"glucosa y ATP","c":"oxígeno y ATP","d":"dióxido de carbono y agua"},"c":"c","ok":"En la etapa fotoquímica (en los tilacoides), la energía luminosa rompe moléculas de agua (fotólisis), liberando como subproducto y generando ATP y NADPH.","bad":{"a":"«glucosa y oxígeno»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","b":"«glucosa y ATP»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","d":"«dióxido de carbono y agua»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"35","q":"¿Qué productos se obtienen de la etapa lumínica de la fotosíntesis?","o":{"a":"clorofila y agua","b":"oxígeno que se libera (y ATP / NADPH)","c":"dióxido de carbono","d":"oxígeno que se utiliza en la etapa bioquímica"},"c":"b","ok":"El oxígeno generado por la fotólisis del agua es expulsado al exterior de la célula. El ATP y NADPH producidos son los que pasan a ser utilizados en la etapa bioquímica.","bad":{"a":"«clorofila y agua»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","c":"«dióxido de carbono»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","d":"«oxígeno que se utiliza en la etapa bioquímica»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"36","q":"Durante la etapa bioquímica de la fotosíntesis:","o":{" TP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"38","q":"En la glucólisis:","o":{"a":"la glucosa se transforma en una molécula de ácido pirúvico","b":"la glucosa se transforma en dos moléculas de ácido pirúvico","c":"la glucosa se degrada completamente a dióxido de carbono","d":"la glucosa se transforma en ATP"},"c":"b","ok":"Ocurre en el citosol: una molécula de hexosa (glucosa, 6C) se escinde en dos moléculas de piruvato (3C), obteniéndose un rendimiento neto de 2 ATP y 2 NADH.","bad":{"a":"«la glucosa se transforma en una molécula de ácido pirúvico»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","c":"«la glucosa se degrada completamente a dióxido de carbono»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","d":"«la glucosa se transforma en ATP»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol."}},{"n":"39","q":"La respiración celular consiste en:","o":{"a":"incorporar oxígeno y liberar dióxido de carbono","b":"obtener energía de los alimentos como la glucosa","c":"oxidar el oxígeno para obtener energía","d":"un proceso anabólico para obtener energía"},"c":"b","ok":"Es un conjunto de vías catabólicas exergónicas en las cuales los compuestos orgánicos se degradan oxidativamente para extraer energía en forma de ATP.","bad":{"a":"«incorporar oxígeno y liberar dióxido de carbono»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","c":"«oxidar el oxígeno para obtener energía»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","d":"«un proceso anabólico para obtener energía»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol."}},{"n":"40","q":"Durante la glucólisis:","o":{"a":"se produce ATP a partir de la molécula de glucosa","b":"la glucosa se oxida en la mitocondria","c":"se consume oxígeno y se libera dióxido de carbono","d":"la glucosa se oxida completamente"},"c":"a","ok":"Ocurre en el citoplasma (es un proceso anaeróbico) y produce una ganancia neta de 2 ATP por fosforilación a nivel de sustrato.","bad":{"b":"«la glucosa se oxida en la mitocondria»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","c":"«se consume oxígeno y se libera dióxido de carbono»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","d":"«la glucosa se oxida completamente»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol."}},{"n":"41","q":"¿Cuál es la función de la mitocondria?","o":{"a":"fabricar agua","b":"obtener energía en forma de ATP","c":"liberar oxígeno","d":"fabricar ATP y liberar oxígeno"},"c":"b","ok":"Es la organela encargada de la respiración celular aeróbica (Ciclo de Krebs, cadena respiratoria y fosforilación oxidativa) con el objetivo de sintetizar ATP.","bad":{"a":"«fabricar agua»: es incorrecta porque n ca, citoplasma, ribosomas y material genético (ADN). Las bacterias no poseen organelas membranosas, histonas verdaderas ni ADN lineal.","bad":{"a":"«ADN, membrana plasmática y organelas»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","b":"«ADN asociado a histonas»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","c":"«ADN lineal»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas."}},{"n":"50","q":"Si se hidroliza una molécula de ADN, ¿qué molécula se obtiene?","o":{"a":"nucleótidos con pentosa desoxirribosa","b":"nucleótidos con pentosa rugosa","c":"nucleótidos con pentosa rugosa y desoxirribosa","d":"únicamente desoxirribosa"},"c":"a","ok":"La hidrólisis completa del polímero de ADN rinde sus monómeros constituyentes: desoxirribonucleótidos (compuestos por desoxirribosa, un grupo fosfato y una base nitrogenada).","bad":{"b":"«nucleótidos con pentosa rugosa»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","c":"«nucleótidos con pentosa rugosa y desoxirribosa»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","d":"«únicamente desoxirribosa»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases."}},{"n":"2","q":"En un organismo autótrofo, la liberación de oxígeno al medio, en la fotosíntesis, ocurre:","o":{"a":"A partir del CO2","b":"Independiente de la luz solar","c":"Debido a la fotolisis del agua","d":"Durante la fijación del CO2","e":"Durante el Ciclo de Calvin"},"c":"c","ok":"El oxígeno ( ) liberado en la fase lumínica proviene del rompimiento (fotólicis) de las moléculas de agua ( ) en el fotosistema II para reponer los electrones perdidos por la clorofila, y no de la molécula de .","bad":{"a":"«A partir del CO2»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","b":"«Independiente de la luz solar»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","d":"«Durante la fijación del CO2»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","e":"«Durante el Ciclo de Calvin»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"3","q":"Elija un proceso exergónico:","o":{"a":"Contracción muscular","b":"Ciclo de Calvin","c":"Exocitosis","d":"Glucólisis","e":"Síntesis de proteína"},"c":"d","ok":"La glucólisis es una vía catabólica de degradación que libera energía libre ( ) liberando ATP y NADH. Las demás opciones son procesos endergónicos que consumen ATP.","bad":{"a":"«Contracción muscular»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«Ciclo de Calvin»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Exocitosis»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","e":"«Síntesis de proteína»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"4","q":"Respecto al ciclo de Krebs, se puede afirmar que:","o":{"a":"Produce coenzimas oxidadas","b":"Produce coenzimas reducidas","c":"Consume ATP","d":"Consume CO2","e":"Consume O2"},"c":"b","ok":"Durante las descarboxilaciones oxidativas del ciclo de Krebs, los electrones e hidrógenos liberados son aceptados por las coenzimas y , transformándolas en sus formas reducidas: y .","bad":{"a":"«Produce coenzimas oxidadas»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","c":"«Consume ATP»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","d":"«Consume CO2»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","e":"«Consume O2»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol."}},{"n":"5","q":"Al hidrolizar una proteína, se puede afirmar que:","o":{"a":"Se obtiene la cadena polipeptídica desplegada","b":"Se rompen los enlaces covalentes que presenta","c":"Solo se rompen los enlaces puentes de hidrógeno, iónicos y otras uniones débiles que presenta","d":"Se afecta actividad biológica, pero no su estructura","e":"Se afecta la estructura secundaria, la terciaria y la cuaternaria, pero no la primaria"},"c":"b","ok":"A diferencia de la desnaturalización (que solo rompe uniones débiles y afecta la conformación tridimensional), la hidrólisis rompe enzimática o químicamente los enlaces peptídicos (enlaces covalentes), fragmentando la estructura primaria y liberando aminoácidos o péptidos cortos.","bad":{"a":"«Se obtiene la cadena polipeptídica desplegada»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","c":"«Solo se rompen los enlaces puentes de hidrógeno, iónicos y otras uniones débiles que presenta»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«Se afecta actividad biológica, pero no su estructura»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","e":"«Se afecta la estructura secundaria, la terciaria y la cuaternaria, pero no la primaria»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"6","q":"Durante la fermentación de la masa para producir el pan, la levadura:","o":{"a":"Producen O2","b":"Producen etanol y CO2","c":"Consumen CO2 y H2O","d":"Producen ácido láctico","e":"Producen CO2 y H2O"},"c":"b","ok":"Las levaduras (Saccharomyces cerevisiae) realizan fermentación alcohólica, un proceso anaeróbico que degrada el piruvato derivado de la glucosa produciendo etanol y dióxido de carbono ( ). Este último es el gas que hace leudar o inflar la masa.","bad":{"a":"«Producen O2»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","c":"«Consumen CO2 y H2O»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","d":"«Producen ácido láctico»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","e":"«Producen CO2 y H2O»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol."}},{"n":"7","q":"En relación con las proteínas, se puede afirmar que:","o":{"a":"No son saturables","b":"Siempre están formadas por una sola cadena polipeptídica","c":"Su estructura no se ve afectada por la temperatura","d":"No son afectadas por los cambios de pH","e":"Pueden requerir un cofactor para presentar actividad biológica"},"c":"b","ok":"Muchas proteínas y enzimas complejas (heteroproteínas o holoenzimas) requieren componentes no proteicos llamados cofactores (iones metálicos) o coenzimas (moléculas orgánicas como vitaminas) para adquirir su conformación funcional activa.","bad":{"a":"«No son saturables»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","c":"«Su estructura no se ve afectada por la temperatura»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«No son afectadas por los cambios de pH»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","e":"«Pueden requerir un cofactor para presentar actividad biológica»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"8","q":"Las enzimas son específicas dado que:","o":{"a":"Catalizan reacciones a un pH óptimo","b":"Solo reconocen uno o pocos sustratos","c":"Catalizan reacciones anabólicas","d":"Catalizan reacciones a una temperatura óptima","e":"Catalizan reacciones catabólicas"},"c":"e","ok":"La especificidad enzimática se fundamenta en la complementariedad estructural entre la forma/carga de su sitio activo y la estructura tridimensional de uno o unos pocos sustratos específicos.","bad":{"a":"«Catalizan reacciones a un pH óptimo»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","b":"«Solo reconocen uno o pocos sustratos»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","c":"«Catalizan reacciones anabólicas»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","d":"«Catalizan reacciones a una temperatura óptima»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción."}},{"n":"9","q":"¿Cuál de estas sustancias es una proteína?","o":{"a":"Coenzima","b":"ATP","c":"Aminoácidos","d":"RNA","e":"Transportador de glucosa"},"c":"b","ok":"Los transportadores de glucosa (como los de la familia GLUT) son proteínas integrales de la membrana plasmática. El ATP y RNA son nucleótidos/ácidos nucleicos, y los aminoácidos son los monómeros precursores.","bad":{"a":"«Coenzima»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","c":"«Aminoácidos»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«RNA»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","e":"«Transportador de glucosa»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"10","q":"En relación con los niveles de organización de la materia, se puede afirmar que:","o":{"a":"El nivel atómico presenta menor estabilidad que el celular","b":"La población es un nivel de organización menos complejo que la comunidad","c":"La hoja de un cuchillo pertenece al nivel de organización macromolecular","d":"Los ecosistemas presentan bajo requerimiento energético para mantener su organización","e":"La biosfera corresponde a un nivel de organización que presenta alta estabilidad"},"c":"e","ok":"En la jerarquía ecológica de complejidad creciente, una población (organismos de la misma especie) está contenida dentro de una comunidad (conjunto de poblaciones de distintas especies que interactúan en un área determinada).","bad":{"a":"«El nivel atómico presenta menor estabilidad que el celular»: es incorrecta porque la jerarquía biológica aumenta desde partículas y moléculas hacia organelas, células, tejidos y niveles ecológicos superiores.","b":"«La población es un nivel de organización menos complejo que la comunidad»: es incorrecta porque la jerarquía biológica aumenta desde partículas y moléculas hacia organelas, células, tejidos y niveles ecológicos superiores.","c":"«La hoja de un cuchillo pertenece al nivel de organización macromolecular»: es incorrecta porque la jerarquía biológica aumenta desde partículas y moléculas hacia organelas, células, tejidos y niveles ecológicos superiores.","d":"«Los ecosistemas presentan bajo requerimiento energético para mantener su organización»: es incorrecta porque la jerarquía biológica aumenta desde partículas y moléculas hacia organelas, células, tejidos y niveles ecológicos superiores."}},{"n":"12","q":"Las moléculas como el atraviesan las membranas de las células, a favor de gradiente de concentración, mediante:","o":{"a":"Difusión simple","b":"Endocitosis mediada por receptor","c":"Proteínas transportadoras","d":"Difusión facilitada","e":"Bombas"},"c":"b","ok":"Al ser una molécula pequeña, no polar y sin carga, el (al igual que el ) atraviesa la bicapa lipídica directamente por difusión simple pasiva sin requerir transportadores ni gasto de energía.","bad":{"a":"«Difusión simple»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","c":"«Proteínas transportadoras»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«Difusión facilitada»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","e":"«Bombas»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"13","q":"La celulosa que ingerimos en la dieta:","o":{"a":"Es la principal fuente de aminoácidos para nuestras células","b":"Es la principal fuente de ácidos grasos para nuestras células","c":"No se puede hidrolizar en nuestro tubo digestivo debido a las uniones glucosídicas que unen los monómeros que la forman","d":"Incrementa las reservas de glucógeno en el hígado, si está en exceso en nuestra dieta","e":"Es la principal fuente de moléculas de glucosa para nuestras células"},"c":"a","ok":"El ser humano carece de las enzimas digestivas (como la celulasa) capaces de romper los enlaces glucosídicos que unen las glucosas de la celulosa, actuando únicamente como fibra alimentaria.","bad":{"b":"«Es la principal fuente de ácidos grasos para nuestras células»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","c":"«No se puede hidrolizar en nuestro tubo digestivo debido a las uniones glucosídicas que unen los monómeros que la forman»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","d":"«Incrementa las reservas de glucógeno en el hígado, si está en exceso en nuestra dieta»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","e":"«Es la principal fuente de moléculas de glucosa para nuestras células»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización."}},{"n":"14","q":"¿Cuál de los siguientes procesos metabólicos les permite a las células obtener mayor cantidad de ATP?","o":{"a":"Oxidación completa de la glucosa","b":"Fermentación alcohólica","c":"Oxidación completa de un ácido graso de 18 carbonos","d":"Glucólisis","e":"Fermentación láctica"},"c":"c","ok":"Por gramo o por molécula, los ácidos grasos son sustratos mucho más reducidos que la glucosa. La -oxidación completa de un ácido graso de 18 carbonos (ácido esteárico) genera aproximadamente 120 moléculas de ATP, superando con creces a la oxidación completa de la glucosa (~30-32 ATP).","bad":{"a":"«Oxidación completa de la glucosa»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","b":"«Fermentación alcohólica»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","d":"«Glucólisis»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","e":"«Fermentación láctica»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"15","q":"La fórmula puede corresponder:","o":{"a":"Solamente a las cetohexosas","b":"Solamente a las aldohexosas","c":"A todos los carbohidratos","d":"A cualquier monosacárido de 6 carbonos","e":"Exclusivamente a la glucosa"},"c":"d","ok":"Es la fórmula molecular empírica general de las hexosas (monosacáridos de 6 carbonos), la cual engloba tanto a aldohexosas (como la glucosa y galactosa) como a cetohexosas (como la fructosa), que son isómeros entre sí. β(1 →4) β C6H12O6","bad":{"a":"«Solamente a las cetohexosas»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«Solamente a las aldohexosas»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«A todos los carbohidratos»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","e":"«Exclusivamente a la glucosa»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"16","q":"Entre las propiedades de las enzimas se puede mencionar que:","o":{"a":"Presentan máxima actividad a cualquier temperatura entre 0º C y 37º C","b":"Una enzima determinada puede unirse a una gran variedad de sustratos","c":"Solo pueden catalizar reacciones exergónicas","d":"Catalizan tanto reacciones endergónicas como exergónicas","e":"Transforman en exergónicas a las reacciones endergónicas que de este modo pueden llevarse a cabo"},"c":"d","ok":"Las enzimas aceleran la velocidad de una reacción (disminuyen la energía de activación) independientemente del sentido termodinámico de la misma. No alteran la variación de energía libre ( ) del proceso.","bad":{"a":"«Presentan máxima actividad a cualquier temperatura entre 0º C y 37º C»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","b":"«Una enzima determinada puede unirse a una gran variedad de sustratos»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","c":"«Solo pueden catalizar reacciones exergónicas»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","e":"«Transforman en exergónicas a las reacciones endergónicas que de este modo pueden llevarse a cabo»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción."}},{"n":"17","q":"Las membranas celulares están formadas, entre otros compuestos, por:","o":{"a":"Fosfolípidos, proteínas y glicoproteínas, y glicolípidos","b":"Ácidos grasos libres, proteínas y fosfolípidos","c":"Ácidos grasos libres, proteínas y colesterol","d":"Triacilgliceroles, proteínas y colesterol","e":"Glicolípidos, proteínas y celulosa"},"c":"a","ok":"La estructura de la membrana responde al modelo de mosaico fluido, compuesta por una matriz de fosfolípidos (y colesterol en animales), proteínas (integrales/periféricas) y glúcidos acoplados en la cara externa como glicoproteínas y glicolípidos.","bad":{"b":"«Ácidos grasos libres, proteínas y fosfolípidos»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","c":"«Ácidos grasos libres, proteínas y colesterol»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«Triacilgliceroles, proteínas y colesterol»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","e":"«Glicolípidos, proteínas y celulosa»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"18","q":"Respecto al DNA, se puede afirmar que:","o":{"a":"Está formado por 2 cadenas complementarias unidas entre sí por puentes de hidrógeno","b":"Su hidrólisis da como resultado 2 cadenas de polinucleótidos","c":"Su hidrólisis da por resultado desoxirribosa, fosfato, adenina, guanina, citosina y uracilo","d":"Está formado por 2 cadenas complementarias unidas entre sí por enlaces fosfodiéster","e":"Su hidrólisis da por resultado ribosa, fosfato, adenina, guanina, citosina y timina"},"c":"a","ok":"El ADN es una doble hélice con dos cadenas antiparalelas sostenidas transversalmente por puentes de hidrógeno entre sus bases nitrogenadas complementarias ( y ). Los enlaces fosfodiéster conectan los nucleótidos en una misma cadena.","bad":{"b":"«Su hidrólisis da como resultado 2 cadenas de polinucleótidos»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","c":"«Su hidrólisis da por resultado desoxirribosa, fosfato, adenina, guanina, citosina y uracilo»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","d":"«Está formado por 2 cadenas complementarias unidas entre sí por enlaces fosfodiéster»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","e":"«Su hidrólisis da por resultado ribosa, fosfato, adenina, guanina, citosina y timina»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases."}},{"n":"19","q":"¿Cuál de las siguientes moléculas es un esteroide?","o":{"a":"Hormonas sexuales","b":"Caroteno","c":"Ceras","d":"Aminoácidos","e":"Triacilglicerol"},"c":"a","ok":"Las hormonas sexuales (como estrógenos, progesterona y testosterona) son lípidos no saponificables derivados del núcleo del ciclopentanoperhidrofenantreno (estructura esteroide, derivada del colesterol).","bad":{"b":"«Caroteno»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Ceras»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«Aminoácidos»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","e":"«Triacilglicerol»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"20","q":"Los filamentos de actina:","o":{"a":"Forman el anillo contráctil en la división celular","b":"Participan en el movimiento de cilios y flagelos","c":"Se forman por polimerización de tubulina","d":"Forman el huso mitótico en la división celular","e":"Forman los centriolos"},"c":"b","ok":"En las células animales, los microfilamentos de actina asociados a la miosina conforman el anillo contráctil que estrangula el citoplasma durante la citocinesis. Las opciones b, c, d y e responden a los microtúbulos.","bad":{"a":"«Forman el anillo contráctil en la división celular»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Se forman por polimerización de tubulina»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«Forman el huso mitótico en la división celular»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","e":"«Forman los centriolos»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"21","q":"En relación con el almidón y el glucógeno se puede afirmar que presentan función:","o":{"a":"De almacenamiento en animales y plantas respectivamente","b":"Estructural en plantas","c":"De reserva de glucosa en animales","d":"De almacenamiento energético, en plantas y animales respectivamente","e":"Estructural en plantas y de almacenamiento energético en animales respectivamente"},"c":"d","ok":"Ambos son homopolisacáridos de reserva energética de glucosa: el almidón es la forma de reserva en el reino vegetal y el glucógeno en el reino animal (hígado y tejido muscular).","bad":{"a":"«De almacenamiento en animales y plantas respectivamente»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","b":"«Estructural en plantas»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","c":"«De reserva de glucosa en animales»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","e":"«Estructural en plantas y de almacenamiento energético en animales respectivamente»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización."}},{"n":"24","q":"¿Cuál de las siguientes moléculas almacena la mayor parte de la energía metabólica de un animal para ser usada por largos períodos de tiempo?","o":{"a":"Glucógeno","b":"Triacilgliceroles","c":"Monosacáridos","d":"ATP","e":"Vitaminas"},"c":"b","ok":"Los triacilgliceroles (grasas neutras almacenadas en los adipocitos) son altamente hidrofóbicos y reducidos, permitiendo acumular una mayor cantidad de energía por unidad de masa en comparación con los hidratos de carbono.","bad":{"a":"«Glucógeno»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","c":"«Monosacáridos»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","d":"«ATP»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","e":"«Vitaminas»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"25","q":"En relación con las vitaminas se puede afirmar que:","o":{"a":"Son sintetizadas por nuestros hepatocitos","b":"Pueden se
