zo."}},{"n":"36","q":"En el ciclo de Calvin:","o":{"a":"Se libera O2","b":"El CO2 se reduce a carbohidratos","c":"Se consumen hidratos de carbono","d":"El NADPH se oxida a NADP+","e":"Se produce grandes cantidades de ATP"},"c":"d","ok":"En la etapa bioquímica de la fotosíntesis, el producido en la fase lumínica cede sus electrones/protones para reducir el carbono del , quedando oxidado a .","bad":{"a":"«Se libera O2»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","b":"«El CO2 se reduce a carbohidratos»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","c":"«Se consumen hidratos de carbono»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","e":"«Se produce grandes cantidades de ATP»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"37","q":"Las enzimas que catalizan la síntesis de lípidos se encuentran en:","o":{"a":"La envoltura nuclear","b":"El retículo endoplásmico rugoso","c":"Los ribosomas","d":"El retículo endoplásmico liso","e":"La membrana plasmática"},"c":"b","ok":"El Retículo Endoplásmico Liso (REL) es la organela especializada en la biosíntesis de lípidos complejos (como fosfolípidos, colesterol y esteroides) y en procesos de detoxificación.","bad":{"a":"«La envoltura nuclear»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción  activo requiere energía."}},{"n":"40","q":"Respecto de la fotosíntesis:","o":{"a":"La ecuación general es glucosa + 6 O2 à 6 CO2 + 6 H2O + energía.","b":"Consume O2 y produce CO2 y agua.","c":"Produce ácido láctico.","d":"Produce O2 y consume CO2 y agua","e":"Es un proceso globalmente catabólico."},"c":"d","ok":"La opción d es la que satisface el concepto biológico solicitado.","bad":{"a":"«La ecuación general es glucosa + 6 O2 à 6 CO2 + 6 H2O + energía.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","b":"«Consume O2 y produce CO2 y agua.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","c":"«Produce ácido láctico.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","e":"«Es un proceso globalmente catabólico.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"38","q":"Una sustancia pequeña y no polar atraviesa las membranas celulares a favor del gradiente mediante:","o":{"a":"Difusión facilitada.","b":"Pinocitosis.","c":"Bomba.","d":"Difusión simple.","e":"Proteína transportadora."},"c":"d","ok":"Las moléculas pequeñas e hidrofóbicas o no polares (como , o benceno) se disuelven fácilmente en la matriz lipídica y atraviesan la bicapa por difusión simple, sin necesidad de transportadores proteicos ni gasto energético.","bad":{"a":"«Difusión facilitada.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","b":"«Pinocitosis.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","c":"«Bomba.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","e":"«Proteína transportadora.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"39","q":"El pH ácido del interior de los lisosomas se debe a que acumulan H⁺ mediante:","o":{"a":"Transporte pasivo por proteína de canal.","b":"Difusión facilitada.","c":"Difusión simple.","d":"Endocitosis mediada por receptor.","e":"Transporte activo por bomba."},"c":"e","ok":"La membrana del lisosoma cuenta con bombas de protones ( -ATPasa) que consumen ATP para acarrear activamente protones ( ) desde el citosol hacia el interior de la organela, manteniendo el pH interno alrededor de 4,5 a 5,0.","bad":{"a":"«Transporte pasivo por proteína de canal.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","b":"«Difusión facilitada.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","c":"«Difusión simple.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","d":"«Endocitosis mediada por receptor.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula."}},{"n":"36","q":"¿Cuál de las siguientes sustancias requiere gasto de energía metabólica para ingresar a la célula?","o":{"a":"O2.","b":"Sodio, cuando se desplaza a favor del gradiente.","c":"Agua.","d":"Macromoléculas.","e":"Glucosa, cuando se encuentra en mayor concentración fuera que dentro de la célula."},"c":"d","ok":"El ingreso de macromoléculas o partículas de gran tamaño ocurre mediante transporte en masa (endocitosis), un mecanismo que involucra reordenamientos del citoesqueleto y O2 CO2 H+ H+ O2 deformación de la membrana, lo cual consume ATP.","bad":{"a":"«O2.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","b":"«Sodio, cuando se desplaza a favor del gradiente.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","c":"«Agua.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","e":"«Glucosa, cuando se encuentra en mayor concentración fuera que dentro de la célula.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"35","q":"¿Cuál de las siguientes afirmaciones de los oligosacáridos de la membrana plasmática es verdadera?","o":{"a":"Se encuentran en ambas caras de la membrana.","b":"Muestran escasa diversidad química.","c":"Son importantes en reacciones de reconocimiento en la superficie celular.","d":"Le dan fluidez a la membrana."},"c":"c","ok":"Los oligosacáridos están situados exclusivamente en la cara externa de la membrana (formando el glucocálix) y funcionan como etiquetas o marcadores que permiten el reconocimiento celular e interacciones con la matriz o con otras células.","bad":{"a":"«Se encuentran en ambas caras de la membrana.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","b":"«Muestran escasa diversidad química.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«Le dan fluidez a la membrana.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"30","q":"La hidrólisis de dos proteínas que dan por resultado los mismos aminoácidos permite concluir que:","o":{"a":"No son la misma proteína. (O que presentan la misma composición de aminoácidos, pero no necesariamente el mismo orden/secuencia).","b":"No se puede realizar ninguna afirmación. (En el contexto riguroso de la evaluación, con los mismos aminoácidos exactos en proporción, no podemos concluir que sean la misma o distinta proteína, ya que la identidad depende del orden/secuencia).","c":"Son proteínas con funciones similares.","d":"Ambas tienen la misma estructura tridimensional.","e":"Son del mismo organismo."},"c":"b","ok":"La hidrólisis destruye la estructura primaria (rompe los enlaces peptídicos). Conocer únicamente la composición cualitativa o cuantitativa de los aminoácidos liberados no permite inferir su orden secuencial, su folding tridimensional ni su función biológica.","bad":{"a":"«No son la misma proteína. (O que presentan la misma composición de aminoácidos, pero no necesariamente el mismo orden/secuencia).»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","c":"«Son proteínas con funciones similares.»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«Ambas tienen la misma estructura tridimensional.»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","e":"«Son del mismo organismo.»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"31","q":"El mal plegamiento de una proteína puede deberse a:","o":{"a":"Cambio de un aminoácido (por ej., con carga) por otro (por ej., neutro) en su secuencia polipeptídica.","b":"Falta de un aminoácido en su secuencia polipeptídica.","c":"Agregado de un aminoácido en su secuencia polipeptídica.","d":"Cambio del pH del medio.","e":"Todas las anteriores son correctas."},"c":"b","ok":"La estructura primaria (secuencia de aminoácidos) determina la estructura tridimensional. Modificaciones génicas que alteren, agreguen o eliminen aminoácidos, o alteraciones en factores ambientales como el pH, perturban las interacciones no covalentes y provocan un plegamiento incorrecto o desnaturalización.","bad":{"a":"«Cambio de un aminoácido (por ej., con carga) por otro (por ej., neutro) en su secuencia polipeptídica.»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","c":"«Agregado de un aminoácido en su secuencia polipeptídica.»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","d":"«Cambio del pH del medio.»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria.","e":"«Todas las anteriores son correctas.»: es incorrecta porque la secuencia de aminoácidos determina la estructura tridimensional y función de la proteína, y los enlaces peptídicos forman su estructura primaria."}},{"n":"25","q":"La mancha de grasa sale con detergente, pues estos compuestos respectivamente son:","o":{"a":"Hidrofílica, hidrofóbico.","b":"Hidrofóbica, hidrofóbico.","c":"Hidrofóbica, anfipático.","d":"Hidrofóbica, hidrofílico.","e":"Anfipática, hidrofílico."},"c":"a","ok":"La grasa es una sustancia no polar (hidrofóbica). Los detergentes son moléculas anfipáticas (poseen una cola apolar y una cabeza polar), lo que les permite rodear la grasa formando micelas solubles en agua.","bad":{"b":"«Hidrofóbica, hidrofóbico.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Hidrofóbica, anfipático.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«Hidrofóbica, hidrofílico.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","e":"«Anfipática, hidrofílico.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"26","q":"El ADN:","o":{"a":"Presenta estructura secundaria de tipo alfa hélice.","b":"Presenta un apareamiento específico entre las bases nitrogenadas de cada cadena.","c":"Las dos cadenas presentan las mismas secuencias de nucleótidos.","d":"Las dos cadenas se unen entre sí por enlaces fosfodiéster.","e":"En eucariontes está en su totalidad dentro del núcleo."},"c":"d","ok":"En la doble hélice del ADN, las dos hebras se unen mediante apareamiento complementario y específico de bases (Adenina con Timina mediante dos puentes de H; Guanina con Citocina mediante tres puentes de H). Cabe señalar que en eucariontes también hay ADN extracelular/organular en mitocondrias y cloroplastos.","bad":{"a":"«Presenta estructura secundaria de tipo alfa hélice.»: es incorrecta porque la comp  rubisco son dos enzimas que catalizan una reacción en la que uno de los sustratos es el CO2. Sin embargo, la primera funciona a bajas concentraciones de CO2 y con mayor velocidad que la rubisco. Por tanto:","o":{"a":"La PEP carboxilasa presenta mayor afinidad por el CO2.","b":"La PEP carboxilasa presenta menor afinidad por el CO2 que la rubisco.","c":"La PEP carboxilasa es más específica que la rubisco.","d":"La PEP carboxilasa es menos específica que la rubisco.","e":"Ambas enzimas presentan la misma afinidad por el CO2."},"c":"a","ok":"La PEP carboxilasa presenta mayor afinidad por el CO₂ porque alcanza una alta velocidad de reacción incluso cuando la concentración de sustrato es baja; en términos de Michaelis- Menten, eso se asocia con un K ₘ menor.","bad":{"b":"«La PEP carboxilasa presenta menor afinidad por el CO2 que la rubisco.»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","c":"«La PEP carboxilasa es más específica que la rubisco.»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","d":"«La PEP carboxilasa es menos específica que la rubisco.»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","e":"«Ambas enzimas presentan la misma afinidad por el CO2.»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción."}},{"n":"2","q":"Si se compara el zimógeno con su forma activa, aquel presenta:","o":{"a":"menos aminoácidos.","b":"más aminoácidos.","c":"la misma cantidad de aminoácidos.","d":"más especificidad por el sustr c":"b","ok":"Los triglicéridos (o triacilgliceroles) son los depósitos de reserva energética más eficientes a largo plazo en los seres vivos por estar altamente reducidos y ser no polares (anhidros), rindiendo más del doble de energía metabólica por gramo que los glúcidos.","bad":{"a":"«Colesterol.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","c":"«Sacarosa.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","d":"«Glucosa.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"20","q":"El ADN contiene la información en:","o":{"a":"La disposición de los azúcares y los grupos fosfatos.","b":"La secuencia de desoxirribonucleótidos.","c":"La disposición de los puentes de hidrógeno que estabilizan la doble hélice. CO 2","d":"La complementariedad existente entre las bases púricas y pirimídicas."},"c":"b","ok":"El código genético o la información hereditaria radica en el orden o secuencia lineal específica de las bases nitrogenadas que forman los desoxirribonucleótidos a lo largo de la cadena polimérica.","bad":{"a":"«La disposición de los azúcares y los grupos fosfatos.»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","c":"«La disposición de los puentes de hidrógeno que estabilizan la doble hélice. CO 2»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases.","d":"«La complementariedad existente entre las bases púricas y pirimídicas.»: es incorrecta porque la composición y los enlaces de los ácidos nucleicos son específicos: ADN usa desoxirribosa y timina, ARN usa ribosa y uracilo, y las hebras se organizan mediante complementariedad de bases. Primer Parcial de Introducción a la Biología Celular - Sede Vicente López, 2018"}},{"n":"1","q":"¿Cuál de las siguientes es una característica estructural de las enzimas conjugadas?","o":{"a":"No poseen cofactor enzimático.","b":"No poseen un sitio activo.","c":"Están asociadas a coenzimas o iones.","d":"Su esquema se caracteriza por una curva clásica sigmoidea."},"c":"c","ok":"Las enzimas conjugadas (o holoenzimas) están compuestas por una parte proteica (apoenzima) y una parte no proteica (cofactor), la cual puede ser un ion metálico o un compuesto orgánico (coenzima).","bad":{"a":"«No poseen cofactor enzimático.»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","b":"«No poseen un sitio activo.»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción.","d":"«Su esquema se caracteriza por una curva clásica sigmoidea.»: es incorrecta porque las enzimas presentan especificidad, sitios activos y mecanismos de regulación definidos; además, modifican la energía de activación sin cambiar el ΔG de la reacción."}},{"n":"2","q":"En cuanto a los lisosomas:","o":{"a":"Se fusionan con Peroxisomas en la lisis de sustancias.","b":"El pH determina su actividad catalítica.","c":"El secundario es inactivo.","d":"Las bombas de H+ de su membrana no generan un pH ácido."},"c":"b","ok":"Los lisosomas contienen hidrolasas ácidas cuyo funcionamiento óptimo depende de un ambiente ácido (pH ) mantenido por las bombas de protones de su membrana.","bad":{"a":"«Se fusionan con Peroxisomas en la lisis de sustancias.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","c":"«El secundario es inactivo.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","d":"«Las bombas de H+ de su membrana no generan un pH ácido.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula."}},{"n":"3","q":"En relación con la respiración celular indique la opción correcta: ≈4.5 −5.0","o":{"a":"Comienza y finaliza en el interior de la mitocondria.","b":"Por cada molécula de glucosa se realiza un ciclo de Krebs.","c":"Por cada molécula de glucosa obtengo dos moléculas de ácido pirúvico.","d":"Es un proceso endergónico."},"c":"c","ok":"Durante la glucólisis (fase inicial citosólica), cada molécula de glucosa (6C) se rompe rindiendo dos moléculas de ácido pirúvico o piruvato (3C). Por cada glucosa se realizan dos ciclos de Krebs.","bad":{"a":"«Comienza y finaliza en el interior de la mitocondria.»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","b":"«Por cada molécula de glucosa se realiza un ciclo de Krebs.»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","d":"«Es un proceso endergónico.»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol."}},{"n":"4","q":"¿Cuál de las siguientes características corresponde al cloroplasto?","o":{"a":"Posee ADN lineal.","b":"Presenta una membrana interna con pigmentos fotosintéticos.","c":"Posee membrana tilacoidal con pigmentos fotosintéticos.","d":"Presenta la maquinaria fotosintética de las células vegetales y animales."},"c":"c","ok":"Los pigmentos fotosintéticos (como las clorofilas) y los fotosistemas se localizan exclusivamente en la membrana de los tilacoides dentro del estroma. Su ADN es circular.","bad":{"a":"«Posee ADN lineal.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","b":"«Presenta una membrana interna con pigmentos fotosintéticos.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","d":"«Presenta la maquinaria fotosintética de las células vegetales y animales.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"5","q":"Indicar cuál de las siguientes estructuras no forma parte de una membrana celular:","o":{"a":"Colesterol","b":"Proteínas integrales","c":"Ácido ribonucleico","d":"Oligosacáridos"},"c":"c","ok":"Las membranas biológicas están compuestas por lípidos (fosfolípidos, colesterol), proteínas e hidratos de carbono (oligosacáridos). No contienen ácidos nucleicos (ARN o ADN).","bad":{"a":"«Colesterol»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","b":"«Proteínas integrales»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«Oligosacáridos»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"6","q":"La glucólisis es un proceso que:","o":{"a":"Se lleva a cabo en la mitocondria.","b":"Se lleva a cabo en el cloroplasto.","c":"Se lleva a cabo en el medio extracelular.","d":"Se lleva a cabo en el citosol."},"c":"d","ok":"La glucólisis es una vía metabólica anaeróbica soluble que ocurre íntegramente en el citoplasma/citosol celular.","bad":{"a":"«Se lleva a cabo en la mitocondria.»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","b":"«Se lleva a cabo en el cloroplasto.»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol.","c":"«Se lleva a cabo en el medio extracelular.»: es incorrecta porque las vías respiratorias y fermentativas tienen etapas, localizaciones, aceptores finales y rendimientos energéticos diferentes; la glucólisis ocurre en el citosol."}},{"n":"7","q":"Marque la opción correcta en cuanto a reinos:","o":{"a":"Todos los organismos del reino monera y el plantae son autótrofos.","b":"El monera, fungi, plantae tienen en común la pared celular formada por celulosa.","c":"El protista es procarionte y eucarionte.","d":"El monera es un descomponedor de materia orgánica."},"c":"d","ok":"Muchas bacterias del reino Monera cumplen un rol clave en los ecosistemas como saprófitas o descomponedoras de materia orgánica. (El reino Protista es exclusivamente eucarionte; la pared de hongos es de quitina y muchas bacterias son heterótrofas).","bad":{"a":"«Todos los organismos del reino monera y el plantae son autótrofos.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","b":"«El monera, fungi, plantae tienen en común la pared celular formada por celulosa.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","c":"«El protista es procarionte y eucarionte.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas."}},{"n":"8","q":"Con respecto a las biomoléculas podemos decir:","o":{"a":"Los ácidos grasos son la principal fuente de energía.","b":"Los lípidos anfipáticos no forman bicapas.","c":"La celulosa forma un armazón proteico en células procariontes.","d":"La estructura terciaria de las proteínas determina la organización globular o fibrosa."},"c":"d","ok":"El tipo de plegamiento tridimensional que adopta la cadena polipeptídica en su estructura terciaria define si adquiere una conformación compacta/esférica (globular) o alargada (fibrosa).","bad":{"a":"«Los ácidos grasos son la principal fuente de energía.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«Los lípidos anfipáticos no forman bicapas.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«La celulosa forma un armazón proteico en células procariontes.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"9","q":"Las células eucariontes son:","o":{"a":"Pluricelulares y autótrofas.","b":"Autótrofas o heterótrofas.","c":"Sistemas cerrados.","d":"Unicelulares y heterótrofas."},"c":"b","ok":"El dominio eucariota engloba tanto a seres autótrofos (como plantas y algas) como a heterótrofos (como animales y hongos), pudiendo ser unicelulares o pluricelulares.","bad":{"a":"«Pluricelulares y autótrofas.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","c":"«Sistemas cerrados.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","d":"«Unicelulares y heterótrofas.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas."}},{"n":"10","q":"Indicar una característica de los peroxisomas:","o":{"a":"Forman parte del sistema de endomembranas.","b":"Se ubica en la membrana plasmática.","c":"Degradan bacterias.","d":"Metabolizan el peróxido de hidrógeno."},"c":"d","ok":"Contienen enzimas oxidativas como la catalasa, encargada de degradar el peróxido de hidrógeno ( ), una especie reactiva de oxígeno tóxica para la célula.","bad":{"a":"«Forman parte del sistema de endomembranas.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","b":"«Se ubica en la membrana plasmática.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","c":"«Degradan bacterias.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula."}},{"n":"11","q":"¿Cuál es la función del retículo endoplasmático granular (REG)?","o":{"a":"Almacenar el Ca2+ intracellular.","b":"Sintetizar lípidos de membrana.","c":"Forma parte del mecanismo de digestión celular.","d":"Sintetizar proteínas de distinto destino."},"c":"d","ok":"Los ribosomas adosados a su membrana sintetizan proteínas destinadas a secreción, lisosomas o integración en membranas celulares.","bad":{"a":"«Almacenar el Ca2+ intracellular.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","b":"«Sintetizar lípidos de membrana.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula.","c":"«Forma parte del mecanismo de digestión celular.»: es incorrecta porque cada organela posee funciones específicas y un destino celular determinado dentro de la organización de la célula."}},{"n":"12","q":"¿Cuál es la función de la molécula de ATP?","o":{"a":"Es un catalizador biológico.","b":"Disminuir la energía de activación.","c":"Transmitir información genética.","d":"Es un mediador energético."},"c":"d","ok":"El ATP funciona como la “moneda energética” o intermediario que acopla químicamente las reacciones exergónicas (catabolismo) con las endergónicas (anabolismo y trabajo celular).","bad":{"a":"«Es un catalizador biológico.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","b":"«Disminuir la energía de activación.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo.","c":"«Transmitir información genética.»: es incorrecta porque el ATP actúa principalmente como intermediario energético de corto plazo y su hidrólisis puede acoplar procesos endergónicos; no sustituye a las reservas energéticas de largo plazo."}},{"n":"13","q":"Marque una de las diferencias entre las células eucariontes y procariontes:","o":{"a":"Ambas poseen núcleo.","b":"Ninguna posee ribosomas.","c":"Se diferencian en su mecanismo de división celular.","d":"Ambas poseen mitocondrias."},"c":"c","ok":"Las células procariontes se dividen por fisión binaria simple, mientras que las eucariontes realizan división celular compleja por mitosis o meiosis. (Las procariontes carecen de núcleo y mitocondrias).","bad":{"a":"«Ambas poseen núcleo.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","b":"«Ninguna posee ribosomas.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","d":"«Ambas poseen mitocondrias.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas."}},{"n":"14","q":"¿Cuál de las siguientes estructuras es únicamente de composición proteica?","o":{"a":"Microtúbulos","b":"Membrana celular","c":"Glucógeno","d":"Almidón"},"c":"a","ok":"Los microtúbulos son polímeros compuestos exclusivamente por la proteína tubulina ( y ). La membrana contiene lípidos y carbohidratos; el glucógeno y almidón son polisacáridos.","bad":{"b":"«Membrana celular»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Glucógeno»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«Almidón»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"15","q":"En la fotosíntesis:","o":{"a":"Es un proceso exergónico y de formación de ATP.","b":"Los productos de la etapa lumínica son glúcidos.","c":"Los fotosistemas I y II sintetizan ATP.","d":"Comprende la formación de glúcidos en el ciclo de Calvin-Benson."},"c":"d","ok":"En la etapa bioquímica o ciclo de Calvin-Benson (ocurrida en el estroma), se fija el utilizando el ATP y NADPH de la fase clara para sintetizar azúcares (glúcidos).","bad":{"a":"«Es un proceso exergónico y de formación de ATP.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","b":"«Los productos de la etapa lumínica son glúcidos.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos.","c":"«Los fotosistemas I y II sintetizan ATP.»: es incorrecta porque la fotosíntesis separa una fase luminosa, que produce ATP/NADPH y libera O₂ a partir del agua, de una fase de fijación de carbono que usa ATP y NADPH para sintetizar glúcidos."}},{"n":"16","q":"Ordenar de forma creciente los elementos, según los niveles de organización:","o":{"a":"agua – oxígeno – virus – planta.","b":"oligosacárido – glucógeno – mitocondria – célula.","c":"almidón – ácido graso – cloroplasto – tejido muscular.","d":"célula – RER – ácidos nucleicos – aminoácido."},"c":"b","ok":"El orden creciente correcto según la jerarquía molecular/celular es: Oligosacárido (oligómero) Glucógeno (macromolécula/polisacárido) Mitocondria (organela) Célula (nivel celular).","bad":{"a":"«agua – oxígeno – virus – planta.»: es incorrecta porque la jerarquía biológica aumenta desde partículas y moléculas hacia organelas, células, tejidos y niveles ecológicos superiores.","c":"«almidón – ácido graso – cloroplasto – tejido muscular.»: es incorrecta porque la jerarquía biológica aumenta desde partículas y moléculas hacia organelas, células, tejidos y niveles ecológicos superiores.","d":"«célula – RER – ácidos nucleicos – aminoácido.»: es incorrecta porque la jerarquía biológica aumenta desde partículas y moléculas hacia organelas, células, tejidos y niveles ecológicos superiores."}},{"n":"17","q":"¿Cuál de los siguientes elementos está compuesto por lípidos?","o":{"a":"Ribosoma","b":"Envoltura nuclear","c":"Centriolo","d":"Cromosoma"},"c":"b","ok":"La envoltura o carioteca nuclear es una estructura membranosa constituida por una doble bicapa lipídica con proteínas asociadas. Los ribosomas, centriolos y cromosomas carecen de componentes lipídicos.","bad":{"a":"«Ribosoma»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","c":"«Centriolo»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas.","d":"«Cromosoma»: es incorrecta porque los lípidos tienen propiedades de solubilidad y organización distintas; los triacilgliceroles sirven principalmente como reserva energética y los fosfolípidos forman membranas."}},{"n":"18","q":"¿Cuál es la característica estructural de los microfilamentos?","o":{"a":"Están formados por monómeros de actina G.","b":"Están formados por monómeros de tubulina.","c":"Formar parte de la estructura de cilios.","d":"Están formados por proteínas llamadas laminina."},"c":"a","ok":"Los microfilamentos del citoesqueleto se forman por la polimerización de la proteína globular actina G para constituir filamentos de actina F.","bad":{"b":"«Están formados por monómeros de tubulina.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Formar parte de la estructura de cilios.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«Están formados por proteínas llamadas laminina.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"19","q":"¿Cuál de las siguientes oraciones caracteriza mejor al reino plantae?","o":{"a":"Es el único autótrofo.","b":"En cuanto al número de células, es pluricelular.","c":"Posee un mecanismo de reproducción sexual.","d":"Sus células se encargan de fijar el nitrógeno atmosférico."},"c":"b","ok":"Todos los representantes del reino Plantae son organismos eucariontes pluricelulares y autótrofos fotosintéticos. (Existen procariontes y protistas autótrofos; las bacterias fijan el nitrógeno).","bad":{"a":"«Es el único autótrofo.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","c":"«Posee un mecanismo de reproducción sexual.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas.","d":"«Sus células se encargan de fijar el nitrógeno atmosférico.»: es incorrecta porque las células y los reinos se distinguen por rasgos estructurales y funcionales definidos, como la presencia de núcleo, pared celular y organelas."}},{"n":"20","q":"Con respecto a los virus:","o":{"a":"Son proteínas con capacidad infectiva en el sistema nervioso central.","b":"La reproducción viral se lleva a cabo en el citoplasma eucarionte.","c":"Son moléculas de ARN o ADN, asociadas a proteínas.","d":"Poseen su propia maquinaria biosintética."},"c":"c","ok":"Los virus son complejos macromoleculares o parásitos intracelulares obligados constituidos por un genoma de ácido nucleico (ADN o ARN) rodeado por una cubierta proteica llamada cápside. Carecen de maquinaria biosintética propia.","bad":{"a":"«Son proteínas con capacidad infectiva en el sistema nervioso central.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«La reproducción viral se lleva a cabo en el citoplasma eucarionte.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«Poseen su propia maquinaria biosintética.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"1","q":"Los seres vivos:","o":{"a":"Poseen un metabolismo propio.","b":"Se consideran vivos solo si poseen material genético.","c":"Poseen sus células siempre encapsuladas.","d":"Pueden reproducirse valiéndose de la maquinaria de otro organismo."},"c":"a","ok":"Todos los seres vivos son sistemas abiertos autorregulados con capacidad de realizar metabolismo (intercambio y transformación de materia y energía con el entorno). Los virus poseen material genético y se reproducen con maquinaria ajena, pero carecen de metabolismo propio y no se consideran seres vivos autónomos.","bad":{"b":"«Se consideran vivos solo si poseen material genético.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Poseen sus células siempre encapsuladas.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","d":"«Pueden reproducirse valiéndose de la maquinaria de otro organismo.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"2","q":"La homeostasis es la capacidad de:","o":{"a":"Separarse del entorno.","b":"Romper macromoléculas para generar ATP.","c":"Utilizar ATP para realizar un trabajo.","d":"Mantener el medio interno constante."},"c":"d","ok":"La homeostasis se define como el conjunto de mecanismos fisiológicos orientados a mantener la estabilidad y constancia de las propiedades fisicoquímicas del medio interno celular u orgánico frente a las variaciones del exterior.","bad":{"a":"«Separarse del entorno.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«Romper macromoléculas para generar ATP.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Utilizar ATP para realizar un trabajo.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"3","q":"El límite de resolución es la capacidad de un:","o":{"a":"Organismo para ser visto.","b":"Sistema óptico para ver a lo lejos.","c":"Sistema óptico para ver determinado organismo.","d":"Sistema óptico para ver dos puntos como separados."},"c":"d","ok":"En microscopía, el límite de resolución representa la menor distancia que debe existir entre dos puntos contiguos para que un sistema óptico pueda distinguirlos como entidades independientes y separadas.","bad":{"a":"«Organismo para ser visto.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","b":"«Sistema óptico para ver a lo lejos.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado.","c":"«Sistema óptico para ver determinado organismo.»: es incorrecta porque no satisface el criterio biológico específico planteado por el enunciado."}},{"n":"4","q":"Para ver la estructura de la membrana plasmática de una célula se utiliza:","o":{"a":"El microscopio óptico sin teñir.","b":"El microscopio óptico con tinción.","c":"El microscopio electrónico de transmisión.","d":"No puede verse la célula ni sus componentes al microscopio."},"c":"c","ok":"La bicapa lipídica tiene un grosor aproximado de , el cual sobrepasa el límite de resolución del microscopio óptico ( ). Se requiere un microscopio electrónico de transmisión (MET) para observar su patrón trilaminar clásico.","bad":{"a":"«El microscopio óptico sin teñir.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","b":"«El microscopio óptico con tinción.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía.","d":"«No puede verse la célula ni sus componentes al microscopio.»: es incorrecta porque la membrana plasmática es una bicapa lipídica selectivamente permeable; el transporte pasivo ocurre a favor del gradiente y el activo requiere energía."}},{"n":"5","q":"Los glúcidos se caracterizan por:","o":{"a":"Representar la principal fuente de energía para la célula.","b":"Ser polihidroxialdehídos o polihidroxicetonas.","c":"Estar compuestos por C, H y O.","d":"Todas son correctas."},"c":"d","ok":"Químicamente se definen como polihidroxialdehídos o polihidroxicetonas (o sus polímeros) formados por carbono, hidrógeno y oxígeno. Constituyen la fuente primaria e inmediata de combustible metabólico para las células.","bad":{"a":"«Representar la principal fuente de energía para la célula.»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","b":"«Ser polihidroxialdehídos o polihidroxicetonas.»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","c":"«Estar compuestos por C, H y O.»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización."}},{"n":"6","q":"Los polisacáridos:","o":{"a":"Se dividen en homopolisacáridos y heteropolisacáridos.","b":"Poseen hasta 10 monómeros unidos.","c":"Están formados por lactosa y otro monosacárido.","d":"Conforman el glucocálix."},"c":"a","ok":"Se clasifican estructuralmente según su composición en homopolisacáridos (formados por un único tipo de monosacárido, como la glucosa en el glucógeno) y heteropolisacáridos (formados por más de un tipo de monosacárido).","bad":{"b":"«Poseen hasta 10 monómeros unidos.»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","c":"«Están formados por lactosa y otro monosacárido.»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización.","d":"«Conforman el glucocálix.»: es incorrecta porque los carbohidratos pueden actuar como monómeros o polímeros y cumplir funciones de reserva o estructurales según su composición y organización."}},{"n":"7","q":"Los monosacáridos son aquellos glúcidos que:","o":{"a":"Son llamados también azúcares complejos.","b":"Están compuestos por polímeros de glucosa.","c":"Son monómeros de moléculas más complejas.","d":"No poseen actividad óptica."},"c":"c","t":"Son las unidades monoméricas más simples de los hidratos de carbono que no pueden hidrolizarse en glúcidos más sencillos. Funcionan como los bloques de construcción de oligosacáridos y p"}];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mazo,idx,resp,ac,er,rk,mk,fal,sal,modo,AC;
function barajar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(seq){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);t+=d}}catch(e){}}
function iniciar(lista,m){mazo=barajar(lista);modo=m;idx=0;resp=false;ac=er=rk=mk=0;fal=[];sal=[];$('#pb').style.width='0';render()}
function hud(){const n=ac+er,t=mazo.length,c=idx+(resp?1:0);
$('#hr').textContent=`🔥 Racha ${rk} (récord ${mk})`;$('#ha').textContent=`✅ ${ac}`;$('#he').textContent=`❌ ${er}`;
$('#hp').textContent=n?`🎯 ${Math.round(100*ac/n)}%`:'🎯 --%';
$('#pt').textContent=`${modo=='repaso'?'Repaso':'Pregunta'} ${Math.min(idx+1,t)} de ${t}`;
$('#pr').textContent=`Quedan ${t-c} · saltadas ${sal.length}`;
$('#pb').style.width=(100*c/t)+'%'}
function btns(){$('#bn').disabled=!resp;$('#bs').disabled=resp||idx>=mazo.length}
function render(){const q=mazo[idx],m=$('#main');hud();
if(!q){final();btns();return}
m.innerHTML=`<div class="card"><small>${modo=='repaso'?'🔁 Repaso':'❓ Pregunta'} · n.º original ${esc(q.n)}</small><h2>${esc(q.q)}</h2></div>`+
Object.keys(q.o).sort().map(l=>`<button class="op" data-l="${l}"><b>${l.toUpperCase()}</b><span>${esc(q.o[l])}</span></button>`).join('')+'<div id="ex"></div>';
m.querySelectorAll('.op').forEach(b=>b.onclick=()=>responder(b.dataset.l));btns();window.scrollTo(0,0)}
function responder(l){if(resp||idx>=mazo.length)return;resp=true;const q=mazo[idx],ok=l==q.c;
if(ok){ac++;rk++;mk=Math.max(mk,rk);beep([[660,.09],[990,.16]])}else{er++;rk=0;fal.push(q);beep([[220,.17],[140,.32]])}
document.querySelectorAll('.op').forEach(b=>{b.disabled=true;const x=b.dataset.l;b.classList.add(x==q.c?'ok':x==l?'mal':'dim')});
let h=`<div class="res ${ok?'g':'r'}">${ok?'🎉 ¡Correcto!'+(rk>1?' 🔥 x'+rk:''):'💥 Incorrecto: elegiste la '+l.toUpperCase()}</div>`;
const cab=`✅ Correcta: ${q.c.toUpperCase()}) ${esc(q.o[q.c])}`;
if(q.ok){h+=`<div class="box g"><b>${cab}</b><p>${esc(q.ok)}</p></div><div class="box r"><b>❌ Por qué se descartan las demás</b>`+
Object.keys(q.bad).sort().map(x=>{const mm=q.bad[x].match(/^(«.*?»)\s*:\s*([\s\S]*)$/);
return `<div class="d ${x==l?'sel':''}"><b>${x.toUpperCase()}</b><div><i>${esc(mm?mm[1]:'«'+q.o[x]+'»')}${x==l?' ◀ tu respuesta':''}</i><p>${esc(mm?mm[2]:q.bad[x])}</p></div></div>`}).join('')+'</div>'}
else h+=`<div class="box g"><b>${cab}</b><p>${esc(q.t||'')}</p></div>`;
const ex=$('#ex');ex.innerHTML=h;ex.scrollIntoView({behavior:'smooth',block:'start'});hud();btns()}
function siguiente(){if(!resp)return;idx++;resp=false;render()}
function saltar(){if(resp||idx>=mazo.length)return;sal.push(mazo[idx]);idx++;render()}
function reiniciar(){if((idx>0||resp)&&idx<mazo.length&&!confirm('Se vuelve a mezclar todo el mazo y se pierden los puntajes. ¿Continuar?'))return;iniciar(D,'parcial')}
function final(){const n=ac+er,ef=n?Math.round(100*ac/n):0,p=fal.length+sal.length;
$('#main').innerHTML=`<div class="fin"><h2>${ef>=80?'🏆':ef>=60?'🥈':'📚'} ¡Mazo completado!</h2><p>✅ Aciertos: ${ac} · ❌ Errores: ${er} · ⏭ Saltadas: ${sal.length}<br>🎯 Efectividad: ${ef}% · 🔥 Mejor racha: ${mk}</p>`+
(p?`<button style="background:var(--ac)" id="rp">🔁 Repasar falladas y saltadas (${p})</button>`:'')+`<button style="background:#5A1E3A" id="nw">🔄 Nuevo parcial</button></div>`;
if(p)$('#rp').onclick=()=>iniciar(fal.concat(sal),'repaso');$('#nw').onclick=()=>iniciar(D,'parcial')}
$('#bn').onclick=siguiente;$('#bs').onclick=saltar;$('#br').onclick=reiniciar;
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase(),q=mazo[idx];
if(q&&q.o[k]&&k.length==1)responder(k);else if(k=='enter'||k=='arrowright'||k==' '){if(resp){e.preventDefault();siguiente()}}else if(k=='s')saltar()});
iniciar(D,'parcial');
</script>
